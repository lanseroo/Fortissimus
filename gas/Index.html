<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('Stylesheet'); ?>

    <!-- three.js (ES modules) via CDN import map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <h1 class="title">Fortissimus — Playtable</h1>

    <div id="toolbar">
      <fieldset>
        <legend>Board</legend>
        <select id="boardSelect"></select>
      </fieldset>

      <fieldset>
        <legend>Active color</legend>
        <span class="swatches">
          <button class="sw active" style="background:#2f6fdb" data-color="Blue"   title="Blue"></button>
          <button class="sw"        style="background:#2ea84f" data-color="Green"  title="Green"></button>
          <button class="sw"        style="background:#7b3fb0" data-color="Purple" title="Purple"></button>
          <button class="sw"        style="background:#f5b800" data-color="Yellow" title="Yellow"></button>
        </span>
      </fieldset>

      <fieldset>
        <legend>Minis</legend>
        <select id="modelSelect"></select>
        <button id="addMini">Add mini</button>
      </fieldset>

      <fieldset>
        <legend>Tokens (active color)</legend>
        <button id="addChariot">Chariot</button>
        <button id="addPlebe">Plebe</button>
        <button id="addCheer">Cheer</button>
        <button id="addJeer">Jeer</button>
      </fieldset>

      <fieldset>
        <legend>Currency</legend>
        <button id="addCoin">Coin</button>
        <button id="addLightning">Lightning</button>
        <button id="addSun">Sun</button>
        <button id="addIncome">Income</button>
      </fieldset>

      <fieldset>
        <legend>Cards</legend>
        <select id="heroSelect"></select>
        <button id="addHero">Add hero</button>
        <button id="addCardBack">Card back</button>
      </fieldset>

      <fieldset>
        <legend>Dice</legend>
        <input id="diceCount" type="number" min="1" max="12" value="2" style="width:3em">
        <button id="rollDice">Roll</button>
        <button id="reroll">Reroll</button>
        <span id="diceTotal" class="dtot">Dice: —</span>
      </fieldset>

      <fieldset>
        <legend>View</legend>
        <button id="resetView">Reset</button>
        <button id="clearBtn">Clear pieces</button>
      </fieldset>
    </div>

    <div id="stage">
      <div id="viewer"></div>
      <div id="vpPanel">
        <h3>Victory Points</h3>
        <div class="vp" data-color="Blue"><span class="dot" style="background:#2f6fdb"></span>
          <button class="dec">–</button><span class="val">0</span><button class="inc">+</button></div>
        <div class="vp" data-color="Green"><span class="dot" style="background:#2ea84f"></span>
          <button class="dec">–</button><span class="val">0</span><button class="inc">+</button></div>
        <div class="vp" data-color="Purple"><span class="dot" style="background:#7b3fb0"></span>
          <button class="dec">–</button><span class="val">0</span><button class="inc">+</button></div>
        <div class="vp" data-color="Yellow"><span class="dot" style="background:#f5b800"></span>
          <button class="dec">–</button><span class="val">0</span><button class="inc">+</button></div>
        <p class="hint">Click a piece to select, drag to move, <b>Delete</b> to remove. Drag empty space to orbit; scroll to zoom.</p>
      </div>
    </div>

    <!-- Expose the repo asset base to the client -->
    <script>window.ASSET_BASE = "<?= ASSET_BASE ?>";</script>
    <?!= include('JS_App'); ?>
    <?!= include('JS_UI'); ?>
  </body>
</html>
