  // winner is whoever survives the MOST rounds. `rerolls(stats)` is the count of FREE rerolls a
  // hero gets. Podium rewards are shared/unchanged (see scoreEvent).
  const EVENT_RULES = {
    'WrestlingEvent.png': {
      name: 'Wrestling', dir: 'max', dice: 2, rerolls: () => 0,
      objective: 'furthest from 7 wins (Str above, Speed below)',
      rome: [4, 5, 6],                               // CPU Rome's fixed score by Act (grey 1/2/3)
      score: (sum, st) => sum > 7 ? (sum - 7) + st.str : sum < 7 ? (7 - sum) + st.speed : 0,
      // sponsor: standard 1–4 VP ladder (race steps) + ⚡/☀ kicker; rungs 3/4/5/6 (aligned board).
      sponsor: (v) => v >= 6 ? { vp: 4, zap: 2, sun: 2 } : v >= 5 ? { vp: 3, zap: 2, sun: 1 }
                    : v >= 4 ? { vp: 2, zap: 1, sun: 1 } : v >= 3 ? { vp: 1, zap: 1 } : null,
    },
    'DiscusEvent.png': {
      name: 'Discus', dir: 'max', dice: 2, rerolls: () => 0,
      objective: 'sum + Strength, highest wins',
      rome: [10, 11, 12],                            // CPU Rome's fixed score by Act (grey 1/2/3)
      score: (sum, st) => sum + st.str,
      // sponsor: standard 1–4 VP ladder + ⚡/☀ kicker; rungs 10/11/12/13, gold ⚡1☀3 (≈ Sprint value).
      sponsor: (v) => v >= 13 ? { vp: 4, zap: 1, sun: 3 } : v >= 12 ? { vp: 3, zap: 1, sun: 2 }
                    : v >= 11 ? { vp: 2, zap: 1, sun: 1 } : v >= 10 ? { vp: 1, zap: 1 } : null,
    },
    'SprintEvent.png': {
      name: 'Sprint', dir: 'min', dice: 2, rerolls: () => 0,
      objective: 'sum − Speed, LOWEST wins (can go negative)',
      rome: [4, 3, 2],                               // CPU Rome by Act (grey 1/2/3); lower = harder
      score: (sum, st) => sum - st.speed,            // no floor — Speed/Jeer can push it negative
      // sponsor: standard 1–4 VP ladder + ⚡/☀ kicker; LOWEST wins, 4 rungs 4/3/2/≤1 (beating ≤1
      // just earns the top rung — no extra). v≥5 earns nothing.
      sponsor: (v) => v <= 1 ? { vp: 4, zap: 2, sun: 2 } : v === 2 ? { vp: 3, zap: 2, sun: 1 }
                    : v === 3 ? { vp: 2, zap: 1, sun: 1 } : v === 4 ? { vp: 1, zap: 1 } : null,
    },
    'LongJumpEvent.png': {
      name: 'Long Jump', dir: 'max', longJump: true, rerolls: () => 0,
      objective: 'run-up = 1d (+opt 1d) + up-to-Speed, capped at 10 (dice > 10 = SCRATCH); + jump 1d + Str; highest wins',
      rome: [11, 13, 15],                            // CPU Rome's fixed score by Act (grey 1/2/3)
      // sponsor: standard 1–4 VP ladder + 🪙/⚡ kicker (coin-flavored); rungs 11/13/15/17.
      sponsor: (v) => v >= 17 ? { vp: 4, coin: 3, zap: 2 } : v >= 15 ? { vp: 3, coin: 3, zap: 1 }
                    : v >= 13 ? { vp: 2, coin: 2, zap: 1 } : v >= 11 ? { vp: 1, coin: 2 } : null,
    },
    'HighJumpEvent.png': {
      name: 'High Jump', dir: 'max', multiRound: true, rerolls: () => 0,
      objective: 'clear the bar (2d + Strength ≥ bar) each round; most rounds survived wins',
      rome: [1, 2, 3],                               // CPU Rome's fixed rounds-survived by Act (grey 1/2/3)
      rounds: [
        { dice: 2, bar: 6,  label: 'bar 6'  },
        { dice: 2, bar: 8,  label: 'bar 8'  },
        { dice: 2, bar: 10, label: 'bar 10' },
        { dice: 2, bar: 12, label: 'bar 12' },
      ],
      passes: (sum, st, round) => (sum + st.str) >= round.bar,
      roundValue: (sum, st) => sum + st.str,
      // sponsor: standard 1–4 VP ladder + ⚡/☀ kicker; top rung (all bars) = Income Recollect perk.
      sponsor: (v) => v >= 4 ? { vp: 4, sun: 1, note: 'Income Recollect' } : v >= 3 ? { vp: 3, zap: 2, sun: 2 }
                    : v >= 2 ? { vp: 2, zap: 1, sun: 1 } : v >= 1 ? { vp: 1, zap: 1 } : null,
    },
    'ArcheryEvent.png': {
      name: 'Archery', dir: 'max', multiRound: true, rerolls: () => 0, nudge: true,
      objective: '2 dice ± up-to-Speed (aim) must land in the round’s band; most rounds survived wins',
      rome: [1, 2, 3],                               // CPU Rome's fixed rounds-survived by Act (grey 1/2/3)
      rounds: [
        { dice: 2, lo: 7, hi: 9,  label: '7–9'  },
        { dice: 2, lo: 9, hi: 10, label: '9–10' },
        { dice: 2, lo: 4, hi: 5,  label: '4–5'  },
        { dice: 2, lo: 3, hi: 4,  label: '3–4'  },
      ],
      passes: (tot, st, round) => tot >= round.lo && tot <= round.hi,  // tot = dice + aim nudge (heroTotal)
      roundValue: (tot) => tot,
      // sponsor: standard 1–4 VP ladder + 🪙/⚡ kicker (coin-flavored); top rung adds a free market hero.
      sponsor: (v) => v >= 4 ? { vp: 4, coin: 4, zap: 2, note: 'free market hero' } : v >= 3 ? { vp: 3, coin: 4, zap: 1 }
                    : v >= 2 ? { vp: 2, coin: 3, zap: 1 } : v >= 1 ? { vp: 1, coin: 2 } : null,
    },
  };
  // Active mini-game file in each of the 3 event slots (0-2), seeded from LAYOUT and kept
  // in sync by setEventSlot — used to look up a competing hero's required dice count.
  const eventFiles = (() => {
    const f = [];
    for (const b of LAYOUT) if (b.slot !== undefined) f[b.slot] = b.file;
    return f;
  })();
  const rollFace = () => 1 + Math.floor(Math.random() * 6);
  let selectedHeroId = null;          // which competing mini the panel actions target

  // Reset one color's cup to its income-rung base of blank (unrolled) dice for a new round.
  function resetCup(color) {
    GAME.cup[color] = new Array(cupBaseFor(color)).fill(null);
    GAME.cupRolled[color] = false;
    GAME.exchanged[color] = {};                  // ⚡/☀ → coin trade resets: once per resource per round
  }
  // Seed every faction's cup (all blank) at game setup.
  function initCup() { for (const c of ALL_COLORS) resetCup(c); }

  // Roll the cup — ONCE per round. Fills every die; locks until next round's reset.
  // In Upkeep rolling is your LAST action: after buying dice & exchanging, the roll ENDS your
  // turn (auto-passes to the next player). Buy/exchange must happen before the roll.
  function rollCup(color) {
    const arr = GAME.cup[color]; if (!arr || GAME.cupRolled[color]) return;
    for (let i = 0; i < arr.length; i++) arr[i] = rollFace();
    GAME.cupRolled[color] = true;
    if (curPhase() === 'Upkeep' && color === curPlayer()) {
      // Rolling ends your turn. Once EVERY seated player has rolled, auto-advance the phase
      // instead of looping back to the first player (D2).
      if (GAME.order.every((c) => !!GAME.cupRolled[c])) nextPhase();
      else nextPlayer();
      return;
    }
    notifyFlow();
  }

  // Buy a cup die with Lightning: 1⚡ → +1 die, only BEFORE the round's single roll.
  function addCupDie(color) {
    const r = GAME.res[color]; if (!r || r.zap < DIE_ZAP_COST || GAME.cupRolled[color]) return;
    if (!GAME.cup[color]) GAME.cup[color] = [];
    GAME.cup[color].push(null);                // blank; filled by the one roll
    adjustRes(color, 'zap', -DIE_ZAP_COST);    // notifies
    notifyFlow();
  }

  // Upkeep exchange: spend 1⚡ or 1☀ for 2🪙.
  function exchangeForCoin(color, kind) {
    if (kind !== 'zap' && kind !== 'sun') return;
    const r = GAME.res[color]; if (!r || r[kind] < 1) return;
    const ex = GAME.exchanged[color] || (GAME.exchanged[color] = {});
    if (ex[kind]) return;                       // this resource's trade is spent for the round (D6)
    ex[kind] = true;
    adjustRes(color, kind, -1);                // notifies
    adjustRes(color, 'coin', COIN_PER_EXCHANGE);
    notifyFlow();                              // refresh the (now-disabled) exchange button
  }

  // ---- per-hero event dice ----
  const findMini = (id) => pieces.find((p) => p.userData.type === 'mini' && p.userData.id === id) || null;
  const findCard = (id) => pieces.find((p) => p.userData.type === 'card' && p.userData.id === id) || null;
  const selectedMini = () => findMini(selectedHeroId);
  // A hero's raw dice total (+ Cheer/Jeer adjustment + Archery ±Speed aim nudge, 0 elsewhere). Used
  // for the Colosseum (flat) and as the raw input to per-event scoring; competition standing goes
  // through eventScore/eventCompare.
  const heroTotal = (m) => (m.userData.eventDice || []).reduce((a, b) => a + b, 0)
    + (m.userData.diceAdj || 0) + (m.userData.archNudge || 0);

  // Which slot index (0-2) an event-grid mini's strip maps to → its active mini-game.
  // Strips sit at board x -125/0/125 = active event slots 0/1/2 (same columns).
  const eventSlotIndex = (bx) => (bx < 0 ? 0 : bx > 0 ? 2 : 1);

  // ---- per-event scoring engine (rules-draft §5) ----
  // Parse Str/Speed from a card face. Two named formats carry stats:
  //   market/faction heroes `S_P_Hero.png`  ·  new plebes `Plebe<Color><Str>_<Speed>.png`.
  // The old `<Color>Pliebe.png` (and anything else) carries none → treated as 1/1.
  function statFace(face) {
    let m = /^(\d)_(\d)_Hero/.exec(face || '');
    if (!m) m = /^Plebe[A-Za-z](\d)_(\d)/.exec(face || '');
    return m ? { str: +m[1], speed: +m[2] } : null;
  }
  function heroStats(mini) {
    return statFace(miniCardInfo(mini).face) || { str: 1, speed: 1 };
  }
  const isAlive = (m) => !m.userData.eliminated;
  // The §5 rules entry behind a mini / an event key (null for Colosseum or no special rule).
  const rulesForKey = (key) => (key === null || key === undefined || key === 'ColosseumBoard.png')
    ? null : (EVENT_RULES[eventFiles[key]] || null);
  const rulesFor = (mini) => {
    const s = mini.userData.slot; if (!s || !s.event) return null;
    return EVENT_RULES[eventFiles[eventSlotIndex(s.bx)]] || null;
  };
  // ---- CPU Rome: a virtual competitor at every contested event (rules-draft §14.A) ----
  // Rome rolls nothing; its result is the grey 1/2/3 icon printed on the board, picked by the
  // current Act (I=R1-3, II=R4-5, III=R6). A single-shot event uses the printed score; a
  // multi-round event uses a fixed rounds-survived count. Rome takes a real podium slot (shoving
  // the nations down) but DISCARDS every reward it would win; each event it wins advances its
  // black chariot. `romeFor(key)` returns a mini-shaped object flagged `isRome`, or null when
  // Rome doesn't compete (Colosseum / rules without a `rome` table).
  const romeAct = () => (GAME.round <= 3 ? 0 : GAME.round <= 5 ? 1 : 2);
  function romeFor(key) {
    const rules = rulesForKey(key);
    if (!rules || !Array.isArray(rules.rome)) return null;
    const v = rules.rome[romeAct()];
    return { isRome: true, userData: {
      color: 'Rome', id: 'rome:' + key, sym: null,
      romeScore: v, roundsSurvived: rules.multiRound ? v : 0,
      eliminated: false, eventDice: [], diceAdj: 0,
    } };
  }
  // A single-shot event score for a mini: { score, foul }. Multi-round events score by rounds
  // survived (tracked on the mini); Long Jump folds an approach (may foul) + a jump.
  function eventScore(mini, key) {
    const rules = rulesForKey(key);
    if (mini.isRome) return { score: (rules && rules.multiRound) ? (mini.userData.roundsSurvived || 0) : mini.userData.romeScore, foul: false };
    const st = heroStats(mini);
    const dice = mini.userData.eventDice || [];
    const adj = mini.userData.diceAdj || 0;
    if (!rules) return { score: dice.reduce((a, b) => a + b, 0) + adj, foul: false };
    if (rules.multiRound) return { score: mini.userData.roundsSurvived || 0, foul: !!mini.userData.eliminated };
    if (rules.longJump) {
      const appN = 1 + (mini.userData.ljExtra ? 1 : 0);
      const diceBase = dice.slice(0, appN).reduce((a, b) => a + b, 0);    // approach dice only (no cushion)
      if (diceBase > 10) return { score: 0, foul: true };                 // over the line → SCRATCH (out)
      const runup = Math.min(diceBase + st.speed, 10);                    // up-to-Speed cushion, capped at 10
      const jd = dice.slice(appN);                                        // jump die (empty mid-approach)
      const jump = jd.length ? jd.reduce((a, b) => a + b, 0) + st.str : 0; // +Str only once the jump is taken
      return { score: runup + jump + adj, foul: false };
    }
    return { score: rules.score(dice.reduce((a, b) => a + b, 0) + adj, st), foul: false };
  }
  // Display string for the standings/podium/modal: score, FOUL, or "nR" rounds. `live` shows the
  // current round's value (sum±) for a multi-round event mid-round instead of rounds-survived.
  function eventDisplay(mini, key, live) {
    const rules = rulesForKey(key);
    if (mini.isRome) return (rules && rules.multiRound) ? ((mini.userData.roundsSurvived || 0) + 'R') : String(mini.userData.romeScore);
    if (rules && rules.multiRound) {
      if (live && isAlive(mini)) return String(rules.roundValue(heroTotal(mini), heroStats(mini)));
      return (mini.userData.roundsSurvived || 0) + 'R';
    }
    const s = eventScore(mini, key);
    return s.foul ? 'FOUL' : String(s.score);
  }
  // Ranking comparator for an event key: multi-round by rounds survived; single-shot by score in
  // the win-direction with FOULs sorted last; ties broken by turn order.
  function eventCompare(key) {
    const rules = rulesForKey(key);
    const oi = (c) => GAME.order.indexOf(c);
    if (rules && rules.multiRound) {
      return (a, b) => (b.userData.roundsSurvived || 0) - (a.userData.roundsSurvived || 0)
        || oi(a.userData.color) - oi(b.userData.color);
    }
    const dir = rules ? rules.dir : 'max';
    return (a, b) => {
      const sa = eventScore(a, key), sb = eventScore(b, key);
      if (sa.foul !== sb.foul) return sa.foul ? 1 : -1;                   // fouls last
      const d = dir === 'min' ? sa.score - sb.score : sb.score - sa.score;
      return d || oi(a.userData.color) - oi(b.userData.color);
    };
  }
  // Do two heroes share a place at this event? (equal standing for the tie-aware podium.)
  function eventTied(a, b, key) {
    const rules = rulesForKey(key);
    if (rules && rules.multiRound) return (a.userData.roundsSurvived || 0) === (b.userData.roundsSurvived || 0);
    const sa = eventScore(a, key), sb = eventScore(b, key);
    return sa.foul === sb.foul && sa.score === sb.score;
  }

  // Dice a competing mini needs for its current event. Multi-round → the CURRENT round's count
  // (0 once eliminated). Long Jump → approach (1 +opt) + jump (1), collapsing to just the approach
  // once the approach dice pass the line (>10 = scratch, no jump). Else the event's flat count.
  function requiredFor(mini) {
    const s = mini.userData.slot; if (!s) return 0;
    if (mini.userData.favorAutoPass) return 0;            // Mercury: this round is credited free, no dice
    if (s.boardKey === 'ColosseumBoard.png') return 0;   // no manual roll — arena positions are auto-rolled at startColosseum
    if (!s.event) return DICE_PER_EVENT_DEFAULT;
    const rules = EVENT_RULES[eventFiles[eventSlotIndex(s.bx)]];
    if (!rules) return DICE_PER_EVENT_DEFAULT;
    if (rules.multiRound) {
      if (mini.userData.eliminated) return 0;
      return (rules.rounds[GAME.eventRound] || rules.rounds[rules.rounds.length - 1]).dice;
    }
    if (rules.longJump) {
      const appN = 1 + (mini.userData.ljExtra ? 1 : 0);
      const app = (mini.userData.eventDice || []).slice(0, appN);
      if (app.length >= appN && app.reduce((a, b) => a + b, 0) > 10) return appN; // scratch → no jump die
      return appN + 1;
    }
    return rules.dice;
  }
  // Dice a hero may hold RIGHT NOW (the draw/roll gate). Same as requiredFor except Long Jump:
  // the jump die stays locked behind the approach until the player commits it (ljStage==='jump').
  // requiredFor stays the TOTAL (drives the "full"/participant gate); assignCap gates adding dice.
  function assignCap(mini) {
    const rules = rulesFor(mini);
    if (rules && rules.longJump && !mini.userData.eliminated) {
      const appN = 1 + (mini.userData.ljExtra ? 1 : 0);
      const app = (mini.userData.eventDice || []).slice(0, appN);
      const fouled = app.length >= appN && app.reduce((a, b) => a + b, 0) > 10;
      if (fouled) return appN;                                   // scratch locks the field at the approach
      return mini.userData.ljStage === 'jump' ? appN + 1 : appN; // jump die unlocks only after commit
    }
    return requiredFor(mini);
  }
  // Reset a hero's free-reroll allowance for its current event/round.
  function seedRerolls(mini) {
    const rules = rulesFor(mini);
    mini.userData.rerollsLeft = (rules && rules.rerolls) ? rules.rerolls(heroStats(mini)) : 0;
  }
  // ---- guided event walk: step left→right through events, players in turn order ----
  // The ordered event "keys" the current phase walks: Colosseum = one arena; Resolution =
  // slots 0/1/2 (left→right). Any other phase has no walk.
  function eventOrder() {
    const phase = curPhase();
    if (phase === 'Colosseum') return ['ColosseumBoard.png'];
    if (phase === 'Resolution & Podiums') return [0, 1, 2];
    return [];
  }
  // The active-event file behind an event key (for reward/dice lookups & labels).
  const eventFileOf = (key) => (key === 'ColosseumBoard.png' ? key : eventFiles[key]);
  // Competing minis scoped to ONE event key.
  function minisAtEvent(key) {
    return pieces.filter((p) => {
      if (p.userData.type !== 'mini') return false;
      const s = p.userData.slot; if (!s) return false;
      if (key === 'ColosseumBoard.png') return s.boardKey === 'ColosseumBoard.png';
      return s.event === true && eventSlotIndex(s.bx) === key;
    });
  }
  // All minis competing this phase (union across its events) — used to clear/validate.
  const competingMinis = () => eventOrder().flatMap(minisAtEvent);
  // Players (in turn order) that own ≥1 STILL-ALIVE mini at an event (eliminated multi-round
  // heroes drop out of the walk; single-shot heroes are always alive).
  const eventParticipants = (key) =>
    GAME.order.filter((c) => minisAtEvent(key).some((m) => m.userData.color === c && isAlive(m)));
  // Minis eligible to be Cheered/Jeered this event/round (alive-only for multi-round events).
  const eventTargets = (key) => {
    const rules = rulesForKey(key);
    const all = minisAtEvent(key);
    return (rules && rules.multiRound) ? all.filter(isAlive) : all;
  };
  // Only events with someone competing take part in the walk (empties are skipped).
  const nonEmptyEvents = () => eventOrder().filter((k) => minisAtEvent(k).length);
  // The walk order is FROZEN at phase entry (GAME.eventKeys) — resolving a mini moves it off
  // its event slot, so computing "non-empty events" live would shrink the list mid-walk and
  // skip the next event. Index into the frozen list instead.
  const curEventKey = () => GAME.eventKeys[GAME.eventIndex] ?? null;
  const curEventPlayer = () => { const k = curEventKey(); return k === null ? null : (eventParticipants(k)[GAME.evtTurnIndex] ?? null); };
  const eventBoardMesh = (key) => (key === 'ColosseumBoard.png'
    ? boardMeshes.find((m) => m.userData.boardKey === 'ColosseumBoard.png')
    : eventSlots[key]);
  // A player is "full" at an event once all their minis there have their required dice.
  const participantFull = (color, key) => key !== null && color !== null &&
    minisAtEvent(key).filter((m) => m.userData.color === color)
      .every((m) => (m.userData.eventDice || []).length >= requiredFor(m));
  const eventEveryoneFull = (key) => key !== null &&
    eventParticipants(key).every((c) => participantFull(c, key));
  const eventWalkComplete = () => GAME.eventIndex >= GAME.eventKeys.length;

  // Next player ▶ during an event phase: pass to the next participant at the current event
  // once the current one has diced all their heroes. No-op on the last participant.
  function nextEventParticipant() {
    const k = curEventKey(); if (k === null) return;
    if (!participantFull(curEventPlayer(), k)) return;               // gate: finish your heroes
    if (GAME.evtTurnIndex >= eventParticipants(k).length - 1) return; // last — resolve instead
    GAME.evtTurnIndex++;
    activeColorName = curEventPlayer();
    selectedHeroId = null;
    if (eventBoardMesh(k)) focusBoard(eventBoardMesh(k));
    notifyFlow();
  }

  // ---- Colosseum-ticket / "waiting for Colosseum" subsystem (Chunk A) ----
  // A "waiting" mini is committed to the next Colosseum: it sits on top of its own hero
  // card (visual "unavailable" cue) and is locked until the Colosseum seats it. Max 3/player.
  const TICKET_FEE = 1;                                    // ☀ to send a mini to the Colosseum waiting bench
  const WAIT_CAP   = 3;                                    // max waiting minis per player
  const waitingMinisOf = (color) => pieces.filter((p) =>
    p.userData.type === 'mini' && p.userData.color === color && p.userData.waiting);
  const waitingCount = (color) => waitingMinisOf(color).length;
  const cardSlotOf = (mini) => {
    const color = mini.userData.color, sym = mini.userData.sym ?? null;
    return sym === null ? null : (SLOTS.find((s) => s.role === 'card' && s.owner === color && s.sym === sym) || null);
  };
  const homeCircleOf = (mini) => slotsByRole('hero-market', mini.userData.color).find((s) => s.sym === mini.userData.sym) || null;
  const discardSlotOf = (color) => slotsByRole('discard', color)[0] || null;

  // Commit a mini to the Colosseum: seat it on top of its own hero card + lock it.
  function sendToWaiting(mini) {
    mini.userData.waiting = true;
    mini.userData.locked = true;
    mini.userData.eventDice = [];
    mini.userData.diceAdj = 0;
    // Drop any multi-round event state (a hero eliminated in Archery/High Jump this round can win
    // a Colosseum ticket while still flagged eliminated → it'd read OUT in the arena and could never
    // be diced, deadlocking the Colosseum dice-walk). A fresh fighter is never eliminated. (D1)
    mini.userData.eliminated = false; mini.userData.roundsSurvived = 0;
    mini.userData.ljExtra = false; mini.userData.ljStage = 'approach'; mini.userData.rerollsLeft = 0;
    if (mini.userData.diceGroup) renderHeroDice3D(mini);
    const cs = cardSlotOf(mini);
    if (cs) placeOnSlot(mini, cs);                          // lands on top of its card
  }
  // Send a losing mini home + discard its tied hero card (frees the sym for a new hero).
  function sendHomeDiscard(mini) {
    const cs = cardSlotOf(mini);
    const card = cs && cs.occupants.slice().reverse().find((o) => o !== mini && o.userData.type === 'card');
    const disc = discardSlotOf(mini.userData.color);
    if (card && disc) {
      placeOnSlot(card, disc);
      card.userData.zone = 'discard';
      setCardFace(card, card.userData.face);               // face-up on the pile
    }
    mini.userData.waiting = false;
    mini.userData.locked = false;
    mini.userData.eventDice = [];
    mini.userData.diceAdj = 0;
    mini.userData.eliminated = false; mini.userData.roundsSurvived = 0;   // home resets per-event status
    mini.userData.ljExtra = false; mini.userData.ljStage = 'approach'; mini.userData.rerollsLeft = 0;
    if (mini.userData.diceGroup) renderHeroDice3D(mini);
    const hc = homeCircleOf(mini);
    if (hc) placeOnSlot(mini, hc);
  }
  // Grant a mini a Colosseum ticket → to waiting, unless already at the 3-cap (then defer:
  // the owner must release one waiting mini to make room, via the modal).
  function grantTicket(mini) {
    const color = mini.userData.color;
    if (waitingCount(color) < WAIT_CAP) sendToWaiting(mini);
    else GAME.colWait.releaseQueue.push({ color, seatMiniId: mini.userData.id });
  }

  // The current modal step for the waiting-decision walk, or null when the queue is drained.
  function colWaitStep() {
    const cw = GAME.colWait; if (!cw) return null;
    if (cw.releaseQueue.length) {
      const { color } = cw.releaseQueue[0];
      const options = waitingMinisOf(color).map((m) => {
        const ci = miniCardInfo(m);
        const st = statFace(ci.face);
        const stats = st ? ('Str ' + st.str + ' · Spd ' + st.speed) : 'Plebe';
        return { miniId: m.userData.id, sym: m.userData.sym ?? null, symImg: ci.symImg, face: ci.face, stats };
      });
      return { kind: 'release', color, options };
    }
    if (cw.payQueue.length) {
      const m = findMini(cw.payQueue[0]);
      if (!m) { cw.payQueue.shift(); return colWaitStep(); }
      const ci = miniCardInfo(m), color = m.userData.color;
      return { kind: 'pay', miniId: m.userData.id, color, sym: m.userData.sym ?? null,
               symImg: ci.symImg, face: ci.face, fee: TICKET_FEE,
               won: ((cw.places || {})[m.userData.id]) === 0,   // 1st place → word the prompt as a win
               canAfford: (GAME.res[color]?.sun || 0) >= TICKET_FEE };
    }
    return null;
  }
  const advanceColWait = () => { if (!colWaitStep()) finishEventResolution(); else notifyFlow(); };
  // Pay TICKET_FEE ☀ to send this mini to the Colosseum waiting bench (may trigger a release step if at cap).
  function colWaitPay(miniId) {
    const cw = GAME.colWait; if (!cw || cw.releaseQueue.length || cw.payQueue[0] !== miniId) return;
    const m = findMini(miniId); if (!m) return;
    const color = m.userData.color;
    if ((GAME.res[color]?.sun || 0) < TICKET_FEE) return;
    adjustRes(color, 'sun', -TICKET_FEE);
    cw.payQueue.shift();
    grantTicket(m);
    advanceColWait();
  }
  // Decline: send this mini home + discard its card.
  function colWaitSkip(miniId) {
    const cw = GAME.colWait; if (!cw || cw.releaseQueue.length || cw.payQueue[0] !== miniId) return;
    const m = findMini(miniId); if (!m) return;
    cw.payQueue.shift();
    sendHomeDiscard(m);
    advanceColWait();
  }
  // At the 3-cap: release the chosen waiting mini (card discarded, home), seat the pending one.
  function colWaitRelease(miniId) {
    const cw = GAME.colWait; if (!cw || !cw.releaseQueue.length) return;
    const { color, seatMiniId } = cw.releaseQueue[0];
    const rel = findMini(miniId); if (!rel || rel.userData.color !== color || !rel.userData.waiting) return;
    cw.releaseQueue.shift();
    sendHomeDiscard(rel);                                   // frees a waiting slot
    const seat = findMini(seatMiniId);
    if (seat) sendToWaiting(seat);                          // now under cap
    advanceColWait();
  }

  // ---- Market shop (Market phase) ---------------------------------------------------------
  // A revealed market hero costs resources keyed on its (unordered) stat pair; some pairs offer
  // two payment options (rules-draft §3). Bought cards go to the buyer's DISCARD (into their deck
  // on the next reshuffle). The 3-slot display restocks (with replacement from GAME.marketPool)
  // whenever the turn passes to the next player, so each shopper sees a full board.
  const HERO_COSTS = {
    '12': [{ coin: 3, zap: 1 }, { coin: 1, zap: 2 }],
    '22': [{ zap: 3 }],
    '13': [{ zap: 3 }, { coin: 1, zap: 2 }],
    '23': [{ zap: 2, sun: 1 }, { sun: 2 }],
    '33': [{ zap: 2, sun: 2 }],
  };
  function heroCostOptions(face) {
    const m = /^(\d)_(\d)_Hero/.exec(face || ''); if (!m) return [];
    const key = [+m[1], +m[2]].sort().join('');
    return (HERO_COSTS[key] || []).map((c) => ({ coin: c.coin || 0, zap: c.zap || 0, sun: c.sun || 0 }));
  }
  const canAfford = (color, cost) => {
    const r = GAME.res[color] || {};
    return (r.coin || 0) >= cost.coin && (r.zap || 0) >= cost.zap && (r.sun || 0) >= cost.sun;
  };
  const costLabel = (c) => [c.coin && `${c.coin}🪙`, c.zap && `${c.zap}⚡`, c.sun && `${c.sun}☀`]
    .filter(Boolean).join(' + ') || 'free';
  // Refill any empty market-hero display slot from the pool (with replacement) — keeps 3 showing.
  function restockMarket() {
    const pool = GAME.marketPool || []; if (!pool.length) return;
    for (const slot of slotsByRole('market-hero')) {
      if (slot.occupants.length) continue;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      const c = addToken(pick, 22, 'card');
      c.userData.face = pick; c.userData.cardKind = 'hero';
      placeOnSlot(c, slot);
    }
  }
  // Overlay payload for a clicked market card: its face + affordable payment options.
  function marketBuyInfo(cardId) {
    const c = findCard(cardId); if (!c) return null;
    const s = c.userData.slot; if (!s || s.role !== 'market-hero') return null;
    const color = curPlayer(); if (!color) return null;
    const options = heroCostOptions(c.userData.face).map((cost) => ({
      cost, label: costLabel(cost), affordable: canAfford(color, cost),
    }));
    return { cardId, color, face: c.userData.face, options };
  }
  // Buy the clicked market card with payment option `idx`: deduct, then send to buyer's discard.
  function buyMarketCard(cardId, idx) {
    if (curPhase() !== 'Market') return;
    const color = curPlayer(); if (!color) return;
    const c = findCard(cardId); if (!c) return;
    const s = c.userData.slot; if (!s || s.role !== 'market-hero') return;
    const opts = heroCostOptions(c.userData.face);
    const cost = opts[idx]; if (!cost || !canAfford(color, cost)) return;
    if (cost.coin) adjustRes(color, 'coin', -cost.coin);
    if (cost.zap) adjustRes(color, 'zap', -cost.zap);
    if (cost.sun) adjustRes(color, 'sun', -cost.sun);
    c.userData.owner = color; c.userData.cardKind = 'hero'; c.userData.zone = 'discard';
    const disc = discardSlotOf(color);
    if (disc) { placeOnSlot(c, disc); setCardFace(c, c.userData.face); }
    notifyFlow();
  }

  // Resolve event ▶: run the Cheer/Jeer window first (non-Colosseum), then rank heroes by
  // (dice + modifier) total with TIE-AWARE (competition) placing, hand out podium rewards
  // (1st = Colosseum ticket; 3rd = +1 VP), and open the waiting-decision walk for every
  // non-1st participant before advancing. Colosseum: seat-only (no fight in Chunk A).
  function resolveEvent() {
    const k = curEventKey(); if (k === null) return;
    if (k === 'ColosseumBoard.png') {
      // Combat runs its own modal loop. "Resolve event" STARTS the fight once; while a fight is
      // live it must NEVER re-enter scoreEvent (that would spawn a second gladiator). A finished
      // fight is closed by its own Dismiss — route a stray Resolve click there too.
      if (GAME.colosseum) { if (GAME.colosseum.sub === 'done') dismissColosseum(); return; }
      if (eventEveryoneFull(k)) scoreEvent();   // → startColosseum()
      return;
    }
    if (!eventEveryoneFull(k)) return;
    const rules = rulesForKey(k);
    if (rules && rules.multiRound) applyRound(); else scoreEvent();
  }

  // ---- multi-round events (High Jump, Archery): bar/window elimination over several rounds ----
  // Seat every mini at a multi-round event alive at round 0 with a fresh reroll allowance.
  function initMultiRound(key) {
    GAME.eventRound = 0;
    for (const m of minisAtEvent(key)) {
      m.userData.eliminated = false;
      m.userData.roundsSurvived = 0;
      m.userData.eventDice = [];
      m.userData.diceAdj = 0;
      m.userData.archNudge = 0;
      seedRerolls(m);
      if (m.userData.diceGroup) renderHeroDice3D(m);
    }
  }
  // Resolve ONE round: survivors clear the bar/window (score++), the rest are eliminated (their
  // rounds-survived freezes). If a further round remains AND anyone's still alive, advance the
  // round (fresh dice + rerolls, walk restarts); otherwise fall through to final scoreEvent().
  function applyRound() {
    const k = curEventKey(), rules = rulesForKey(k);
    if (!rules || !rules.multiRound) return;
    const round = rules.rounds[GAME.eventRound];
    for (const m of minisAtEvent(k).filter(isAlive)) {
      if (m.userData.favorAutoPass) { m.userData.roundsSurvived = (m.userData.roundsSurvived || 0) + 1; m.userData.favorAutoPass = false; }   // Mercury: free round, no roll
      else if (rules.passes(heroTotal(m), heroStats(m), round)) m.userData.roundsSurvived = (m.userData.roundsSurvived || 0) + 1;
      else m.userData.eliminated = true;
    }
    const survivors = minisAtEvent(k).filter(isAlive);
    if (GAME.eventRound < rules.rounds.length - 1 && survivors.length) {
      for (const m of minisAtEvent(k)) {                          // fresh dice for the next round
        m.userData.eventDice = [];
        m.userData.diceAdj = 0;
        m.userData.archNudge = 0;
        if (isAlive(m)) seedRerolls(m);
        if (m.userData.diceGroup) renderHeroDice3D(m);
      }
      GAME.eventRound++;
      GAME.evtTurnIndex = 0;
      selectedHeroId = null;
      activeColorName = curEventPlayer();
      if (eventBoardMesh(k)) focusBoard(eventBoardMesh(k));
      notifyFlow();
    } else {
      scoreEvent();                                               // final ranking by rounds survived
    }
  }

  // Land the guided walk on an event key: (re)seat a multi-round event at round 0, focus its
  // board, and set the active color to its first participant. No-op focus for a null key.
  function enterEventKey(k) {
    if (k === null) { frameTable(true); return; }
    const rules = rulesForKey(k);
    if (rules && rules.multiRound) initMultiRound(k); else GAME.eventRound = 0;
    activeColorName = curEventPlayer();
    if (eventBoardMesh(k)) focusBoard(eventBoardMesh(k));
  }

  // §5 sponsorship: an independent ladder per event, keyed to a hero's absolute result — score for
  // single-shot, rounds survived for multi-round (scoreEvent grants it to the top-3 podium). A fouled
  // single-shot hero earns nothing. Returns {coin?,zap?,sun?,vp?,note?} or null.
  function sponsorReward(mini, key) {
    const rules = rulesForKey(key);
    if (!rules || typeof rules.sponsor !== 'function') return null;
    let v;
    if (rules.multiRound) v = mini.userData.roundsSurvived || 0;
    else { const sc = eventScore(mini, key); if (sc.foul) return null; v = sc.score; }
    return rules.sponsor(v);
  }
  // Auto-credit the grantable part (coin/zap/sun, and VP as race steps); note (free hero / Income
  // Recollect) is display-only until those mechanics exist.
  function grantSponsorReward(mini, rw) {
    if (!rw) return;
    const color = mini.userData.color;
    const r = GAME.res[color];
    if (r) { r.coin += rw.coin || 0; r.zap += rw.zap || 0; r.sun += rw.sun || 0; }
    if (rw.vp) advanceRace(color, rw.vp);
    // Top-rung Archery sponsor: a FREE market hero → hand the player the draft picker (same as
    // a column draft reward), instead of the old display-only note.
    if (rw.note === 'free market hero') grantDraft(color, 1, null, null, 'Archery sponsor');
    // Top-rung High Jump sponsor: Income Recollect → immediately collect an extra round of income
    // at the player's current income rung (was display-only).
    if (rw.note === 'Income Recollect') { grantIncome(color); logNote('△ ' + color + ' (High Jump sponsor): Income Recollect — collected an extra round of income.'); }
  }
  function fmtSponsor(rw) {
    if (!rw) return '';
    const parts = [];
    if (rw.coin) parts.push(rw.coin + '🪙');
    if (rw.zap)  parts.push(rw.zap + '⚡');
    if (rw.sun)  parts.push(rw.sun + '☀');
    if (rw.vp)   parts.push('+' + rw.vp + ' VP 🏁');
    if (rw.note) parts.push(rw.note);
    return parts.join(' ');
  }

  // Score the current event: rank by total, apply podium rewards, open the waiting walk.
  function scoreEvent() {
    const k = curEventKey(); if (k === null || !eventEveryoneFull(k)) return;
    const disp = (m) => eventDisplay(m, k);                       // per-event score / FOUL / "nR"
    const rome = romeFor(k);                                      // CPU Rome competitor (null = none)
    const ranked = minisAtEvent(k).concat(rome ? [rome] : [])
      .sort(eventCompare(k));                                     // §5 win-direction & elimination

    // Colosseum: the ranked dice totals are each fighter's ROUND-1 start position — hand off to the
    // co-op combat subsystem (startColosseum). It drives its own modal walk and, when the arena
    // closes (dismissColosseum), advances the event walk itself. No podium rewards here.
    if (k === 'ColosseumBoard.png') {
      startColosseum();
      return;
    }

    // Competition ranking: equal standing shares a place; the next distinct result's place is its
    // sorted index → tie for 1st ⇒ [0,0,2,…] (both take 1st's reward, 2nd vacated, next is 3rd).
    const place = ranked.map((m, i) =>
      (i > 0 && eventTied(ranked[i], ranked[i - 1], k)) ? undefined : i);
    for (let i = 1; i < place.length; i++) if (place[i] === undefined) place[i] = place[i - 1];

    // Open the waiting-decision flow up front so grantTicket() can defer to releaseQueue at cap.
    // Strip→column mapping (for Chunk B): slot 0 left→Bacchus(Col2), 1 center→Mercury(Col3),
    // 2 right→Fortuna(Col1). income+1 (1st) and column+1 (1st & 2nd) are Chunk B.
    GAME.colWait = { key: k, label: labelForEvent(k), payQueue: [], releaseQueue: [] };
    const rows = ranked.map((m, i) => {
      const ci = miniCardInfo(m), pl = place[i];
      // Rome takes the slot (shoving nations down) but DISCARDS every reward it would win.
      if (m.isRome) {
        return { color: 'Rome', sym: null, symImg: null, face: null,
                 total: disp(m), place: pl + 1, reward: '🏛 discarded', sponsor: '' };
      }
      // Capture the final score + sponsor BEFORE any reward mutates the mini — grantTicket()
      // clears eventDice (sendToWaiting), which would otherwise collapse the recomputed score.
      const total = disp(m);
      const flags = GAME.eventFavorFlags[k] || {};   // Sekhmet/Yam event-favor flags
      let sw = sponsorReward(m, k);          // §5 sponsorship — computed here, granted to top 3
      if (m.userData.favorSponsorUp) { sw = bumpedSponsor(m, k); m.userData.favorSponsorUp = false; }   // Nike: one tier higher
      const colNum = COL_FOR_SLOT[k];        // event# = column# (§5): slot 0/1/2 → column 2/3/1
      let reward = '—';
      const podium = pl <= 2;                  // sponsor is now podium-only (top 3), not paid to everyone
      // Yam (Tempest): opponents can't claim the 1st-place PODIUM reward (engine perks only — sponsor
      // VP is untouched below). The owner still takes 1st if earned; otherwise 1st's engine reward is vacated.
      const denied1st = pl === 0 && flags.denyFirstBy && m.userData.color !== flags.denyFirstBy;
      // 1st place no longer gets a FREE Colosseum seat — the ticket is decoupled from the win and
      // must be paid for in the waiting walk below (like everyone else), so seats aren't just won.
      if (pl === 0 && !denied1st) {           // 1st: income-track upgrade + column +1 (+ may pay for a seat)
        if (colNum) moveUpColumn(m.userData.color, colNum, 1);
        upgradeIncome(m.userData.color);      // move the income marker up one rung (§9)
        reward = godName(colNum) + ' +1 · income ▲ · 🎟 (pay ' + TICKET_FEE + '☀)';
      } else if (pl === 0 && denied1st) {     // Yam denial: no engine reward, seat vacated
        reward = '🌊 1st reward denied (Yam)';
      } else if (pl === 1) {                  // 2nd: column +1 only
        if (colNum) moveUpColumn(m.userData.color, colNum, 1);
        reward = godName(colNum) + ' +1';
      }                                       // 3rd: no podium reward — engine perks (column/income/
                                              // seat) are 1st/2nd only. 3rd still earns its sponsorship
                                              // VP below: podium = engine channel, sponsorship = race.
      // Sekhmet (Plague): 1st-place heroes claim NO sponsor award this event.
      const sponsorVoided = pl === 0 && flags.noSponsorFirst;
      if (podium && !sponsorVoided) grantSponsorReward(m, sw);   // §5 sponsorship (VP race steps + currency) — top 3
      return { color: m.userData.color, sym: m.userData.sym ?? null, symImg: ci.symImg,
               face: ci.face, total, place: pl + 1, reward,
               sponsor: sponsorVoided ? '— (Sekhmet)' : (podium ? fmtSponsor(sw) : '') };
    });
    // Rome's podium finish pushes its black chariot forward (§14.E): 1st→+3, 2nd→+2, 3rd→+1
    // spaces (ties share a place, so a tie-for-1st still advances +3).
    if (rome) {
      const rp = place[ranked.indexOf(rome)];       // 0=1st, 1=2nd, 2=3rd
      const steps = rp === 0 ? 3 : rp === 1 ? 2 : rp === 2 ? 1 : 0;
      if (steps) advanceRomeChariot(steps);
      if (rp !== 0) GAME.romeLostRound = true;       // §14.D — Rome off the top burns a gladiator
    }
    // The event is resolved and its final placings are captured — nobody is "eliminated" anymore,
    // they just placed where they placed. Clear the per-event status (multi-round elimination +
    // Long Jump) now so no mini carries an OUT flag past the event that set it. This is what kept a
    // ticket-winning eliminated hero reading OUT (undiceable) in the Colosseum. (D1)
    for (const m of ranked) {
      if (m.isRome) continue;
      m.userData.eliminated = false; m.userData.roundsSurvived = 0;
      m.userData.ljExtra = false; m.userData.ljStage = 'approach'; m.userData.rerollsLeft = 0;
      m.userData.favorAutoPass = false; m.userData.favorSponsorUp = false;
    }

    // Rome never queues a waiting-for-Colosseum decision. ONLY the 1st-place finisher(s) are offered
    // the Colosseum seat (they still PAY the fee — the win earns the OFFER, not a free seat). Ties for
    // 1st all share place 0, so a shared win offers the seat to each.
    const yamFlags = GAME.eventFavorFlags[k] || {};   // Yam denies opponents the 1st-place seat offer too
    GAME.colWait.payQueue = ranked
      .map((m, i) => ({ m, pl: place[i] }))
      .filter((r) => !r.m.isRome && r.pl === 0 && !(yamFlags.denyFirstBy && r.m.userData.color !== yamFlags.denyFirstBy))
      .map((r) => r.m.userData.id);
    GAME.colWait.places = {};                         // miniId → finishing place (0 = 1st) for prompt wording
    ranked.forEach((m, i) => { if (!m.isRome) GAME.colWait.places[m.userData.id] = place[i]; });
    GAME.lastResolution = { label: labelForEvent(k), objective: (rulesForKey(k) || {}).objective || '', rows };

    if (!colWaitStep()) finishEventResolution(); else notifyFlow();
  }

  // Tail of an event resolution (shared by the direct path and the modal walk): clear any open
  // decision and PAUSE on a results modal. The guided walk advances only when the player dismisses
  // that modal (dismissEventSummary), so the placements/rewards are seen before moving on.
  function finishEventResolution() {
    GAME.colWait = null;
    GAME.modWait = null;
    GAME.summaryOpen = true;
    notifyFlow();
  }
  // Dismiss the results modal → mark the event resolved and advance to the next event.
  function dismissEventSummary() {
    if (!GAME.summaryOpen) return;
    GAME.summaryOpen = false;
    const k = curEventKey();
    GAME.resolved.push(k);
    GAME.eventIndex++;                                              // next non-empty event
    GAME.evtTurnIndex = 0;
    selectedHeroId = null;
    enterEventKey(curEventKey());                                 // next event (multi-round → round 0)
    notifyFlow();
  }

  // Arena fighter stations on the Colosseum board (the center gladiator slot is the largest r).
  const arenaStations = () => SLOTS.filter((s) =>
    s.boardKey === 'ColosseumBoard.png' && (s.accepts || []).includes('mini'));
  // On entering the Colosseum: auto-seat every waiting mini onto a free fighter station so it
  // can earn its 2 dice (start position). Chunk A stops here — no fight, no release/discard.
  function seatWaitingIntoArena() {
    const stations = arenaStations();
    const fighters = stations.filter((s) => s.r < 8);              // drop the center gladiator slot
    const pool = (fighters.length ? fighters : stations).slice();
    let i = 0;
    for (const m of pieces) {
      if (m.userData.type !== 'mini' || !m.userData.waiting) continue;
      if (m.userData.slot && m.userData.slot.boardKey === 'ColosseumBoard.png') continue; // already fighting
      while (i < pool.length && pool[i].occupants.length) i++;
      const slot = pool[i]; if (!slot) break;
      placeOnSlot(m, slot);
      m.userData.eventDice = [];
      m.userData.diceAdj = 0;
      if (m.userData.diceGroup) renderHeroDice3D(m);
      i++;
    }
  }

  // End-of-round cleanup (on entering Market): send every non-waiting mini that isn't already
  // resting on its home hero-market circle back home, discarding its tied hero card. Catches
  // event competitors and barracks minis alike; waiting (Colosseum-bound) minis are left locked.
  function returnPlayedMinisHome() {
    for (const m of pieces) {
      if (m.userData.type !== 'mini' || m.userData.waiting) continue;
      const s = m.userData.slot;
      const atHome = s && s.role === 'hero-market' && s.owner === m.userData.color && s.sym === m.userData.sym;
      if (!atHome) sendHomeDiscard(m);
    }
  }

  // ================================================================== COMBAT
  // Colosseum co-op combat (§9): the arena fighters (waiting minis seated this phase) gang up on
  // one gladiator drawn from a shuffled 12-card deck. Each combat ROUND: fighters take a position
  // (2d6 → station II–XII), players may buy Push/Backstab (before the gladiator attacks), the
  // gladiator hits the positions its card names (a hero dies if its Speed ≤ the attack, unless it
  // spends 1☀), players may buy Double Hit/Rage, then every survivor counter-attacks (1d6 + Str),
  // chipping the gladiator's Hearts past its Shield. Repeat until the gladiator dies or all fighters
  // fall. Heart damage + the killing-blow bonus + Elysium survivors are banked as deferred VP,
  // applied to the race track at the end of the game (scoreEndGame). See ColosseumActions above for
  // the coin-driven action layer (COL_ACTIONS).

  // 12 gladiators (read off Gladiator<level>-<n>.png). `target` = which positions it strikes:
  // all · lowest/highest position · highest odd · lowest even · pos 2–6 · pos 7–12 · even · odd.
  // Two SEPARATE numbers per card (they were being conflated):
  //   • atk      = the lower-left "⚔ = d6 ±M" attack value (a single d6, straight / −1 / +1).
  //                This is what a hero's Speed must beat to evade.
  //   • rangeMod = the "🎲🎲 ±N" in the POSITION text — roll 2d6 for a window of positions the
  //                gladiator reaches (only on cards that print dice; 0 = no roll, target is exact).
  const GLAD_DECK = [
    { file: 'Gladiator1-1.png', level: 1, target: 'all',      atk: -1, rangeMod: 2, shield: 4, hearts: 9 },
    { file: 'Gladiator1-2.png', level: 1, target: 'all',      atk:  0, rangeMod: 1, shield: 3, hearts: 9 },
    { file: 'Gladiator1-3.png', level: 1, target: 'highOdd2', atk: -2, rangeMod: 0, shield: 4, hearts: 6 },
    { file: 'Gladiator2-1.png', level: 2, target: 'lowEven3', atk: -2, rangeMod: 0, shield: 5, hearts: 4 },
    { file: 'Gladiator2-2.png', level: 2, target: 'all',      atk: -1, rangeMod: 3, shield: 5, hearts: 6 },
    { file: 'Gladiator2-3.png', level: 2, target: 'all',      atk:  0, rangeMod: 2, shield: 5, hearts: 5 },
    { file: 'Gladiator3-1.png', level: 3, target: 'low2_6',   atk:  0, rangeMod: 0, shield: 5, hearts: 8 },
    { file: 'Gladiator3-2.png', level: 3, target: 'high7_12', atk: -1, rangeMod: 0, shield: 5, hearts: 9 },
    { file: 'Gladiator3-3.png', level: 3, target: 'even',     atk:  0, rangeMod: 0, shield: 6, hearts: 3 },
    { file: 'Gladiator4-1.png', level: 4, target: 'all',      atk: -1, rangeMod: 0, shield: 6, hearts: 5 },
    { file: 'Gladiator4-2.png', level: 4, target: 'all',      atk:  1, rangeMod: 2, shield: 6, hearts: 6 },
    { file: 'Gladiator4-3.png', level: 4, target: 'odd',      atk:  0, rangeMod: 0, shield: 6, hearts: 7 },
  ];
  const GLAD_TARGET_LABEL = { all: 'everyone', lowP: 'lowest', highP: 'highest', highOdd: 'highest odd',
    lowEven: 'lowest even', low2_6: 'pos 2–6', high7_12: 'pos 7–12', even: 'even pos', odd: 'odd pos',
    highOdd2: '2 highest held odd', lowEven3: '3 lowest held even' };
  // For the sandbox gladiator picker: [{idx,label}] over every card (all levels).
  function gladList() {
    return GLAD_DECK.map((c, i) => {
      const atkTxt = 'd6' + (c.atk > 0 ? '+' + c.atk : (c.atk < 0 ? String(c.atk) : ''));
      const rng = c.rangeMod ? (' ±' + c.rangeMod + ' (2d6)') : '';
      const label = 'L' + c.level + ' ' + c.file.replace('Gladiator', '').replace('.png', '')
        + ' — ' + (GLAD_TARGET_LABEL[c.target] || c.target) + rng + ' · atk ' + atkTxt;
      return { idx: i, label };
    });
  }

  function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // Deck: shuffle the 3 variants WITHIN each level, then stack level 1 (top) → level 4 (bottom).
  function initGladDeck() {
    GAME.gladDeck = [1, 2, 3, 4].flatMap((lv) => shuffleArr(GLAD_DECK.map((c, i) => ({ c, i })).filter((x) => x.c.level === lv).map((x) => x.i)));
    GAME.gladDiscard = [];
  }
  // §14.D Rome pressure: burn the top (toughest-available) gladiator so the next arena is deadlier.
  function colBurnGladiator() { if (GAME.gladDeck.length) GAME.gladDiscard.push(GAME.gladDeck.shift()); }

  // Which alive fighters a gladiator card strikes (by their arena position).
  // `range` (optional {lo,hi}) = the 2d6 position window rolled for dice-cards. The descriptor is
  // applied only to fighters WHOSE POSITION FALLS INSIDE that window; no range → the whole board.
  function gladTargets(card, alive, range) {
    const pool = range ? alive.filter((f) => f.pos >= range.lo && f.pos <= range.hi) : alive;
    const t = card.target, at = (pred) => pool.filter((f) => pred(f.pos));
    if (t === 'all') return pool.slice();
    if (t === 'odd') return at((p) => p % 2 === 1);
    if (t === 'even') return at((p) => p % 2 === 0);
    if (t === 'low2_6') return at((p) => p <= 6);
    if (t === 'high7_12') return at((p) => p >= 7);
    if (t === 'lowP') { if (!pool.length) return []; const m = Math.min(...pool.map((f) => f.pos)); return at((p) => p === m); }
    if (t === 'highP') { if (!pool.length) return []; const m = Math.max(...pool.map((f) => f.pos)); return at((p) => p === m); }
    if (t === 'highOdd') { const o = pool.filter((f) => f.pos % 2 === 1); if (!o.length) return []; const m = Math.max(...o.map((f) => f.pos)); return o.filter((f) => f.pos === m); }
    if (t === 'lowEven') { const e = pool.filter((f) => f.pos % 2 === 0); if (!e.length) return []; const m = Math.min(...e.map((f) => f.pos)); return e.filter((f) => f.pos === m); }
    // "held" descriptors: rank the DISTINCT occupied odd/even positions, take the top-2 highest odd /
    // bottom-3 lowest even, and strike every fighter standing on one of those positions.
    if (t === 'highOdd2') { const ps = [...new Set(pool.filter((f) => f.pos % 2 === 1).map((f) => f.pos))].sort((a, b) => b - a).slice(0, 2); return pool.filter((f) => ps.includes(f.pos)); }
    if (t === 'lowEven3') { const ps = [...new Set(pool.filter((f) => f.pos % 2 === 0).map((f) => f.pos))].sort((a, b) => a - b).slice(0, 3); return pool.filter((f) => ps.includes(f.pos)); }
    return [];
  }

  // The full "danger zone" a card COULD strike, independent of where heroes stand — so it can be
  // shown while heroes are still choosing positions. `range` (optional {lo,hi}) clamps it to the
  // rolled 2d6 reach window. lowP/highP can't be narrowed pre-placement, so the whole window shows.
  function gladZone(card, range) {
    const all = []; for (let p = 2; p <= 12; p++) all.push(p);
    const win = range ? all.filter((p) => p >= Math.max(2, range.lo) && p <= Math.min(12, range.hi)) : all;
    const t = card.target;
    if (t === 'odd' || t === 'highOdd' || t === 'highOdd2') return win.filter((p) => p % 2 === 1);
    if (t === 'even' || t === 'lowEven' || t === 'lowEven3') return win.filter((p) => p % 2 === 0);
    if (t === 'low2_6') return win.filter((p) => p <= 6);
    if (t === 'high7_12') return win.filter((p) => p >= 7);
    return win;   // all / lowP / highP → the whole (windowed) board
  }

  // The 22 fighter circles (11 stations II–XII × inner/outer), in board order (station = pos−2).
  const arenaFighterSlots = () => arenaStations().filter((s) => s.r < 8);
  const fighterOf = (id) => (GAME.colosseum ? GAME.colosseum.fighters.find((f) => f.id === id) : null);
  const symName = (f) => f.color + (f.sym != null ? ' #' + (f.sym + 1) : '');
  const wrapPos = (p) => (p > 12 ? 2 : p < 2 ? 12 : p);          // positions 2..12 wrap 12↔2
  const posOccupied = (pos) => GAME.colosseum.fighters.filter((f) => f.alive && f.pos === pos).length;
  const pushBlocked = (pos, dir) => posOccupied(wrapPos(pos + dir)) >= 2;   // max 2 heroes per position

  // Seat entered alive fighters on their station: inner circle first, outer for the 2nd. `lastId`
  // (a fighter that just moved/arrived) is seated LAST so it takes the inner-MOST AVAILABLE spot —
  // the resident keeps its inner circle, the newcomer fills whatever's free.
  function placeAllFighters(lastId) {
    const slots = arenaFighterSlots(), cnt = {};
    const list = GAME.colosseum.fighters
      .map((f, idx) => ({ f, idx }))
      .filter((o) => o.f.alive && o.f.entered !== false)
      .sort((a, b) => (a.f.id === lastId ? 1 : 0) - (b.f.id === lastId ? 1 : 0) || a.idx - b.idx);
    for (const { f } of list) {
      const st = f.pos - 2, k = cnt[st] || 0; cnt[st] = k + 1;
      const seat = Math.min(k, 1);        // 0 = inner circle (can attack), 1 = outer (blocked behind the inner hero)
      f.seat = seat;
      const slot = slots[st * 2 + seat];
      const m = findMini(f.id);
      if (m && slot) placeOnSlot(m, slot);
    }
  }
  // Roll each fighter's 2d6 position ONE AT A TIME (turn order). On entrance the minis start off the
  // board (hidden) and pop in as their dice settle; later rounds re-roll positions the same way. A
  // station holds at most 2 — a full roll slides CLOCKWISE (II→…→XII→II) to the next open one.
  function colRollPositions(entrance, done) {
    const c = GAME.colosseum;
    const alive = c.fighters.filter((f) => f.alive).slice()
      .sort((a, b) => GAME.order.indexOf(a.color) - GAME.order.indexOf(b.color));
    for (const f of alive) { f.entered = false; if (entrance) { const m = findMini(f.id); if (m) m.visible = false; } }
    GAME.colAnimating = true; notifyFlow();
    const center = arenaStations().find((s) => s.r >= 8) || { x: 0, z: 0 };
    const count = {};
    let i = 0;
    const step = () => {
      if (i >= alive.length) {
        GAME.colAnimating = false; clearTurnMarker(); placeAllFighters();
        if (done) done(); else notifyFlow();
        return;
      }
      const f = alive[i++];
      const d1 = rollFace(), d2 = rollFace();
      let p = Math.min(12, Math.max(2, d1 + d2)), guard = 0;
      while ((count[p] || 0) >= 2 && guard++ < 11) p = wrapPos(p + 1);
      if (p !== Math.min(12, Math.max(2, d1 + d2))) c.log.push('↻ ' + symName(f) + ' rolled ' + (d1 + d2) + ' (full) → pos ' + p);
      f.pos = p; count[p] = (count[p] || 0) + 1;
      f.entered = true;
      const m = findMini(f.id); if (m) m.visible = true;
      placeAllFighters(f.id);                 // seat inner-most available
      setTurnMarker(f.id);
      const seat = (m && m.userData.slot) ? m.userData.slot : (stationSlotsForPos(p)[0] || center);
      notifyFlow();
      rollDiceAnim({ x: seat.x, z: seat.z }, [d1, d2], () => { setTimeout(step, 300); });
    };
    step();
  }

  // ---- turn indicator: a bobbing gold ▼ arrow above the mini whose turn it is (attack / move) ----
  let turnMarker = null;
  function clearTurnMarker() {
    if (!turnMarker) return;
    scene.remove(turnMarker);
    turnMarker.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    turnMarker = null;
  }
  function setTurnMarker(miniId) {
    clearTurnMarker();
    const m = miniId != null ? findMini(miniId) : null; if (!m) return;
    const g = new THREE.Group();
    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.6, 4),
      new THREE.MeshBasicMaterial({ color: 0xffe14a }));
    cone.rotation.x = Math.PI;          // tip points down at the mini
    cone.rotation.y = Math.PI / 4;
    cone.renderOrder = 12;
    g.add(cone);
    g.userData.miniId = miniId; g.userData.baseY = 5.2;
    g.position.set(m.position.x, g.userData.baseY, m.position.z);
    scene.add(g); turnMarker = g;
  }

  // The drawn gladiator card, laid on the center station (with a red backing so the spot reads).
  let gladMarker = null;
  function removeGladiatorMarker() {
    if (!gladMarker) return;
    scene.remove(gladMarker);
    gladMarker.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    gladMarker = null;
  }
  function addGladiatorMarker(file) {
    removeGladiatorMarker();
    const g = new THREE.Group();
    const center = arenaStations().find((s) => s.r >= 8);
    if (center) g.position.set(center.x, MARKER_Y, center.z);
    // No rim/disc: the board already prints the red card rectangle. Size the card to FILL it —
    // the rectangle measures ~16.2w × 20.7h world units; gladiator cards are portrait (aspect ~0.78),
    // so a 20.5-tall card lands ~16.1 wide, snug inside the printed border.
    const RECT_H = 20.5;
    if (file) {
      const cardG = new THREE.Group();
      // Pre-mint the plane so setCardFace just re-textures children[0] (aspect-fit, long edge = 22).
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(22, 22),
        new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide, depthWrite: false }));
      plane.rotation.x = -Math.PI / 2; plane.renderOrder = 10;
      cardG.add(plane);
      setCardFace(cardG, file);                 // re-textures the pre-minted plane, aspect-fit
      cardG.scale.setScalar(RECT_H / 22);       // fill the printed red rectangle
      cardG.position.y = 0.02;
      g.add(cardG);
    }
    g.userData.gladiator = true;
    scene.add(g); gladMarker = g;
  }

  // ---- attack / push station highlights on the board (red = under attack, cyan = push dest) ----
  let colHilite = [];
  function clearColHighlights() {
    for (const m of colHilite) { scene.remove(m); if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose(); }
    colHilite = [];
  }
  function addColRing(slot, color, opacity) {
    if (!slot) return;
    const ring = new THREE.Mesh(new THREE.RingGeometry(slot.r * 0.6, slot.r, 32),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 0.6 : opacity, side: THREE.DoubleSide, depthWrite: false, depthTest: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(slot.x, slot.y + 0.05, slot.z); ring.renderOrder = 11;
    scene.add(ring); colHilite.push(ring);
  }
  const stationSlotsForPos = (pos) => { const s = arenaFighterSlots(), st = pos - 2; return [s[st * 2], s[st * 2 + 1]].filter(Boolean); };
  // Re-derive the board highlights from combat state (called on every notifyFlow).
  function syncColScene() {
    clearColHighlights();
    const c = GAME.colosseum; if (!c) return;
    const pu = GAME.colPush;
    if (pu && pu.step === 'mini') {
      // Push step 1: gold-ring every opposing hero so the buyer can click one to shove.
      for (const f of c.fighters) {
        if (!f.alive || f.color === pu.color) continue;
        const m = findMini(f.id); if (m && m.userData.slot) addColRing(m.userData.slot, 0xffe14a);
      }
    } else if (pu && pu.step === 'dest' && pu.miniId != null) {
      const f = fighterOf(pu.miniId);
      if (f) for (const d of [-1, 1]) if (!pushBlocked(f.pos, d)) for (const s of stationSlotsForPos(wrapPos(f.pos + d))) addColRing(s, 0x38d0ff);
    } else if (c.sub === 'buyA' || c.sub === 'attack' || c.sub === 'buyB' || GAME.colAnimating) {
      // Danger zone: every position the gladiator COULD strike this round (dim red), shown from the
      // moment heroes start taking positions. During the strike, the actually-hit stations glow
      // brighter on top so the resolved hit still reads.
      const card = GLAD_DECK[c.idx];
      for (const p of gladZone(card, c.range)) for (const s of stationSlotsForPos(p)) addColRing(s, 0xff2222, 0.32);
      if (c.sub === 'attack') {
        const set = new Set();
        for (const id of c.targetIds) { const f = fighterOf(id); if (f && f.alive) set.add(f.pos); }
        for (const p of set) for (const s of stationSlotsForPos(p)) addColRing(s, 0xff2222, 0.75);
      }
    }
  }

  // ---- cinematic 3D dice (a tiny tween registry consumed by the animate() loop) ----
  let anims = [];
  function rollDiceAnim(at, values, onDone) {
    const dur = 850, y0 = 6, hop = 11;
    const dice = values.map((v, i) => {
      const g = new THREE.Group();
      const plane = makeDieMesh(1);
      plane.renderOrder = 20; plane.material.depthTest = false;
      g.add(plane);
      g.position.set(at.x + (i - (values.length - 1) / 2) * 8, y0, at.z);
      g.userData.plane = plane;
      scene.add(g);
      return g;
    });
