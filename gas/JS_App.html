    const c = GAME.colosseum; if (!c) return;
    const elySlots = SLOTS.filter((s) => s.boardKey === 'UnderworldBoard.png' && (s.accepts || []).includes('card')).slice(0, 4);
    const tarSlot = SLOTS.filter((s) => s.boardKey === 'UnderworldBoard.png').find((s) => !elySlots.includes(s));
    for (const f of c.fighters) {
      const m = findMini(f.id); if (!m) continue;
      // A fallen hero reaches Elysium instead of Tartarus if Bacchus flagged it (f.toElysium) or
      // the color played Osiris (afterlife rescue). Survivors' cards sit on the mini's card slot;
      // a rescued fallen card is on the Tartarus pile (tagged diedFighterId in killFighter).
      const af = GAME.favorAfterlife[f.color];
      const rescued = f.dead && (f.toElysium || (af && af.rescue));
      let card;
      if (f.alive) { const cs = cardSlotOf(m); card = cs && cs.occupants.slice().reverse().find((o) => o !== m && o.userData.type === 'card'); }
      else if (rescued) { card = pieces.find((o) => o.userData.type === 'card' && o.userData.diedFighterId === f.id); }
      if (f.alive || rescued) {
        if (rescued) { const ti = GAME.tartarus.findIndex((e) => e.id === f.id); if (ti >= 0) GAME.tartarus.splice(ti, 1); }
        GAME.elysium.push({ color: f.color, sym: f.sym, id: f.id, str: f.str, speed: f.speed });
        if (card) { const slot = elySlots[SEAT_ORDER.indexOf(f.color) % 4] || elySlots[0]; if (slot) placeOnSlot(card, slot); card.userData.zone = 'elysium'; card.userData.diedFighterId = null; setCardFace(card, card.userData.face); }
        fireBlessing(f.color);   // afterlife favor payout per hero reaching Elysium (if one was played)
      }
      // mini goes home, unlocked and reset (visible again in case it entered/left mid-roll)
      m.visible = true;
      m.userData.waiting = false; m.userData.locked = false;
      m.userData.eventDice = []; m.userData.diceAdj = 0;
      if (m.userData.diceGroup) renderHeroDice3D(m);
      const hc = homeCircleOf(m); if (hc) placeOnSlot(m, hc);
    }
    for (const color of Object.keys(c.used)) { const n = Object.keys(c.used[color]).length; if (n) adjustRes(color, 'sun', n); }
    GAME.gladDiscard.push(c.idx);
    clearColHighlights();
    clearTurnMarker();
    removeGladiatorMarker();
    GAME.colosseum = null; GAME.colAct = null;
    GAME.colPush = null; GAME.colSelId = null; GAME.colAnimating = false;
    select(null);
    GAME.resolved.push('ColosseumBoard.png');
    GAME.eventIndex++;
    selectedHeroId = null;
    for (const color of ALL_COLORS) recoupFavors(color, true);   // favor cards are picked up FREE after the arena
    enterEventKey(curEventKey());
    notifyFlow();
  }
  const elysiumCountOf = (color) => GAME.elysium.filter((e) => e.color === color).length;
  const tartarusCountOf = (color) => GAME.tartarus.filter((e) => e.color === color).length;

  // Snapshot of the live combat for the UI (null when no arena is active).
  function colFlow() {
    const c = GAME.colosseum; if (!c) return null;
    const buyer = GAME.colAct ? colActBuyer() : null;
    const wrapF = (id) => { const f = fighterOf(id); return f ? fInfo(f) : null; };
    return {
      sub: c.sub, round: c.round,
      glad: { file: c.file, level: c.level, target: c.targetLabel, atk: c.atk, rangeMod: c.rangeMod, shield: c.shield, hearts: c.hearts, heartsMax: c.heartsMax },
      fighters: c.fighters.map((f) => ({ id: f.id, color: f.color, sym: f.sym, symImg: f.symImg, pos: f.pos,
                 alive: f.alive, str: f.str, speed: f.speed, strBonus: f.strBonus || 0, speedBonus: f.speedBonus || 0,
                 shielded: !!f.shielded, doubled: f.doubled, rage: f.rage, targeted: c.targetIds.includes(f.id) })),
      attackVal: (c.sub === 'attack' || c.sub === 'buyB' || c.sub === 'counter') ? c.attackVal : null,
      range: c.range ? { lo: Math.max(2, c.range.lo), hi: Math.min(12, c.range.hi), center: c.range.center } : null,
      window: GAME.colAct ? GAME.colAct.window : null,
      buyer, buyerActions: buyer ? colActionState(buyer) : [],
      counterNext: (c.sub === 'counter' && c.counterQueue.length) ? (() => { const f = fighterOf(c.counterQueue[0]); return f ? { ...fInfo(f), str: f.str, rage: f.rage } : null; })() : null,
      counterLeft: c.counterQueue.length,
      selId: GAME.colSelId,
      push: GAME.colPush ? { step: GAME.colPush.step, color: GAME.colPush.color, miniId: GAME.colPush.miniId } : null,
      animating: !!GAME.colAnimating,
      log: c.log.slice(-8), deathHit: c.deathHit, done: c.sub === 'done',
    };
  }

  // ---- end game: apply deferred VP, then rank the nations ----
  function scoreEndGame() {
    if (GAME.result) return;
    for (const color of ALL_COLORS) {
      // Combat VP (pendingVP) is already on the racetrack (applied live during the arena) — do NOT
      // re-apply it here. Only the end-game-only bonuses (Elysium survival, column tops) land now.
      const bonus = 3 * elysiumCountOf(color) + columnTopVP(color);
      if (bonus) advanceRace(color, bonus, { silent: true });   // end screen tallies these; no flash barrage
    }
    const standings = ALL_COLORS.map((color) => ({
      color, laps: GAME.race[color]?.laps || 0, pos: GAME.race[color]?.pos || 0,
      elysium: elysiumCountOf(color), tartarus: tartarusCountOf(color),
      combatVP: GAME.pendingVP[color] || 0,
      leftover: (GAME.res[color]?.coin || 0) + (GAME.res[color]?.zap || 0) + (GAME.res[color]?.sun || 0),
    })).sort((a, b) => b.laps - a.laps || b.pos - a.pos || b.elysium - a.elysium || b.leftover - a.leftover || SEAT_ORDER.indexOf(a.color) - SEAT_ORDER.indexOf(b.color));
    GAME.result = { standings, winner: standings[0].color };
    notifyFlow();
  }

  // After all events resolve, every "free" faction card — one that isn't in a hand, isn't already
  // in the deck/discard, and isn't tied to a waiting (Colosseum-bound) mini — goes to its owner's
  // discard pile. (Market cards have no owner and are left alone.)
  function sweepFreeCards() {
    for (const c of pieces.slice()) {
      if (c.userData.type !== 'card' || !c.userData.owner) continue;
      if (c.userData.favorDiscard) continue;                                 // favor pile is self-contained (recoup only)
      if (c.userData.zone === 'deck' || c.userData.zone === 'discard') continue;
      const s = c.userData.slot;
      if (s && s.role === 'hand') continue;                        // still held in a hand
      if (s && s.role === 'card' && s.occupants.some((o) => o.userData.type === 'mini' && o.userData.waiting)) continue;
      const disc = discardSlotOf(c.userData.owner);
      if (disc) { placeOnSlot(c, disc); c.userData.zone = 'discard'; setCardFace(c, c.userData.face); }
    }
  }

  // Short human label for an event key (active mini-game name, sans "Event.png").
  function labelForEvent(key) {
    if (key === 'ColosseumBoard.png') return 'Colosseum';
    const f = eventFiles[key] || '';
    return f.replace(/Event\.png$|\.png$/,'').replace(/([a-z])([A-Z])/g, '$1 $2') || ('Event ' + (key + 1));
  }

  // Event can advance only when the CURRENT participant has diced all their heroes.
  function eventGateOk() {
    const k = curEventKey();
    return k === null || participantFull(curEventPlayer(), k);
  }

  // Rebuild the small public row of dice sitting beside a mini on the table.
  function renderHeroDice3D(mini) {
    let dg = mini.userData.diceGroup;
    if (dg) { mini.remove(dg); dg.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
    dg = new THREE.Group();
    const arr = mini.userData.eventDice || [];
    arr.forEach((v, i) => {
      const m = makeDieMesh(v);                 // flat 7×7 plane
      m.scale.setScalar(0.55);
      m.position.set((i - (arr.length - 1) / 2) * 4.4, 0.5, 9);   // row just in front of the base
      dg.add(m);
    });
    mini.userData.diceGroup = dg;
    mini.add(dg);
  }
  function clearAllHeroDice() {
    for (const p of pieces) if (p.userData.type === 'mini') {
      p.userData.eventDice = []; p.userData.diceAdj = 0;
      p.userData.eliminated = false; p.userData.roundsSurvived = 0;
      p.userData.ljExtra = false; p.userData.ljStage = 'approach'; p.userData.rerollsLeft = 0;
      if (p.userData.diceGroup) renderHeroDice3D(p);
    }
  }

  function selectHero(id) { selectedHeroId = id; notifyFlow(); }

  // Draw a specific ROLLED cup die into the selected hero (consumes it from the cup).
  function drawFromCup(color, idx) {
    const arr = GAME.cup[color]; if (!arr || idx < 0 || idx >= arr.length || arr[idx] === null) return;
    const m = selectedMini(); if (!m || m.userData.color !== color) return;
    if (rulesFor(m) && !(m.userData.eventDice || []).length) return;     // die 1 must be a public roll (shared grammar)
    if ((m.userData.eventDice || []).length >= assignCap(m)) return;     // at the current dice cap
    if (!(m.userData.eventDice || []).length) seedRerolls(m);            // first die → fresh rerolls
    const v = arr.splice(idx, 1)[0];
    (m.userData.eventDice = m.userData.eventDice || []).push(v);
    renderHeroDice3D(m);
    notifyFlow();
  }

  // Roll a FRESH random die onto the selected hero (general supply, cup untouched).
  function rollRandomDie(color) {
    const m = selectedMini(); if (!m || m.userData.color !== color) return;
    if ((m.userData.eventDice || []).length >= assignCap(m)) return;     // at the current dice cap
    if (!(m.userData.eventDice || []).length) seedRerolls(m);            // first die → fresh rerolls
    (m.userData.eventDice = m.userData.eventDice || []).push(rollFace());
    renderHeroDice3D(m);
    notifyFlow();
  }

  // Free reroll (§5 allowance): re-roll one of a hero's dice, spending a reroll (not a Sun).
  function rerollHeroDie(heroId, idx) {
    const m = findMini(heroId); if (!m) return;
    const arr = m.userData.eventDice; if (!arr || idx < 0 || idx >= arr.length) return;
    if ((m.userData.rerollsLeft || 0) <= 0) return;
    arr[idx] = rollFace();
    m.userData.rerollsLeft -= 1;
    renderHeroDice3D(m);
    notifyFlow();
  }

  // Long Jump: toggle the optional 2nd approach stride — decided AFTER seeing die 1 (press-your-luck),
  // so it stays open with 0 or 1 die down; locked once a 2nd die exists or the jump is committed.
  function toggleLongJumpExtra(heroId) {
    const m = findMini(heroId); if (!m) return;
    const rules = rulesFor(m); if (!rules || !rules.longJump) return;
    if ((m.userData.eventDice || []).length >= 2 || m.userData.ljStage === 'jump') return;
    m.userData.ljExtra = !m.userData.ljExtra;
    notifyFlow();
  }

  // Long Jump: commit the approach and begin the jump — unlocks the 2 jump dice. Only once the
  // approach is fully diced and legal (a foul locks the field and there is no jump).
  function commitLongJump(heroId) {
    const m = findMini(heroId); if (!m) return;
    const rules = rulesFor(m); if (!rules || !rules.longJump) return;
    if (m.userData.ljStage === 'jump') return;                           // already jumping
    const appN = 1 + (m.userData.ljExtra ? 1 : 0);
    const app = (m.userData.eventDice || []).slice(0, appN);
    if (app.length < appN) return;                                       // approach not finished
    if (app.reduce((a, b) => a + b, 0) > 10) return;                     // scratched — no jump
    m.userData.ljStage = 'jump';
    notifyFlow();
  }

  // Archery: adjust this hero's signed aim nudge (any value −Speed…+Speed) applied to the round
  // total before the band check. Clamped to the hero's Speed; reset each round with the dice.
  function setArcheryNudge(heroId, delta) {
    const m = findMini(heroId); if (!m) return;
    const rules = rulesFor(m); if (!rules || !rules.nudge || m.userData.eliminated) return;
    const cap = heroStats(m).speed;
    m.userData.archNudge = Math.max(-cap, Math.min(cap, (m.userData.archNudge || 0) + delta));
    notifyFlow();
  }

  function clearHeroDice(heroId) {
    const m = findMini(heroId); if (!m) return;
    m.userData.eventDice = [];
    m.userData.diceAdj = 0;
    m.userData.archNudge = 0;
    m.userData.ljStage = 'approach';        // re-arm the Long Jump approach → jump flow
    renderHeroDice3D(m);
    notifyFlow();
  }

  const phasesFor = (round) =>
    PHASES.filter((p) => p !== 'Colosseum' || COLOSSEUM_ROUNDS.includes(round));
  const eraOf = (round) => (round <= 3 ? 'Act I' : round <= 5 ? 'Act II' : 'Act III');
  // Standings key: laps first, then distance into the current lap.
  const raceRank = (color) => { const s = GAME.race[color] || { laps: 0, pos: 0 }; return s.laps * 10000 + s.pos; };
  // Round 1 = seat order; round 2+ = race leader first, ties broken by seat order.
  const computeOrder = (round) => (round === 1
    ? (GAME.round1Seat || SEAT_ORDER).slice()
    : SEAT_ORDER.slice().sort((a, b) => raceRank(b) - raceRank(a) || SEAT_ORDER.indexOf(a) - SEAT_ORDER.indexOf(b)));

  function getFlow() {
    const phases = phasesFor(GAME.round);
    const phase = phases[GAME.phaseIndex];
    const perPlayer = PER_PLAYER_PHASES.includes(phase);
    const isEvent = (phase === 'Resolution & Podiums' || phase === 'Colosseum');
    const live = GAME.started && !GAME.over;

    // In an event phase the "current player" is the participant the guided walk is on;
    // in a per-player phase it's the turn cursor; otherwise none.
    const eventKey = live && isEvent ? curEventKey() : null;
    const current = !live ? null
      : isEvent ? curEventPlayer()
      : perPlayer ? GAME.order[GAME.turnIndex] : null;

    // panel owner: the current player (per-player or event walk), else whoever's swatch is active.
    const owner = current || activeColorName;
    // heroes shown in the panel: in an event phase, only the owner's minis at the CURRENT event.
    const ownerHeroes = !live ? []
      : isEvent ? (eventKey === null ? [] : minisAtEvent(eventKey).filter((m) => m.userData.color === owner))
      : [];
    // the selection always belongs to the panel owner (you play your dice onto your heroes)
    if (selectedHeroId !== null && !ownerHeroes.some((m) => m.userData.id === selectedHeroId)) selectedHeroId = null;
    if (selectedHeroId === null && ownerHeroes.length) selectedHeroId = ownerHeroes[0].userData.id;
    const heroesRules = eventKey !== null ? rulesForKey(eventKey) : null;
    const heroes = ownerHeroes.map((m) => {
      const ci = miniCardInfo(m);
      const sc = eventKey !== null ? eventScore(m, eventKey) : { score: 0, foul: false };
      // Long Jump split: approach (1 +opt) vs jump (1), and whether the jump is unlocked yet.
      let lj = null;
      if (heroesRules && heroesRules.longJump && !m.userData.eliminated) {
        const appN = 1 + (m.userData.ljExtra ? 1 : 0);
        const app = (m.userData.eventDice || []).slice(0, appN);
        const approachDone = app.length >= appN;
        const diceBase = app.reduce((a, b) => a + b, 0);                      // approach dice only (no cushion)
        const fouled = approachDone && diceBase > 10;
        const stage = m.userData.ljStage === 'jump' ? 'jump' : 'approach';
        const runup = Math.min(diceBase + heroStats(m).speed, 10);            // up-to-Speed cushion, capped at 10
        lj = { appN, approachDone, fouled, stage, diceBase, runup,
               jumpSum: (m.userData.eventDice || []).slice(appN).reduce((a, b) => a + b, 0),
               canJump: approachDone && !fouled && stage !== 'jump' };
      }
      // Multi-round live status: this round's value, whether it currently passes, and the
      // bar (High Jump) or acceptable window lo–hi (Archery) so the panel can guide the player.
      let round = null;
      if (heroesRules && heroesRules.multiRound && !m.userData.eliminated) {
        const rd = heroesRules.rounds[GAME.eventRound] || heroesRules.rounds[heroesRules.rounds.length - 1];
        const st = heroStats(m), tot = heroTotal(m);
        round = { value: heroesRules.roundValue(tot, st), ok: heroesRules.passes(tot, st, rd),
                  bar: rd.bar != null ? rd.bar : null,
                  lo: rd.lo != null ? rd.lo : null,
                  hi: rd.hi != null ? rd.hi : null,
                  nudge: heroesRules.nudge ? (m.userData.archNudge || 0) : null,
                  nudgeCap: heroesRules.nudge ? st.speed : 0 };
      }
      return { id: m.userData.id, sym: m.userData.sym ?? null, symImg: ci.symImg,
               face: ci.face, hasCard: ci.hasCard,
               dice: (m.userData.eventDice || []).slice(), required: requiredFor(m),
               cap: eventKey !== null ? assignCap(m) : 0,
               sum: (m.userData.eventDice || []).reduce((a, b) => a + b, 0),
               score: sc.score, foul: sc.foul,
               scoreText: eventKey !== null ? eventDisplay(m, eventKey, true) : '',
               eliminated: !!m.userData.eliminated, roundsSurvived: m.userData.roundsSurvived || 0,
               rerollsLeft: m.userData.rerollsLeft || 0, ljExtra: !!m.userData.ljExtra, lj, round };
    });
    // die-1-public grammar: the selected hero's FIRST die each round must be a live roll, not a
    // placed cup die — so the cup panel greys out its dice until at least one die is down.
    const selHero = ownerHeroes.find((m) => m.userData.id === selectedHeroId);
    const firstDieMustRoll = !!(heroesRules && selHero && !selHero.userData.eliminated
      && !(selHero.userData.eventDice || []).length);
    // roll gate: in Upkeep, rolling ENDS a player's turn (auto-advance), so the phase can't
    // advance until EVERY seated player has rolled their cup.
    const rollGateOk = phase !== 'Upkeep' || !live || GAME.order.every((c) => !!GAME.cupRolled[c]);

    // Live event standings: every hero at the CURRENT event, ranked by the event's §5 rule (score
    // / rounds survived, FOUL/OUT aware) so players can watch the podium shift — even with a modWait
    // modal open. `total` is a display string (Σ handled in the UI); multi-round shows the live
    // round value.
    const curRules = eventKey !== null ? rulesForKey(eventKey) : null;
    const romeRank = (isEvent && eventKey !== null) ? romeFor(eventKey) : null;
    const eventRanks = (isEvent && eventKey !== null)
      ? minisAtEvent(eventKey).concat(romeRank ? [romeRank] : []).sort(eventCompare(eventKey))
          .map((m) => {
            if (m.isRome) return { color: 'Rome', sym: null, symImg: null,
                     total: eventDisplay(m, eventKey, true), diced: true, eliminated: false, foul: false };
            const ci = miniCardInfo(m), sc = eventScore(m, eventKey);
            return { color: m.userData.color, sym: m.userData.sym ?? null, symImg: ci.symImg,
                     total: eventDisplay(m, eventKey, true),
                     diced: (m.userData.eventDice || []).length >= requiredFor(m),
                     eliminated: !!m.userData.eliminated,
                     foul: !(curRules && curRules.multiRound) && sc.foul }; })
      : [];
    // Current-event meta for UI banners/hints (objective, win-direction, round progress).
    const eventMeta = (isEvent && eventKey !== null) ? {
      name: curRules ? curRules.name : (eventKey === 'ColosseumBoard.png' ? 'Colosseum' : null),
      objective: curRules ? curRules.objective : null,
      dir: curRules ? curRules.dir : 'max',
      multiRound: !!(curRules && curRules.multiRound),
      longJump: !!(curRules && curRules.longJump),
      round: GAME.eventRound,
      roundCount: (curRules && curRules.multiRound) ? curRules.rounds.length : 0,
      roundLabel: (curRules && curRules.multiRound) ? (curRules.rounds[GAME.eventRound] || {}).label : null,
    } : null;

    // guided event-walk snapshot for the UI
    const parts = isEvent && eventKey !== null ? eventParticipants(eventKey) : [];
    const eventWalk = isEvent ? {
      active: eventKey !== null,
      key: eventKey, label: eventKey === null ? null : labelForEvent(eventKey),
      index: GAME.eventIndex, count: GAME.eventKeys.length,
      participants: parts.slice(), evtTurnIndex: GAME.evtTurnIndex,
      isLastParticipant: eventKey !== null && GAME.evtTurnIndex >= parts.length - 1,
      currentFull: eventKey !== null && participantFull(current, eventKey),
      everyoneFull: eventKey !== null && eventEveryoneFull(eventKey),
      complete: eventWalkComplete(),
    } : null;

    return {
      started: GAME.started, over: GAME.over,
      round: GAME.round, totalRounds: TOTAL_ROUNDS, era: eraOf(GAME.round),
      phase, phases, phaseIndex: GAME.phaseIndex,
      order: GAME.order.slice(),
      turnIndex: GAME.turnIndex, current,
      perPlayer, isEvent,
      res: JSON.parse(JSON.stringify(GAME.res)),
      barracks: GAME.barracks ? { ...GAME.barracks } : null,
      colWait: GAME.colWait ? { key: GAME.colWait.key, label: GAME.colWait.label, step: colWaitStep() } : null,
      race: JSON.parse(JSON.stringify(GAME.race)),
      rome: GAME.rome ? { chariotPos: GAME.rome.chariotPos, laps: GAME.rome.laps, act: romeAct() + 1 } : null,
      cup: JSON.parse(JSON.stringify(GAME.cup)),
      cupRolled: { ...GAME.cupRolled },
      exchanged: JSON.parse(JSON.stringify(GAME.exchanged)),
      columns: JSON.parse(JSON.stringify(GAME.columns)),
      godNames: { 1: godName(1), 2: godName(2), 3: godName(3) },
      income: { ...(GAME.income || {}) },
      favorUnlocked: { ...GAME.favorUnlocked },
      favor: favorState(favorActor()),
      favorCtx: favorEventCtx(favorActor()),
      viewerSeat: favorActor(),
      favorMsg: GAME.favorMsg || null,
      favorRecoup: { spent: GAME.favorSpent[favorActor()] ? Object.keys(GAME.favorSpent[favorActor()]).length : 0,
                     canAfford: (GAME.res[favorActor()]?.sun || 0) >= 3 },
      favorInColosseum: !!GAME.colosseum,
      prompt: promptFlow(),
      chariotUnlocked: { ...(GAME.chariotUnlocked || {}) },
      relicUnlocked: { ...(GAME.relicUnlocked || {}) },
      factions: FACTIONS,
      log: GAME.log.slice(-8),
      rollGateOk,
      heroes, selectedHeroId, firstDieMustRoll, eventGateOk: eventGateOk(),
      eventWalk, eventRanks, eventMeta, lastResolution: GAME.lastResolution ? JSON.parse(JSON.stringify(GAME.lastResolution)) : null,
      summaryOpen: !!GAME.summaryOpen,
      summaryLast: !!GAME.summaryOpen && (GAME.eventIndex + 1) >= GAME.eventKeys.length,
      colosseum: colFlow(),
      endGame: GAME.result ? JSON.parse(JSON.stringify(GAME.result)) : null,
      activeColor: activeColorName,
      seatKind: { ...GAME.seatKind },
      isCpuTurn: cpuTurnActive(),
      cpuActive: anyCpuSeat() && GAME.started && !GAME.over && !GAME.colAnimating && (cpuTurnActive() || !!GAME.colosseum),
      placeDone: { ...GAME.placeDone },
      cpuPaused: !!GAME.cpuPaused,
      laneLen: RACE_LANE.length,
      outerLaneLen: OUTER_LANE.length,
    };
  }
  const notifyFlow = () => { syncColScene(); if (flowCb) flowCb(getFlow()); };

  // ---- camera framing per player ----
  const matMeshOf = (color) => boardMeshes.find((m) => m.userData.color === color);
  function focusPlayer(color) { const m = matMeshOf(color); if (m) focusBoard(m); }
  // Frame a player's mat together with the central event row (strips z≈45, active z≈76).
  function focusMatAndEvents(color) {
    const mat = LAYOUT.find((b) => b.color === color);
    if (!mat) { frameTable(true); return; }
    const events = LAYOUT.filter((b) => b.slotsDef === EVENT_GRID || b.slot !== undefined);
    const boxes = [mat, ...events];
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const b of boxes) {
      const hw = b.w / 2, hz = (b.h || b.w) / 2;
      minX = Math.min(minX, b.x - hw); maxX = Math.max(maxX, b.x + hw);
      minZ = Math.min(minZ, b.z - hz); maxZ = Math.max(maxZ, b.z + hz);
    }
    frameBox(minX, maxX, minZ, maxZ, 0.85);
  }
  const marketMesh = () => boardMeshes.find((b) => b.userData.boardKey === 'market');
  function focusMarket() { const m = marketMesh(); if (m) focusBoard(m); else frameTable(true); }
  const focusCurrent = () => {
    const c = curPlayer(); if (!c) return;
    if (curPhase() === 'Market') { focusMarket(); return; }   // Market shops the shared display
    focusPlayer(c);   // other per-player phases (incl. Blind Placement) frame just the active board
  };

  // Called after any phase change. On forward entry to Upkeep, everyone simultaneously
  // gets income + a fresh 3-card hand; ◂ Back never re-grants (guarded by `forward`).
  function enterPhase(forward) {
    GAME.turnIndex = 0;
    if (!GAME.started || GAME.over) { return; }
    moveRoundMarker();   // hop the bottom era/round token to the current round's cell
    if (curPhase() === 'Upkeep' && forward) {
      GAME.eventFavorFlags = {};   // per-event favor flags (deny-1st / no-sponsor / one-per-faction) reset each round
      GAME.placeDone = {};         // CPU "done placing in Blind Placement" flags reset each round
      for (const c of ALL_COLORS) { grantIncome(c); dealHand(c, 3); resetCup(c); }
      clearAllHeroDice();                       // last round's played dice are spent
      selectedHeroId = null;
      // Deal a fresh random event trio for each new round (round 1's trio comes from New game). (D5)
      if (GAME.round > 1 && newRoundCb) newRoundCb();
    }
    // Leaving events for the Market: every mini that competed (or sat at the barracks) returns
    // home and its hero card is discarded — unless it's waiting for the Colosseum (kept locked).
    if (curPhase() === 'Market' && forward) { GAME.marketVisited = {}; returnPlayedMinisHome(); sweepFreeCards(); restockMarket(); }
    const phase = curPhase();
    if (phase === 'Resolution & Podiums' || phase === 'Colosseum') {
      // on forward entry to the Colosseum, seat every committed (waiting) mini into the arena
      if (phase === 'Colosseum' && forward) seatWaitingIntoArena();
      // freeze the walk order for this phase (see curEventKey), then start at the first event
      GAME.eventKeys = eventOrder().filter((k) => minisAtEvent(k).length);
      GAME.eventIndex = 0; GAME.evtTurnIndex = 0; GAME.resolved = []; GAME.lastResolution = null;
      GAME.colWait = null; GAME.modWait = null; GAME.summaryOpen = false;
      selectedHeroId = null;
      enterEventKey(curEventKey());                                // first event (multi-round → round 0)
    } else if (isPerPlayer()) { activeColorName = curPlayer(); focusCurrent(); }
    else { frameTable(true); }
  }

  // Step the active-player cursor within a per-player phase (cycles / loops).
  function stepPlayer(dir) {
    if (!GAME.started || GAME.over || !isPerPlayer()) return;
    const n = GAME.order.length;
    // Market: passing forward means "I'm done shopping." Once everyone has had their turn,
    // advance the phase instead of looping back to the first shopper (D3).
    if (curPhase() === 'Market' && dir === 1) {
      GAME.marketVisited[curPlayer()] = true;
      if (GAME.order.every((c) => !!GAME.marketVisited[c])) { nextPhase(); return; }
    }
    GAME.turnIndex = (GAME.turnIndex + dir + n) % n;
    // Blind Placement: skip seats that already finished placing (CPU passed / human clicked Done).
    if (curPhase() === 'Blind Placement') {
      let guard = 0;
      while (GAME.placeDone[GAME.order[GAME.turnIndex]] && guard++ < n) GAME.turnIndex = (GAME.turnIndex + dir + n) % n;
    }
    activeColorName = curPlayer();
    if (curPhase() === 'Market') restockMarket();   // refresh the shop for the next shopper
    focusCurrent();
    notifyFlow();
  }
  const nextPlayer = () => stepPlayer(1);
  const prevPlayer = () => stepPlayer(-1);

  // ---- Blind Placement: click a mini to send it to an event / barracks ----
  // Returns the placement menu for a mini, or null if it can't be placed right now
  // (wrong phase, not the current player's, locked, or already committed this round).
  // §4 placement limits: max 3 minis deployed per round, max 2 to Barracks, and at least 1 must enter
  // an event (so a 2nd Barracks is refused while no event has been entered yet).
  function placementLimitOk(color, kind) {
    const own = pieces.filter((m) => m.userData.type === 'mini' && m.userData.color === color);
    const atEvents = own.filter((m) => m.userData.slot && m.userData.slot.event).length;
    const bar = own.filter((m) => m.userData.slot && m.userData.slot.role === 'barracks').length;
    if (atEvents + bar >= 3) return false;
    if (kind === 'barracks') return bar < 2 && (atEvents >= 1 || bar === 0);
    return true;
  }
  function placementFor(mini) {
    if (!GAME.started || GAME.over || curPhase() !== 'Blind Placement') return null;
    if (!mini || mini.userData.type !== 'mini') return null;
    if (mini.userData.color !== curPlayer() || mini.userData.locked) return null;
    const cur = mini.userData.slot;
    if (cur && (cur.event || cur.role === 'barracks')) return null;   // already committed
    const color = mini.userData.color;
    const coins = GAME.res[color]?.coin ?? 0;
    const options = [0, 1, 2].map((i) => {
      const free = SLOTS.some((o) => o.event && eventSlotIndex(o.bx) === i && o.color === color && !o.occupants.length);
      const fee  = SLOTS.filter((o) => o.event && eventSlotIndex(o.bx) === i && o.coin && !o.occupants.length).length;
      const capped = (GAME.eventFavorFlags[i] || {}).onePerFaction && minisAtEvent(i).some((m) => m.userData.color === color);   // Teshub
      return { kind: 'event', key: i, label: labelForEvent(i), fee, disabled: !free || fee > coins || capped || !placementLimitOk(color, 'event') };
    });
    const barFree = SLOTS.some((o) => o.role === 'barracks' && o.color === color && !o.occupants.length);
    options.push({ kind: 'barracks', key: 'barracks', label: 'Barracks', fee: 0, disabled: !barFree || !placementLimitOk(color, 'barracks') });
    return {
      id: mini.userData.id, color, sym: mini.userData.sym ?? null,
      symImg: (mini.userData.sym != null) ? symbolFile(color, mini.userData.sym) : null,
      face: miniCardInfo(mini).face, options,
    };
  }
  // Commit a mini to an event (key 0/1/2) or the barracks — the virtual "drag".
  function sendMiniTo(id, kind, key) {
    if (!GAME.started || GAME.over || curPhase() !== 'Blind Placement') return;
    const mini = findMini(id);
    if (!mini || mini.userData.color !== curPlayer() || mini.userData.locked) return;
    const cur = mini.userData.slot;
    if (cur && (cur.event || cur.role === 'barracks')) return;        // already committed
    const color = mini.userData.color;
    if (!placementLimitOk(color, kind)) return;              // §4 caps (3 deployed, ≤2 Barracks, ≥1 event)
    if (kind === 'barracks') {
      const bar = SLOTS.find((o) => o.role === 'barracks' && o.color === color && !o.occupants.length);
      if (!bar) return;
      placeOnSlot(mini, bar);
      openBarracks(color);                    // reward modal; turn ends when it's dismissed
      GAME.pendingTurnEnd = true;
      notifyFlow();
    } else {
      const opts = SLOTS.filter((o) => o.event && eventSlotIndex(o.bx) === key && o.color === color && !o.occupants.length)
                        .sort((a, b) => Math.abs(a.x - a.bx) - Math.abs(b.x - b.bx));   // innermost (coin) first
      if (!opts.length) return;
      if ((GAME.eventFavorFlags[key] || {}).onePerFaction && minisAtEvent(key).some((m) => m.userData.color === color)) return;   // Teshub cap
      const fee = SLOTS.filter((o) => o.event && eventSlotIndex(o.bx) === key && o.coin && !o.occupants.length).length;
      if (fee) { adjustRes(color, 'coin', -fee); mini.userData.eventFee = fee; }
      placeOnSlot(mini, opts[0]);
      nextPlayer();                           // committing one mini ends the turn
    }
  }

  // Buy a cup die with Lightning (⚡): charge the current player (guided — they bump
  // the dice count + roll). Rules: 1⚡ = +1 die to your cup before rolling.
  function buyDie() { const c = curPlayer(); if (c) adjustRes(c, 'zap', -DIE_ZAP_COST); }
  // World anchor for a faction's discard pile: beside its deck, opposite the hand fan.
  function discardAnchor(b) { const a = deckAnchor(b); return { x: a.x, z: a.z - 30 }; }
  // A stacking drop-target beside a nation's deck: drag a Cheer/Jeer here for +2 coins
  // (the reward is granted in endDrag when a modifier card lands on role 'discard').
  function addDiscardSlot(color, x, z) {
    const y = 0.06;
    const marker = makeSlotMarker(x, y, z, 9, color);
    slotMarkersGroup.add(marker);
    const slot = { x, y, z, r: 9, accepts: ['card'], color, owner: color, role: 'discard',
                   coin: false, event: false, boardKey: null, track: null, ord: null, bx: x,
                   lane: null, stack: true, marker, occupants: [] };
    SLOTS.push(slot);
    return slot;
  }
  // Public favor-discard pile: spent favor cards land here face-up so every player can see what
  // was played (the private favor HAND is a UI panel; only spent cards become physical).
  function favorDiscardAnchor(b) { const a = deckAnchor(b); return { x: a.x, z: a.z - 60 }; }
  function addFavorDiscardSlot(color, x, z) {
    const y = 0.06;
    const marker = makeSlotMarker(x, y, z, 9, color);
    slotMarkersGroup.add(marker);
    const slot = { x, y, z, r: 9, accepts: ['card'], color, owner: color, role: 'favor-discard',
                   coin: false, event: false, boardKey: null, track: null, ord: null, bx: x,
                   lane: null, stack: true, marker, occupants: [] };
    SLOTS.push(slot);
    return slot;
  }

  function startGame(seatConfig) {
    GAME.started = true; GAME.over = false; GAME.round = 1; GAME.phaseIndex = 0;
    // Seat kinds (human/cpu). Default: Blue human, the rest CPU. All 4 factions always race.
    GAME.seatKind = {}; GAME.placeDone = {};
    for (const c of ALL_COLORS) GAME.seatKind[c] = (seatConfig && seatConfig[c]) || (c === 'Blue' ? 'human' : 'cpu');
    // §13: a random starting seat; round 1 runs clockwise from it (the seat coin bonus follows).
    { const r = Math.floor(Math.random() * SEAT_ORDER.length); GAME.round1Seat = SEAT_ORDER.slice(r).concat(SEAT_ORDER.slice(0, r)); }
    GAME.order = computeOrder(1);
    GAME.turnIndex = 0;
    initRes();
    initRace();
    initGladDeck();
    GAME.colosseum = null; GAME.colAct = null; GAME.romeLostRound = false;
    GAME.colPush = null; GAME.colSelId = null; GAME.colAnimating = false;
    GAME.viewerSeat = ALL_COLORS.find((c) => !isCpu(c)) || null;   // favor panel starts on the first human seat
    GAME.gods = pickGods();                              // flip a random face up on each pillar
    refreshColumnFaces();                                // show the chosen Column{n}_{1|2}.png art
    GAME.columns = {}; GAME.favorUnlocked = {}; GAME.log = []; GAME.prompts = [];
    GAME.favorSpent = {}; GAME.favorAfterlife = {}; GAME.eventFavorFlags = {};
    for (const c of ALL_COLORS) { GAME.columns[c] = { 1: 0, 2: 0, 3: 0 }; GAME.favorUnlocked[c] = false; GAME.favorSpent[c] = {}; }
    logNote('🏛 Gods this game: ' + [1, 2, 3].map((cn) => godName(cn)).join(' · ') + '.');
    GAME.pendingVP = {}; GAME.elysium = []; GAME.tartarus = []; GAME.result = null;
    enterPhase(true);
    notifyFlow();
  }
  function nextPhase() {
    if (!GAME.started || GAME.over || GAME.colosseum) return;   // never leave a live fight behind
    const phases = phasesFor(GAME.round);
    if (GAME.phaseIndex < phases.length - 1) {
      GAME.phaseIndex++;
    } else if (GAME.round < TOTAL_ROUNDS) {
      GAME.round++; GAME.phaseIndex = 0; GAME.order = computeOrder(GAME.round);
      if (eraOf(GAME.round) !== eraOf(GAME.round - 1)) for (const c of ALL_COLORS) recoupFavors(c, true);  // free recoup each era
      if (GAME.romeLostRound) { colBurnGladiator(); GAME.romeLostRound = false; }  // §14.D deck burn
    } else {
      GAME.over = true;
      scoreEndGame();                                              // apply deferred VP → declare winner
    }
    enterPhase(true);
    notifyFlow();
  }
  function prevPhase() {
    if (!GAME.started || GAME.colosseum) return;   // can't step back out of a live fight
    GAME.over = false;
    if (GAME.phaseIndex > 0) {
      GAME.phaseIndex--;
    } else if (GAME.round > 1) {
      GAME.round--; GAME.order = computeOrder(GAME.round);
      GAME.phaseIndex = phasesFor(GAME.round).length - 1;
    }
    enterPhase(false);
    notifyFlow();
  }

  // Lay a face-down pile of `n` card backs centered at world (x,z): step up in y
  // with a tiny xz jitter so it reads as a stacked deck.
  function dealPile(file, n, x, z, size) {
    for (let i = 0; i < n; i++) {
      const c = addToken(file, size, 'card');
      c.position.set(x + (Math.random() - 0.5) * 1.4, 0.06 + i * 0.05, z + (Math.random() - 0.5) * 1.4);
    }
  }

  // World anchor for a faction's personal deck: beside the mat's OUTER edge
  // (left of left-side mats, right of right-side mats).
  function deckAnchor(b) {
    return { x: b.x + (b.x < 0 ? -(b.w / 2 + 12) : (b.w / 2 + 12)), z: b.z };
  }

  // Point a card at a texture, resizing its plane to that image's aspect. Cards are
  // flat planes, so "face down" is just the card back; flipping swaps the map.
  function setCardFace(g, file) {
    // Claim the plane synchronously so a late-resolving addToken back-load can't
    // clobber the face we're about to apply (the two loads race on the same plane).
    g.userData.faceApplied = true;
    new THREE.TextureLoader().load(ASSET_BASE + file, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const aspect = (tex.image.width / tex.image.height) || 1;
      const w = aspect >= 1 ? 22 : 22 * aspect;
      const h = aspect >= 1 ? 22 / aspect : 22;
      // If addToken's loader bailed (faceApplied) the plane may not exist yet — mint it.
      let plane = g.children[0];
      if (!plane) {
        plane = new THREE.Mesh(
          new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
        );
        plane.rotation.x = -Math.PI / 2;
        g.add(plane);
        return;
      }
      plane.geometry.dispose();
      plane.geometry = new THREE.PlaneGeometry(w, h);
      plane.material.map = tex;
      plane.material.needsUpdate = true;
    });
  }

  // Build a faction's face-down personal deck (shuffled) as real cards that each
  // remember their true face, stacked at the deck anchor. Dealing pulls from these.
  function buildDeck(colorName, faces, x, z) {
    const order = faces.slice();
    for (let i = order.length - 1; i > 0; i--) {   // Fisher–Yates
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.forEach((face, i) => {
      const c = addToken('BackofCards.png', 22, 'card');   // shown face-down
      c.userData.owner = colorName;
      c.userData.zone = 'deck';
      c.userData.face = face;
      c.userData.cardKind = (face === 'Cheer.png' || face === 'Jeer.png') ? 'modifier' : 'hero';
      c.position.set(x + (Math.random() - 0.5) * 1.4, 0.06 + i * 0.05, z + (Math.random() - 0.5) * 1.4);
    });
  }

  // Deal a FRESH `n`-card hand from a faction's deck: first discard any cards the player
  // didn't play last round (use-them-or-lose-them — no carryover), then take the top cards
  // off the deck pile, flip them face up (the active player sees their own hand), and lay
  // them in a column just below the deck. Like the dice cup, the hand is private —
  // it'll be hidden from other players when visibility lands.
  function dealHand(colorName, n = 3) {
    const deckOf = () => pieces
      .filter((p) => p.userData.type === 'card' && p.userData.owner === colorName && p.userData.zone === 'deck')
      .sort((p, q) => q.position.y - p.position.y);   // top of the pile first
    const hand = slotsByRole('hand', colorName).sort((a, b) => (a.ord ?? 0) - (b.ord ?? 0));
    const b = LAYOUT.find((l) => l.color === colorName);
    const anchor = b ? deckAnchor(b) : null;
    // Clear the hand to the discard pile so exactly `n` cards are dealt each round (no carryover).
    const disc = discardSlotOf(colorName);
    for (const s of hand) for (const c of s.occupants.slice()) {
      if (c.userData.type !== 'card') continue;
      freeSlot(c);
      c.userData.zone = 'discard';
      if (disc) { placeOnSlot(c, disc); setCardFace(c, c.userData.face); }
    }
    for (let i = 0; i < n; i++) {
      const free = hand.find((s) => !s.occupants.length);   // fill left→right into the now-empty hand
      if (!free) break;
      let deck = deckOf();
      // Draw pile empty? Shuffle the discard pile back into it, then resume dealing.
      if (!deck.length) { reshuffleDiscardIntoDeck(colorName, anchor); deck = deckOf(); }
      const c = deck[0]; if (!c) break;
      c.userData.zone = 'hand';
      setCardFace(c, c.userData.face);               // reveal to the active player
      placeOnSlot(c, free);
    }
  }

  // Shuffle a faction's discard pile back into its (face-down) draw pile, restacked at the deck
  // anchor — used by dealHand when the draw pile runs dry mid-deal.
  function reshuffleDiscardIntoDeck(colorName, anchor) {
    const disc = pieces.filter((p) =>
      p.userData.type === 'card' && p.userData.owner === colorName && p.userData.zone === 'discard' && !p.userData.favorDiscard);
    if (!disc.length) return;
    for (let i = disc.length - 1; i > 0; i--) {          // Fisher-Yates
      const j = Math.floor(Math.random() * (i + 1));
      [disc[i], disc[j]] = [disc[j], disc[i]];
    }
    disc.forEach((c, i) => {
      freeSlot(c);                                        // leave the discard slot
      c.userData.zone = 'deck';
      setCardFace(c, 'BackofCards.png');                  // face-down draw pile again
      if (anchor) c.position.set(anchor.x + (Math.random() - 0.5) * 1.4, 0.06 + i * 0.05, anchor.z + (Math.random() - 0.5) * 1.4);
    });
  }

  // One-click game setup: seat every faction's starting pieces + deal the market.
  function initGame(heroPool = [], seatConfig = null) {
    clearPieces();

    // per-faction: 5 color-matched minis on the hero-market circles + income token.
    // Resources (🪙/⚡/☀) are NOT tokens on the table anymore — they're tracked in
    // GAME.res and shown in the left/right menus, so nothing is seated for them here.
    NATIONS.forEach((nat) => {
      // 5 minis, each stamped with this faction's slot symbol (0-4). Card slots start
      // EMPTY — deal a hand and slot a hero to activate a mini; a mini with no card in
      // its matching slot is simply inactive.
      for (const slot of slotsByRole('hero-market', nat.color)) addMini(nat.stl, nat.color, slot, slot.sym);
      const inc = slotsByRole('income', nat.color)[0];
      if (inc) placeOnSlot(addToken('IncomeToken.png', 6, 'income'), inc);
    });

    // seed each faction's (private, panel-only) dice cup — blank until rolled in Upkeep
    initCup();

    // per-mat: face-down 5-card starting deck off the mat's OUTER edge, built as real cards
    // so "Deal hand" can draw 3 face-up each round. Composition: 3 generalists (1/1) + 1 Brute
    // (Str2/Spd0) + 1 Runner (Str0/Spd2). Cheer/Jeer moved to the Bacchanal favor card, so the
    // deck is all heroes. dealHand persists the draw pile: R1 draws 3, R2 takes the 2 leftovers
    // + reshuffles the discard for the 3rd, and so on.
    for (const b of LAYOUT) {
      if (!b.color) continue;
      const a = deckAnchor(b);
      const L = b.color[0];                        // Blue/Green/Purple/Yellow → B/G/P/Y
      const gen = 'Plebe' + L + '1_1.png';
      buildDeck(b.color, [gen, gen, gen, 'Plebe' + L + '2_0.png', 'Plebe' + L + '0_2.png'], a.x, a.z);
      const d = discardAnchor(b);                 // drag a modifier here for +2 coins
      addDiscardSlot(b.color, d.x, d.z);
      const fd = favorDiscardAnchor(b);           // public spent-favor-card pile
      addFavorDiscardSlot(b.color, fd.x, fd.z);
    }

    // markers for all 4 nations at the start of every relevant track (auto-fan)
    for (const role of ['column-start', 'relic-start', 'chariot-start', 'lap-start']) {
      for (const slot of slotsByRole(role)) {
        for (const color of ALL_COLORS) placeOnSlot(addMarker(color), slot);
      }
    }
    // on-foot race markers: behind the start/finish line (pos 0 = last space),
    // so the first VP steps onto space 1 without banking a lap.
    buildRaceLane();
    if (RACE_LANE.length) {
      for (const color of ALL_COLORS) placeOnSlot(addMarker(color), RACE_LANE[RACE_LANE.length - 1]);
    }
    // Rome's black chariot behind the start/finish line of the outer lane
    buildOuterLane();
    if (OUTER_LANE.length) placeOnSlot(addRomeChariot(), OUTER_LANE[OUTER_LANE.length - 1]);
    const era = slotsByRole('era-start')[0];      // round tracker on the era start
    if (era) placeOnSlot(addRound(), era);

    // market: 3 revealed heroes (random from the pool) + a face-down draw pile.
    // GAME.marketPool feeds restock (with replacement) as the display is bought down.
    GAME.marketPool = heroPool.slice();
    const pool = heroPool.slice();
    for (const slot of slotsByRole('market-hero')) {
      if (!pool.length) break;
      const pick = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      const c = addToken(pick, 22, 'card');
      c.userData.face = pick; c.userData.cardKind = 'hero';
      placeOnSlot(c, slot);
    }
    const deck = slotsByRole('market-deck')[0];
    if (deck) dealPile('BackofCards.png', 3, deck.x, deck.z, 22);

    startGame(seatConfig);   // initialize the flow backbone (round 1, phase 0, seat order, VP=0, seat kinds)
  }

  // ---- sandbox: jump a fresh game straight to the start of a Colosseum round ----
  // Random gladiator, a random squad from each team, a random hero/plebe card per fighter,
  // and random 0–5 starting coin/⚡/☀ per faction. For quickly playtesting combat.
  // gladIdx: index into GLAD_DECK to force (any level), or -1/undefined for a random pick.
  function simToColosseum(heroPool = [], gladIdx = -1, wantN = 0, seatConfig = null) {
    initGame(heroPool, seatConfig);                         // full board setup (round 1 / Upkeep), honours the seat selects
    // initGame's minis stream in ASYNC (each STL loads in a loader.load callback — see addMini),
    // so `pieces` is still empty the instant this returns. Wait for the squad to arrive, THEN
    // build the arena; otherwise we'd seat nothing and land back at round-1 Upkeep.
    const target = SLOTS.filter((s) => s.role === 'hero-market').length || 20;
    const t0 = Date.now();
    const build = () => buildColosseumSandbox(heroPool, gladIdx, wantN);
    const waitForMinis = () => {
      const n = pieces.filter((m) => m.userData.type === 'mini').length;
      if (n >= target || Date.now() - t0 > 6000) build();   // all loaded (or give up after 6s)
      else setTimeout(waitForMinis, 60);
    };
    waitForMinis();
  }

  // Second half of the sandbox jump — runs once the minis have finished loading.
  // wantN: how many heroes to field total (0 = random). Assigned randomly across factions, max 3 each.
  function buildColosseumSandbox(heroPool = [], gladIdx = -1, wantN = 0) {
    const r5 = () => Math.floor(Math.random() * 6);         // 0..5
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    // Per-faction pool of minis (shuffled), capped at 3 usable per faction.
    const minisByColor = {}, capSlots = [];
    for (const nat of NATIONS) {
      minisByColor[nat.color] = shuffle(pieces.filter((m) => m.userData.type === 'mini' && m.userData.color === nat.color));
      const avail = Math.min(3, minisByColor[nat.color].length);   // no more than 3 to a faction
      for (let i = 0; i < avail; i++) capSlots.push(nat.color);
    }
    const maxN = capSlots.length;                           // total capacity (≤ 3 × #factions)
    // Requested count (clamped 2..maxN); random 2..min(8,maxN) when unspecified.
    const want = wantN > 0 ? Math.max(2, Math.min(wantN, maxN))
                           : Math.max(2, Math.min(2 + Math.floor(Math.random() * 7), maxN));
    // Randomly hand out `want` seats across factions, respecting the per-faction cap.
    const take = shuffle(capSlots.slice()).slice(0, want);
    const chosen = [], idxByColor = {};
    for (const color of take) {
      const i = idxByColor[color] || 0; idxByColor[color] = i + 1;
      const m = minisByColor[color][i]; if (m) chosen.push(m);
    }
    // give every fighter a card (hero or plebe) on its tied card slot so it has Str/Speed
    for (const m of chosen) {
      const color = m.userData.color, sym = m.userData.sym;
      const useHero = heroPool.length && Math.random() < 0.6;
      const plebeFace = 'Plebe' + color[0] + ['2_0', '0_2', '1_1'][Math.floor(Math.random() * 3)] + '.png';
      const face = useHero ? heroPool[Math.floor(Math.random() * heroPool.length)] : plebeFace;
      const slot = SLOTS.find((s) => s.role === 'card' && s.owner === color && s.sym === sym);
      if (slot) { const card = addToken(face, 22, 'card'); card.userData.face = face; card.userData.cardKind = useHero ? 'hero' : 'plebe'; placeOnSlot(card, slot); }
      m.userData.waiting = true; m.userData.locked = true;  // committed to the arena
    }
    // random starting economy 0..5 of each per faction
    for (const c of ALL_COLORS) GAME.res[c] = { coin: r5(), zap: r5(), sun: r5() };
    // jump straight to a Colosseum interlude and open the fight (bypass the event walk /
    // "Resolve event" gate — seat the squad, then hand off to startColosseum directly).
    GAME.round = COLOSSEUM_ROUNDS[0]; GAME.order = computeOrder(GAME.round); GAME.turnIndex = 0;
    GAME.phaseIndex = phasesFor(GAME.round).indexOf('Colosseum');
    moveRoundMarker();                                      // seat the round token at the first arena round
    seatWaitingIntoArena();                                 // move the waiting minis into the arena
    GAME.eventKeys = eventOrder().filter((k) => minisAtEvent(k).length);
    GAME.eventIndex = 0; GAME.evtTurnIndex = 0; GAME.resolved = []; GAME.lastResolution = null;
    GAME.colWait = null; GAME.modWait = null; GAME.summaryOpen = false;
    selectedHeroId = null;
    // Force the chosen gladiator on top of the deck (any level); random if none selected. Without
    // this, the deck is level-1-on-top so the sim always drew a level-1 card.
    if (!GAME.gladDeck || !GAME.gladDeck.length) initGladDeck();
    const gi = (gladIdx != null && gladIdx >= 0 && gladIdx < GLAD_DECK.length)
      ? gladIdx : Math.floor(Math.random() * GLAD_DECK.length);
    GAME.gladDeck.unshift(gi);
    startColosseum();                                       // draws GLAD_DECK[gi] + opens combat
    notifyFlow();
  }

  // ------------------------------------------------------------------ public API
  // ============================ CPU PLAYERS ============================
  // Seats are human/cpu (GAME.seatKind). The driver (JS_UI) calls PT.cpuStep() on a timer whenever
  // getFlow().cpuActive; cpuStep performs ONE atomic action via the same internal functions a human
  // uses, then returns true (act again) / false (human's turn or waiting). No new rules logic.
  const anyCpuSeat   = () => ALL_COLORS.some((c) => isCpu(c));
  const anyHumanSeat = () => ALL_COLORS.some((c) => !isCpu(c));
  // Whose input is currently expected, and is that a CPU? (drives UI gating + the driver.)
  function cpuTurnActive() {
    if (!GAME.started || GAME.over) return false;
    if (GAME.barracks) return isCpu(GAME.barracks.color);
    if (GAME.colWait) { const s = colWaitStep(); if (s) return isCpu(s.color); }
    if (GAME.prompts && GAME.prompts.length) return isCpu(GAME.prompts[0].color);
    if (GAME.colosseum) return !GAME.colosseum.fighters.some((x) => !isCpu(x.color));   // all-CPU fight
    if (GAME.summaryOpen) return !anyHumanSeat();                                        // auto only in watch mode
    if (isPerPlayer()) { const c = curPlayer(); return !!c && isCpu(c); }
    if (isEventPhase()) { const p = curEventPlayer(); return !!p && isCpu(p); }
    return false;
  }

  // ---- Blind Placement: a seat signals it's finished placing (CPU auto / human button) ----
  function passPlacement(color) {
    if (!GAME.started || GAME.over || curPhase() !== 'Blind Placement') return;
    const c = color || curPlayer(); if (!c) return;
    GAME.placeDone[c] = true;
    if (GAME.order.every((x) => GAME.placeDone[x])) { nextPhase(); return; }
    if (curPlayer() === c) nextPlayer(); else notifyFlow();
  }

  // ---- per-phase CPU decisions (one atomic action each; return true if acted) ----
  // CPU free zones on its own turn: spend a card's free zone when it helps (scarce resources, or a
  // track step). The CPU acts as the favor viewer for each call, then restores it.
  function cpuFreeFavor(color) {
    const save = GAME.viewerSeat; GAME.viewerSeat = color;
    try {
      const r = GAME.res[color] || { coin: 0, zap: 0, sun: 0 };
      for (const cd of favorState(color)) {
        if (!cd.free || !cd.free.playable) continue;
        let opt = null;
        if (cd.free.type === 'choose') opt = { choice: r.coin < 2 ? 0 : 1 };
        if (cd.free.type === 'swap') {
          if (r.zap >= 2 && r.coin < 4) opt = { dir: 'z2c' };
          else if (r.coin >= 2 && r.zap < 2) opt = { dir: 'c2z' };
          else continue;
        }
        if (playFavorFree(cd.id, opt)) return true;
      }
      return false;
    } finally { GAME.viewerSeat = save; }
  }
  function cpuUpkeep(color) {
    if (cpuFreeFavor(color)) return true;     // play any useful free zone first (each spends a card)
    // Already rolled (e.g. stepped back into Upkeep): don't re-roll — just move the turn/phase on.
    if (GAME.cupRolled[color]) {
      if (GAME.order.every((c) => GAME.cupRolled[c])) nextPhase(); else nextPlayer();
      return true;
    }
    const r = GAME.res[color] || { coin: 0, zap: 0, sun: 0 }, ex = GAME.exchanged[color] || {};
    if (r.coin < 2 && r.sun > 2 && !ex.sun) { exchangeForCoin(color, 'sun'); return true; }   // coin-starved → convert surplus
    if (r.coin < 2 && r.zap > 2 && !ex.zap) { exchangeForCoin(color, 'zap'); return true; }
    if (r.zap >= 4 && !GAME.cupRolled[color] && (GAME.cup[color] || []).length <= cupBaseFor(color)) { addCupDie(color); return true; }
    rollCup(color); return true;                                                               // rolling ENDS the Upkeep turn
  }
  // Stat↔event fit for placement (higher = better) — from each event's scoring direction.
  function cpuPlaceFit(st, key) {
    const r = rulesForKey(key); const nm = (r && r.name) || '';
    if (/Discus/i.test(nm))       return st.str * 2;                 // 2d+Str (max)
    if (/Sprint/i.test(nm))       return st.speed * 2;              // 2d−Speed (min)
    if (/Wrestling/i.test(nm))    return Math.max(st.str, st.speed) * 1.5;
    if (/Long ?Jump/i.test(nm))   return st.str + st.speed;
    if (/High ?Jump/i.test(nm))   return st.str * 2;
    if (/Archer|Javelin/i.test(nm)) return st.speed * 1.5 + st.str * 0.5;
    return st.str + st.speed;
  }
  function cpuPlace(color) {
    const own = pieces.filter((m) => m.userData.type === 'mini' && m.userData.color === color && !m.userData.locked);
    const uncommitted = own.filter((m) => !(m.userData.slot && (m.userData.slot.event || m.userData.slot.role === 'barracks')));
    const atEvents = [0, 1, 2].reduce((a, k) => a + minisAtEvent(k).filter((m) => m.userData.color === color).length, 0);
    const barracksUsed = own.filter((m) => m.userData.slot && m.userData.slot.role === 'barracks').length;
    if ((atEvents + barracksUsed) >= 3 || !uncommitted.length) { passPlacement(color); return true; }
    const coins = GAME.res[color]?.coin ?? 0;
    let best = null;
    for (const m of uncommitted) {
      const st = heroStats(m);
      for (const key of [0, 1, 2]) {
        const free = SLOTS.some((o) => o.event && eventSlotIndex(o.bx) === key && o.color === color && !o.occupants.length);
        const fee = SLOTS.filter((o) => o.event && eventSlotIndex(o.bx) === key && o.coin && !o.occupants.length).length;
        const capped = (GAME.eventFavorFlags[key] || {}).onePerFaction && minisAtEvent(key).some((x) => x.userData.color === color);
        if (!free || fee > coins || capped) continue;
        const fit = cpuPlaceFit(st, key) - fee * 0.3;
        if (!best || fit > best.fit) best = { id: m.userData.id, key, fit };
      }
    }
    if (best && (atEvents === 0 || best.fit > 0)) { sendMiniTo(best.id, 'event', best.key); return true; }   // ≥1 event
    if (atEvents >= 1 && barracksUsed < 2) {
      const barFree = SLOTS.some((o) => o.role === 'barracks' && o.color === color && !o.occupants.length);
      if (barFree) { sendMiniTo(uncommitted[0].userData.id, 'barracks', 'barracks'); return true; }
    }
    passPlacement(color); return true;
  }
  function cpuBarracks() {
    const b = GAME.barracks; if (!b) return false; const color = b.color;
    if (!b.picked) { const r = GAME.res[color] || {}; barracksPick(r.sun <= 1 ? 'sun' : r.zap <= 1 ? 'zap' : 'coin'); return true; }
    if (!b.relic && (GAME.res[color]?.zap || 0) >= 1 && !atTrackTop(color, 'relic')) { barracksMove('relic'); return true; }
    if (!b.chariot && (GAME.res[color]?.sun || 0) >= 1 && !atTrackTop(color, 'chariot')) { barracksMove('chariot'); return true; }
    barracksDone(); return true;
  }
  function cpuMarket(color) {
    const r = GAME.res[color] || { coin: 0, zap: 0, sun: 0 };
    if ((r.coin + r.zap * 2 + r.sun * 3) >= 8) {   // only shop when comfortable
      const cards = pieces.filter((c) => c.userData.type === 'card' && c.userData.slot && c.userData.slot.role === 'market-hero');
      let best = null;
      for (const c of cards) {
        const st = statFace(c.userData.face); if (!st) continue;
        const info = marketBuyInfo(c.userData.id); if (!info) continue;
        const idx = info.options.findIndex((o) => o.affordable); if (idx < 0) continue;
        const val = st.str + st.speed;
        if (!best || val > best.val) best = { id: c.userData.id, idx, val };
      }
      if (best && best.val >= 4) { buyMarketCard(best.id, best.idx); return true; }
    }
    nextPlayer(); return true;   // done shopping
  }
  // Event dice-play: pick the cup die that best moves this hero's score toward the event goal.
  function cpuBestCupDie(m, k, h) {
    const rules = rulesForKey(k); const cup = GAME.cup[m.userData.color] || [];
    const dice = (m.userData.eventDice || []); const sumNow = dice.reduce((a, b) => a + b, 0);
    let best = null, bestVal = null;
    for (let i = 0; i < cup.length; i++) {
      const v = cup[i]; if (v == null) continue; let val;
      if (rules && rules.multiRound) {
        if (h.round && h.round.bar != null) val = sumNow + v;                                   // High Jump → max sum
        else if (h.round && h.round.lo != null) val = -Math.abs((sumNow + v) - (h.round.lo + h.round.hi) / 2);  // Archery → band
        else val = sumNow + v;
      } else {
        dice.push(v); const s = eventScore(m, k); dice.pop();
        if (s.foul) continue;
        val = (rules && rules.dir === 'min') ? -s.score : s.score;
      }
      if (bestVal === null || val > bestVal) { bestVal = val; best = i; }
    }
    return best;
  }
  function cpuArcheryDelta(h) {
    const r = h.round; if (!r || r.lo == null) return 0;
    const cur = r.nudge || 0, cap = r.nudgeCap || 0; let d = 0;
    if (r.value < r.lo) d = r.lo - r.value; else if (r.value > r.hi) d = r.hi - r.value;
    if (!d) return 0;
    const room = d > 0 ? (cap - cur) : (-cap - cur);
    return d > 0 ? Math.min(d, Math.max(0, room)) : Math.max(d, Math.min(0, room));
  }
  function cpuEventTurn(color, f) {
    const k = curEventKey(); const heroes = f.heroes || [];
    for (const h of heroes) {                                  // (a) build a hero's dice
      if (h.eliminated) continue; const m = findMini(h.id); if (!m) continue;
      if (h.lj && h.lj.canJump) { if (selectedHeroId !== h.id) { selectHero(h.id); return true; } commitLongJump(h.id); return true; }
      if (h.dice.length < h.required) {
        if (selectedHeroId !== h.id) { selectHero(h.id); return true; }
        if (h.dice.length === 0) { rollRandomDie(color); return true; }   // die 1 = public roll
        const idx = cpuBestCupDie(m, k, h);
        if (idx != null) drawFromCup(color, idx); else rollRandomDie(color);
        return true;
      }
    }
    for (const h of heroes) {                                  // (b) Archery aim
      if (h.eliminated || !h.round || !h.round.nudgeCap) continue;
      const d = cpuArcheryDelta(h); if (d !== 0) { setArcheryNudge(h.id, d); return true; }
    }
    if (participantFull(color, k) && GAME.evtTurnIndex < eventParticipants(k).length - 1) { nextEventParticipant(); return true; }  // (c) pass
    return false;
  }
  function cpuColWait(s) {
    if (s.kind === 'release') { const o = s.options || []; if (o.length) { colWaitRelease(o[o.length - 1].miniId); return true; } return false; }
    if (s.canAfford) colWaitPay(s.miniId); else colWaitSkip(s.miniId);
    return true;
  }
  function cpuPrompt(p) {
    if (p.type === 'colpick') {   // advance the column nearest its top (can't be declined)
      if (!colPickLegal(p.color)) { pruneIllegalPrompts(); return true; }
      const st = GAME.columns[p.color] || { 1: 0, 2: 0, 3: 0 }; let cn = 1, bestOrd = -1;
      for (const c of [1, 2, 3]) { const o = st[c] || 0; if (o < 6 && o > bestOrd) { bestOrd = o; cn = c; } }
      resolveColPick(cn); return true;
    }
    dismissPrompt(); return true;   // draft/trade/elyscard optional → skip for v1
  }
  // CPU colosseum favors (any fight): declare an afterlife card, then boost a fighter. save/restore
  // activeColorName so a human's active swatch isn't disturbed.
  // CPU arena favors, one attempt per stage: 0 afterlife declare · 1 damage (Str / double attack) ·
  // 2 shield the most fragile hero. The CPU acts as the favor viewer for each call, then restores it.
  function cpuColFavor() {
    const c = GAME.colosseum; if (!c) return false;
    c.cpuFav = c.cpuFav || {};
    for (const color of GAME.order) {
      if (!isCpu(color) || (c.cpuFav[color] || 0) >= 3) continue;
      const mine = c.fighters.filter((f) => f.color === color && f.alive);
      if (!mine.length) continue;
      const stage = c.cpuFav[color] || 0;
      const save = GAME.viewerSeat; GAME.viewerSeat = color;
      let played = false;
      try {
        const fav = favorState(color);
        const byStr = mine.slice().sort((x, y) => (y.str + (y.strBonus || 0)) - (x.str + (x.strBonus || 0)));
        if (stage === 0) {
          const af = fav.find((cd) => cd.colosseum && cd.colosseum.playable && cd.colosseum.type === 'afterlife');
          if (af && !GAME.favorAfterlife[color]) played = playFavorColosseum(af.id, {});
        } else if (stage === 1) {
          const d = fav.find((cd) => cd.colosseum && cd.colosseum.playable && (cd.colosseum.type === 'stat' || cd.colosseum.type === 'attackTwice'));
          if (d) played = playFavorColosseum(d.id, d.colosseum.scope === 'all' ? {} : { targetId: byStr[0].id });
        } else {
          const sh = fav.find((cd) => cd.colosseum && cd.colosseum.playable && cd.colosseum.type === 'shield');
          if (sh) {
            const weak = mine.slice().sort((x, y) => (x.speed + (x.speedBonus || 0)) - (y.speed + (y.speedBonus || 0)))[0];
            played = playFavorColosseum(sh.id, { targetId: weak.id });
          }
        }
      } finally { GAME.viewerSeat = save; }
      c.cpuFav[color] = stage + 1;   // each stage is tried once
      if (played) return true;
    }
    return false;
  }
  function cpuColProgress() {
    const c = GAME.colosseum; if (!c) return false;
    if (c.sub === 'done') { dismissColosseum(); return true; }
    if (c.sub === 'counter') { colCounterStep(); return true; }
    if (GAME.colAct) { colWindowContinue(); return true; }
    return false;
  }
  // The single entry point the driver calls. One atomic action per invocation.
  function cpuStep() {
    if (!GAME.started || GAME.over || GAME.colAnimating) return false;
    pruneIllegalPrompts();
    if (GAME.barracks && isCpu(GAME.barracks.color)) return cpuBarracks();
    if (GAME.colWait) { const s = colWaitStep(); if (s && isCpu(s.color)) return cpuColWait(s); return false; }
    if (GAME.prompts && GAME.prompts.length) { if (isCpu(GAME.prompts[0].color)) return cpuPrompt(GAME.prompts[0]); return false; }
    if (GAME.colosseum) {
      if (cpuColFavor()) return true;                                           // CPUs play arena favors (any fight)
      if (GAME.colosseum.fighters.some((x) => !isCpu(x.color))) return false;   // mixed fight → human drives progression
      return cpuColProgress();
    }
    if (GAME.summaryOpen) { if (!anyHumanSeat()) { dismissEventSummary(); return true; } return false; }
    if (isEventPhase()) {
      const k = curEventKey();
      if (k === null) { if (!anyHumanSeat()) { nextPhase(); return true; } return false; }   // walk done → all-CPU moves on
      if (eventEveryoneFull(k)) { resolveEvent(); return true; }               // everyone diced → score it
      const p = curEventPlayer(); if (p && isCpu(p)) return cpuEventTurn(p, getFlow());
      return false;
    }
    if (isPerPlayer()) {
      const c = curPlayer(); if (!c || !isCpu(c)) return false;
      const ph = curPhase();
      if (ph === 'Upkeep') return cpuUpkeep(c);
      if (ph === 'Blind Placement') return cpuPlace(c);
      if (ph === 'Market') return cpuMarket(c);
    }
    return false;
  }

  window.PT = {
    addMini, addToken, addMarker, addRound, rollDice, reroll, clearPieces, resetView,
    setEventSlot, frameTable, initGame, dealHand, simToColosseum, gladList,
    startGame, nextPhase, prevPhase, getFlow, onFlow: (cb) => { flowCb = cb; },
    onNewRound: (cb) => { newRoundCb = cb; },
    onVPFlash: (cb) => { vpFlashCb = cb; },
    onMiniClick: (cb) => { miniClickCb = cb; },
    onMiniPlace: (cb) => { miniPlaceCb = cb; }, sendMiniTo,
    onMarketBuy: (cb) => { marketBuyCb = cb; }, marketBuyInfo, buyMarketCard,
    nextPlayer, prevPlayer, focusPlayer, buyDie,
    rollCup, addCupDie, exchangeForCoin,
    selectHero, drawFromCup, rollRandomDie, clearHeroDice,
    rerollHeroDie, toggleLongJumpExtra, commitLongJump, setArcheryNudge,
    nextEventParticipant, resolveEvent, dismissEventSummary,
    colWaitPay, colWaitSkip, colWaitRelease,
    colBuy, colRest, colActPass, colCounterStep, dismissColosseum, colWindowContinue,
    colSelectFighter, colFighterClick, colPushStart, colPushCancel,
    barracksPick, barracksMove, barracksDone, advanceRace,
    playFavorFree, playFavorColosseum, playFavorEvent, recoupFavors: () => recoupFavors(activeColorName, false),
    cpuStep, passPlacement: () => passPlacement(),
    setViewerSeat: (c) => { GAME.viewerSeat = c; notifyFlow(); },
    setPaused: (v) => { GAME.cpuPaused = !!v; notifyFlow(); },
    resolveColPick, resolveTrade, resolveDraft, resolveElysCard, dismissPrompt, focusMarket,
    setSlotsVisible: (v) => {
      slotsForced = v;
      for (const s of SLOTS) s.marker.visible = true;
      slotMarkersGroup.visible = v || dragging;
    },
    setColumnsVisible: (v) => { columnGroup.visible = v; },
    setActiveColor: (name) => { activeColorName = name; selectedHeroId = null; notifyFlow(); },
    getActiveColor: () => activeColorName,
    COLORS,
  };

  // ------------------------------------------------------------------ render loop
  (function animate() {
    requestAnimationFrame(animate);
    if (camTween) {
      const k = Math.min(1, (performance.now() - camTween.t0) / camTween.dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
      camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
      controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
      if (k >= 1) camTween = null;
    }
    if (anims.length) {
      const now = performance.now();
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i], k = Math.min(1, (now - a.t0) / a.dur);
        a.update(k);
        if (k >= 1) { anims.splice(i, 1); if (a.onDone) a.onDone(); }
      }
    }
    if (turnMarker) {                         // bob the ▼ arrow and keep it over its mini
      const mm = findMini(turnMarker.userData.miniId);
      if (mm) { turnMarker.position.x = mm.position.x; turnMarker.position.z = mm.position.z; }
      turnMarker.position.y = turnMarker.userData.baseY + Math.sin(performance.now() / 260) * 0.8;
    }
    controls.update();
    if (selectionBox) selectionBox.update();
    renderer.render(scene, camera);
  })();

  resize();
  buildTable();
  frameTable();
  updateDiceTotal();
</script>
