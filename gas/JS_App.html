<script type="module">
  import * as THREE from 'three';
  import { STLLoader }     from 'three/addons/loaders/STLLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // ------------------------------------------------------------------ config
  const ASSET_BASE = window.ASSET_BASE;                    // raw GitHub, always fresh
  const MINI_H     = 12;                                   // target mini height
  const COLORS = {                                         // player colors
    Blue:   0x2f6fdb, Green: 0x2ea84f, Purple: 0x7b3fb0, Yellow: 0xf5b800,
  };
  const NATION_COLORS = {                                  // minis spawn in their nation's color
    'AchaeanMini.stl':   'Blue',
    'AegyptusMini.stl':  'Green',
    'AnatoliaMini.stl':  'Yellow',
    'PhoenicanMini.stl': 'Purple',
  };
  // A faction's 5 minis each carry that faction's own market symbol (slots 0-4).
  // The symbol is a per-faction icon baked into Symbol<Color><0-4>.png (cropped from
  // the player boards); the numeric index ties mini i to the hero card in card slot i.

  // ------------------------------------------------------------------ slot defs
  // Snap slots are defined in board-local normalized coords: u = 0..1 left->right
  // across the board width, v = 0..1 top->bottom down the height. They convert to
  // world during each board's texture load (when height is known). `r` = marker
  // ring radius (world units) and snap tolerance; `accepts` = piece types that
  // may snap here. ALL coords below are best-effort estimates read off the board
  // art and are meant to be tuned visually — nudge the numbers until the rings
  // sit on the printed circles/cells.
  const CARD = ['card', 'mini'];          // hero cards & minis
  const TOK  = ['token', 'mini'];         // markers, chariots, plebes, minis
  const gridSlots = (cols, rows, accepts, r = 5) => {
    const out = []; for (const v of rows) for (const u of cols) out.push({ u, v, accepts, r }); return out;
  };
  const rowSlots = (u0, u1, n, v, accepts, r = 5) => {
    const out = []; for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1); out.push({ u: u0 + (u1 - u0) * t, v, accepts, r }); } return out;
  };
  const colSlots = (u, v0, v1, n, accepts, r = 5) => {
    const out = []; for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1); out.push({ u, v: v0 + (v1 - v0) * t, accepts, r }); } return out;
  };
  const ellipseSlots = (cu, cv, ru, rv, n, accepts, r = 6, deg0 = -90) => {
    const out = []; for (let i = 0; i < n; i++) { const a = deg0 * Math.PI / 180 + i / n * 2 * Math.PI; out.push({ u: cu + ru * Math.cos(a), v: cv + rv * Math.sin(a), accepts, r }); } return out;
  };
  // Two concentric ellipses -> a pair of slots per station (inner + outer),
  // the pair oriented along the radius (vertical at top/bottom, horizontal at
  // the sides) — matches the Colosseum's paired fighter circles.
  // `n` stations spread over (n+1) clock divisions starting after `deg0` (top),
  // so the top slot is left empty — a wide clock face running 1..11 o'clock.
  const ellipsePairSlots = (cu, cv, ruI, rvI, ruO, rvO, n, accepts, r = 5, deg0 = -90) => {
    const out = [];
    for (let i = 1; i <= n; i++) {
      const a = deg0 * Math.PI / 180 + i / (n + 1) * 2 * Math.PI;
      out.push({ u: cu + ruI * Math.cos(a), v: cv + rvI * Math.sin(a), accepts, r });
      out.push({ u: cu + ruO * Math.cos(a), v: cv + rvO * Math.sin(a), accepts, r });
    }
    return out;
  };
  // Stadium (rounded-rectangle) loop: two straights at v = cv±ry joined by
  // semicircular end caps of radius (rx in u, ry in v). Used for race lanes.
  const stadiumSlots = (cu, cv, sx, rx, ry, nStr, nEnd, accepts, r = 4) => {
    const out = [];
    for (let i = 0; i < nStr; i++) { const t = i / (nStr - 1); out.push({ u: cu - sx + 2 * sx * t, v: cv - ry, accepts, r }); }                                                         // top straight L->R
    for (let i = 1; i <= nEnd; i++) { const a = -Math.PI / 2 + (i / (nEnd + 1)) * Math.PI; out.push({ u: cu + sx + rx * Math.cos(a), v: cv + ry * Math.sin(a), accepts, r }); }             // right cap
    for (let i = 0; i < nStr; i++) { const t = i / (nStr - 1); out.push({ u: cu + sx - 2 * sx * t, v: cv + ry, accepts, r }); }                                                         // bottom straight R->L
    for (let i = 1; i <= nEnd; i++) { const a = Math.PI / 2 + (i / (nEnd + 1)) * Math.PI; out.push({ u: cu - sx + rx * Math.cos(a), v: cv + ry * Math.sin(a), accepts, r }); }              // left cap
    return out;
  };

  // Event reward strips: 6-column x 2-row hero-placement grid — minis only,
  // color-restricted (top row cols 0-2 Blue / 3-5 Purple; bottom cols 0-2
  // Green / 3-5 Yellow).
  const EVENT_COLS = [0.240, 0.336, 0.431, 0.527, 0.623, 0.719];
  // The innermost circle of each color's triad (Blue col 2 / Purple col 3, and
  // likewise Green/Yellow below) carries a coin icon: `coin: true`. Event entry
  // fee = number of still-exposed coin icons on the whole strip before placing,
  // so the first mini onto an event pays 4, then 3, 2, 1 as coins get covered.
  const EVENT_GRID = [
    ...EVENT_COLS.map((u, i) => ({ u, v: 0.176, accepts: ['mini'], r: 5, color: i < 3 ? 'Blue'  : 'Purple', coin: (i === 2 || i === 3) })),
    ...EVENT_COLS.map((u, i) => ({ u, v: 0.376, accepts: ['mini'], r: 5, color: i < 3 ? 'Green' : 'Yellow', coin: (i === 2 || i === 3) })),
  ];

  // Race track: player barracks (start circles), 0-6 lap row, relic track
  // (left, 4 rungs), chariot track (right, 5 rungs), event/era track (bottom,
  // I-VI + red-flag milestones), and the two oval racing lanes.
  const RACE_SLOTS = [
    // barracks: each player's start circles take that color's minis only
    ...rowSlots(0.048, 0.128, 2, 0.063, ['mini'], 4.5).map((s) => ({ ...s, color: 'Blue',   role: 'barracks' })),
    ...rowSlots(0.246, 0.326, 2, 0.063, ['mini'], 4.5).map((s) => ({ ...s, color: 'Green',  role: 'barracks' })),
    ...rowSlots(0.431, 0.510, 2, 0.063, ['mini'], 4.5).map((s) => ({ ...s, color: 'Purple', role: 'barracks' })),
    ...rowSlots(0.618, 0.698, 2, 0.063, ['mini'], 4.5).map((s) => ({ ...s, color: 'Yellow', role: 'barracks' })),
    // center 0-6 lap bar — exact cell centers measured off the art (uneven spacing)
    ...[0.267, 0.335, 0.406, 0.484, 0.562, 0.638, 0.719].map(
      (u, i) => ({ u, v: 0.522, accepts: ['marker'], r: 4.5, track: 'lap', ord: i, ...(i === 0 ? { role: 'lap-start' } : {}) })),
    ...colSlots(0.038, 0.42, 0.84, 4, ['marker'], 5).map((s, i) => ({ ...s, track: 'relic',   ord: 3 - i, ...(i === 3 ? { role: 'relic-start' }   : {}) })),   // relic track (4 rungs)
    ...colSlots(0.958, 0.40, 0.86, 5, ['marker'], 5).map((s, i) => ({ ...s, track: 'chariot', ord: 4 - i, ...(i === 4 ? { role: 'chariot-start' } : {}) })),   // chariot track (5 rungs)
    // era/round track (bottom): I II III [flag] IV V [flag] VI [flag] — black round marker.
    // ord 0-8 = printed cell order; the black round token hops here as the round advances.
    ...[0.298, 0.343, 0.391, 0.437, 0.487, 0.540, 0.587, 0.643, 0.687].map(
      (u, i) => ({ u, v: 0.945, accepts: ['round'], r: 4.5, track: 'era', ord: i, ...(i === 0 ? { role: 'era-start' } : {}) })),
    ...stadiumSlots(0.490, 0.518, 0.249, 0.130, 0.225, 4, 4, ['chariot'], 4).map((s) => ({ ...s, lane: 'outer' })),  // outer lane (16) — Rome's black chariot races
    ...stadiumSlots(0.490, 0.518, 0.249, 0.075, 0.125, 8, 4, ['marker'], 4).map((s) => ({ ...s, lane: 'inner' })),   // inner lane (24) — on-foot markers race here
  ];

  // Column board: 3 pillars, 6 reward rungs each. Rung v-range read off the
  // drawn column art (Column*_1.png), which the "Show columns" overlay renders
  // on top of the empty board pillars so alignment can be verified.
  // Left/center/right pillars show Column2/Column3/Column1 (see COLUMN_OVERLAYS);
  // Fortuna (Column1, right) sits lower than Bacchus/Mercury, so ranges differ.
  // 7 rungs each: 6 reward cells + the bottom start rung (same pitch).
  // Bottom (7th) rung of each pillar is that column's start — tagged so game
  // setup can seat every nation's marker there.
  // Tag each rung with its column NUMBER (= the feeding event number, §5 "event# = column#")
  // and an `ord` that rises up the pillar: bottom (i===6) = ord 0 (start), top (i===0) = ord 6.
  // colNum 1=Fortuna(right) 2=Bacchus(left) 3=Mercury(center) — the 3 printed front-face gods.
  const columnRung = (colNum) => (s, i) => ({
    ...s, colNum, ord: 6 - i,
    ...(i === 6 ? { role: 'column-start' } : {}),
  });
  const COLUMN_SLOTS = [
    ...colSlots(0.149, 0.175, 0.781, 7, ['marker'], 5).map(columnRung(2)),   // left  = Column2 (Bacchus)
    ...colSlots(0.501, 0.180, 0.782, 7, ['marker'], 5).map(columnRung(3)),   // center= Column3 (Mercury)
    ...colSlots(0.855, 0.241, 0.817, 7, ['marker'], 5).map(columnRung(1)),   // right = Column1 (Fortuna)
  ];

  // Underworld: Elysium 2x2 per-color card slots + single Tartarus slot.
  const UNDERWORLD_SLOTS = [
    { u: 0.173, v: 0.366, accepts: ['card'], r: 8 }, { u: 0.331, v: 0.366, accepts: ['card'], r: 8 },
    { u: 0.173, v: 0.702, accepts: ['card'], r: 8 }, { u: 0.331, v: 0.702, accepts: ['card'], r: 8 },
    { u: 0.770, v: 0.501, accepts: ['card'], r: 8 },
  ];

  // Colosseum: 12 fighter stations around the arena, each with a paired
  // (inner + outer) circle, + the center gladiator slot.
  const COLOSSEUM_SLOTS = [
    // 11 stations (II–XII), inner + outer circle each — measured off ColosseumBoard.png
    { u: 0.636, v: 0.234, accepts: ['mini'], r: 7 }, { u: 0.664, v: 0.099, accepts: ['mini'], r: 7 }, // II
    { u: 0.759, v: 0.331, accepts: ['mini'], r: 7 }, { u: 0.841, v: 0.254, accepts: ['mini'], r: 7 }, // III
    { u: 0.789, v: 0.499, accepts: ['mini'], r: 7 }, { u: 0.873, v: 0.499, accepts: ['mini'], r: 7 }, // IV
    { u: 0.759, v: 0.664, accepts: ['mini'], r: 7 }, { u: 0.834, v: 0.757, accepts: ['mini'], r: 7 }, // V
    { u: 0.637, v: 0.791, accepts: ['mini'], r: 7 }, { u: 0.678, v: 0.922, accepts: ['mini'], r: 7 }, // VI
    { u: 0.499, v: 0.790, accepts: ['mini'], r: 7 }, { u: 0.498, v: 0.922, accepts: ['mini'], r: 7 }, // VII
    { u: 0.362, v: 0.790, accepts: ['mini'], r: 7 }, { u: 0.321, v: 0.922, accepts: ['mini'], r: 7 }, // VIII
    { u: 0.228, v: 0.675, accepts: ['mini'], r: 7 }, { u: 0.164, v: 0.796, accepts: ['mini'], r: 7 }, // IX
    { u: 0.212, v: 0.509, accepts: ['mini'], r: 7 }, { u: 0.128, v: 0.509, accepts: ['mini'], r: 7 }, // X
    { u: 0.228, v: 0.342, accepts: ['mini'], r: 7 }, { u: 0.148, v: 0.251, accepts: ['mini'], r: 7 }, // XI
    { u: 0.357, v: 0.242, accepts: ['mini'], r: 7 }, { u: 0.336, v: 0.104, accepts: ['mini'], r: 7 }, // XII
    { u: 0.500, v: 0.478, accepts: ['mini'], r: 8 }, // center gladiator
  ];

  // ColosseumActions: a coin-driven action layer that sits just above the arena.
  // Players pay 🪙 to place a coin on an action's own-color circle, manipulating the
  // fight (see COMBAT below). Rest has no circle (its coins go to the bank). The 4
  // color circles per action are laid out Blue/Purple (top) · Green/Yellow (bottom),
  // measured off ColosseumActions.png (u = image column center, v = image row center).
  // RETIRED: the old coin/sun-driven Colosseum action layer (Double Hit / Rage / Push / Backstab /
  // Rest) is replaced by the favor cards' COLOSSEUM zones. Empty list ⇒ the buy windows auto-skip
  // (positioning → attack → counter), and the ColosseumActions board/art is dropped from LAYOUT.
  const COL_ACTIONS = [];
  const COL_ACTION_ROWS = { Blue: [0, 0.357], Purple: [1, 0.357], Green: [0, 0.510], Yellow: [1, 0.510] };
  const COLOSSEUM_ACTIONS_SLOTS = COL_ACTIONS.flatMap((a) => (a.uL == null) ? [] :
    ['Blue', 'Purple', 'Green', 'Yellow'].map((color) => {
      const [side, v] = COL_ACTION_ROWS[color];
      return { u: side ? a.uR : a.uL, v, r: 3.5, accepts: ['coin'], color, action: a.key };
    }));

  // Faction mats (shared template for all 4): income track, hero market
  // circles, and hero card slots below.
  const FACTION_SLOTS = [
    ...rowSlots(0.090, 0.481, 5, 0.200, ['income'], 4).map((s) => ({ ...s, role: 'income' })),  // income track
    ...rowSlots(0.063, 0.685, 5, 0.620, ['mini'], 5).map((s, i) => ({ ...s, boardColor: true, role: 'hero-market', sym: i })), // hero market circles (this mat's color)
    ...rowSlots(0.092, 0.732, 5, 0.900, ['card'], 7).map((s, i) => ({ ...s, role: 'card', sym: i })),      // hero card slots (0-4, each tied to the same-index mini)
    // The freed strip below the mat now holds the player's (private) HAND of cards —
    // resources live only in the left/right menus now, no currency/cup tokens on the table.
    ...rowSlots(0.060, 0.940, 6, 1.300, ['card'], 8).map((s, i) => ({ ...s, role: 'hand', ord: i })),      // hand slots (left→right)
  ];

  // Shared market (no art yet): a face-down draw pile on the left + 3 revealed
  // hero slots. Rendered as a plain plane below the table, zoomable like a board.
  const MARKET_SLOTS = [
    { u: 0.14, v: 0.5, accepts: ['card'], r: 12, role: 'market-deck' },
    { u: 0.38, v: 0.5, accepts: ['card'], r: 12, role: 'market-hero' },
    { u: 0.62, v: 0.5, accepts: ['card'], r: 12, role: 'market-hero' },
    { u: 0.86, v: 0.5, accepts: ['card'], r: 12, role: 'market-hero' },
  ];

  // Full-table layout matching the physical table. x = left(-)/right(+),
  // z = far/top(-)/near/bottom(+). `w` = world width; height follows each
  // image's true aspect at load. All non-player boards share BW so they render
  // the same size; the 4 player/faction mats share the (slightly larger) FW.
  // `slot` marks the 3 swappable active-event boards (events are dealt from a
  // shuffled deck each round). Everything here is locked scenery.
  const BW = 116;   // uniform board width (all non-player boards)
  const FW = 132;   // uniform player/faction-mat width
  const LAYOUT = [
    // top row  (ColosseumActions action-layer board retired — combat abilities are favor cards now)
    { file: 'ColosseumBoard.png', x:    0, z: -100, w: BW, slotsDef: COLOSSEUM_SLOTS },  // top-center
    // middle row (spine)
    { file: 'ColumnBoard.png',    x: -125, z:  -35, w: BW, slotsDef: COLUMN_SLOTS },     // pillars, left
    { file: 'RaceTrackBoard.png', x:    0, z:  -20, w: BW, slotsDef: RACE_SLOTS },       // race track, center
    { file: 'UnderworldBoard.png',x:  125, z:  -35, w: BW, slotsDef: UNDERWORLD_SLOTS }, // underworld, right
    // event reward strips (sit directly above each active event).
    // Ordered left->center->right to match the column board: Event 2, 3, 1.
    { file: 'Event2Board.png',    x: -125, z:   45, w: BW, slotsDef: EVENT_GRID },
    { file: 'Event3Board.png',    x:    0, z:   45, w: BW, slotsDef: EVENT_GRID },
    { file: 'Event1Board.png',    x:  125, z:   45, w: BW, slotsDef: EVENT_GRID },
    // active event slots (swappable — any mini-game can be dealt to any slot).
    // Overlap each strip just enough to cover its black band (not the circle row),
    // sitting clearly above the strip in y so the flat planes don't z-fight.
    { file: 'DiscusEvent.png',    x: -125, z:   81, w: BW, y: 0.4, slot: 0 },
    { file: 'LongJumpEvent.png',  x:    0, z:   81, w: BW, y: 0.4, slot: 1 },
    { file: 'SprintEvent.png',    x:  125, z:   81, w: BW, y: 0.4, slot: 2 },
    // player/faction mats
    { file: 'AchaeaBoard.png',    x: -255, z:    0, w: FW, color: 'Blue',   slotsDef: FACTION_SLOTS },   // Blue, far left
    { file: 'AnatoliaBoard.png',  x:  255, z:    0, w: FW, color: 'Yellow', slotsDef: FACTION_SLOTS },   // Yellow, far right
    { file: 'AegyptusBoard.png',  x: -160, z:  225, w: FW, color: 'Green',  slotsDef: FACTION_SLOTS },   // Green, bottom-left
    { file: 'PhoeniciaBoard.png', x:  160, z:  225, w: FW, color: 'Purple', slotsDef: FACTION_SLOTS },   // Purple, bottom-right
    // shared market — plain plane (no art), centered just below the middle active
    // event (LongJump bottom ≈ z109); zoomable like a board
    { market: true, x: 0, z: 145, w: 150, h: 55, slotsDef: MARKET_SLOTS },
  ];

  // Drawn column art (rung faces) overlaid on the empty board pillars, so the
  // COLUMN_SLOTS rungs can be checked against the real cells. Toggleable.
  // Ordered left->center->right to match the strips: Column 2, 3, then 1.
  const COLUMN_OVERLAYS = [
    { file: 'Column2_1.png', u: 0.149, colNum: 2 },
    { file: 'Column3_1.png', u: 0.501, colNum: 3 },
    { file: 'Column1_1.png', u: 0.855, colNum: 1 },
  ];

  const container = document.getElementById('viewer');
  const diceTotalEl = document.getElementById('diceTotal');

  // ------------------------------------------------------------------ scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161a);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 8000);

  // logarithmicDepthBuffer keeps coplanar boards from z-fighting/flickering
  // across the large depth range needed to frame the whole table.
  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));   // cap: phones are fill-rate limited
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.screenSpacePanning = true;    // pan across the whole table
  controls.maxDistance = 2000;
  controls.minDistance = 20;            // don't dive into the minis
  controls.maxPolarAngle = 1.45;        // stay above the table
  controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(40, 120, 60);
  scene.add(key);

  // Neutral table surface under the boards
  const table = new THREE.Mesh(
    new THREE.PlaneGeometry(2000, 2000),
    new THREE.MeshStandardMaterial({ color: 0x0d0e10, roughness: 1 })
  );
  table.rotation.x = -Math.PI / 2;
  table.position.y = -0.2;
  scene.add(table);

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resize()).observe(container);

  // ------------------------------------------------------------------ boards
  const texCache = new Map();
  function loadTexture(name) {
    if (texCache.has(name)) return texCache.get(name);
    const t = new THREE.TextureLoader().load(ASSET_BASE + name);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texCache.set(name, t);
    return t;
  }

  const eventSlots = [];   // slot index -> board Mesh (swappable)
  const boardMeshes = [];  // all board planes, for click-to-focus raycasting

  // ---- snap slots ----
  const SLOTS = [];        // { x, y, z, r, accepts, marker, occupant }
  const slotMarkersGroup = new THREE.Group();
  slotMarkersGroup.visible = false;   // hidden during play; shown while dragging (or forced on)
  scene.add(slotMarkersGroup);
  let slotsForced = false; // "Show slots" checkbox: keep all rings visible for tuning
  const SNAP_MIN = 6;      // minimum snap tolerance (world units)

  function makeSlotMarker(x, y, z, r, color) {
    // Tint the tuning ring by the slot's player color (cyan when unrestricted),
    // so "Show slots" doubles as a color-map check.
    const tint = (color && COLORS[color] !== undefined) ? COLORS[color] : 0x66e0ff;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(Math.max(r - 1.2, 0.5), r, 30),
      // depthTest off + high renderOrder keeps rings visible on top of board /
      // column-overlay art, so slot positions can always be checked.
      new THREE.MeshBasicMaterial({ color: tint, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false, depthTest: false })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, y, z);
    ring.renderOrder = 10;
    ring.userData.baseOpacity = 0.45;
    return ring;
  }

  // Convert a board's normalized slotsDef into world-space SLOTS (+ ring markers).
  // A slot's color is fixed (`s.color`) or inherited from the mat (`s.boardColor`).
  function buildSlotsFor(b, w, h) {
    const by = (b.y || 0) + 0.06;
    for (const s of b.slotsDef) {
      const x = b.x + (s.u - 0.5) * w;
      const z = b.z + (s.v - 0.5) * h;
      const r = s.r || 5;
      const color = s.boardColor ? (b.color || null) : (s.color || null);
      const marker = makeSlotMarker(x, by, z, r, color);
      slotMarkersGroup.add(marker);
      SLOTS.push({ x, y: by, z, r, accepts: s.accepts || CARD, color, owner: b.color || null, role: s.role || null,
                   coin: !!s.coin, event: b.slotsDef === EVENT_GRID, boardKey: b.file || (b.market ? 'market' : null),
                   track: s.track || null, ord: (s.ord ?? null), bx: b.x, lane: s.lane || null,
                   colNum: (s.colNum ?? null),
                   sym: (s.sym ?? null), action: s.action || null, marker, occupants: [] });
    }
  }

  // A locked board plane at (x,z) sized `w` wide; height follows the image.
  // `y` lifts a board above overlapping neighbors (events sit atop their strip).
  function makeBoard(b) {
    const isMarket = b.market || !b.file;
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(b.w, isMarket ? (b.h || b.w) : b.w),   // textured boards resize on load
      isMarket
        ? new THREE.MeshStandardMaterial({ color: 0x24262b, roughness: 0.9, emissive: 0x0a0b0d })
        : new THREE.MeshStandardMaterial({ roughness: 0.85 })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(b.x, b.y || 0, b.z);
    mesh.userData.isBoard = true;                      // never added to pieces[]
    mesh.userData.boardKey = b.file || (b.market ? 'market' : null);   // frame-by-key lookup
    scene.add(mesh);
    if (isMarket) {
      // subtle border so the plain plane reads as a "board"; build slots now
      // (height is known — no texture to wait on).
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color: 0x6a6f78 })
      );
      mesh.add(edges);
      if (b.slotsDef) buildSlotsFor(b, b.w, b.h || b.w);
    } else {
      // faction mats carry a currency/cup tray below the board (slots reach ~v1.68);
      // record it so click-to-focus frames the tray too, not just the board rect.
      if (b.color) { mesh.userData.padV = { top: 0, bottom: 1.68 }; mesh.userData.color = b.color; }
      applyBoardTexture(mesh, b.file, b.w, b);
    }
    return mesh;
  }

  // `boardDef` is passed only on the initial build (not on event-slot swaps), so
  // slots are created once per board when its height first becomes known.
  function applyBoardTexture(mesh, file, w, boardDef) {
    new THREE.TextureLoader().load(ASSET_BASE + file, (t) => {
      const aspect = (t.image.width || 2) / (t.image.height || 1);
      const h = w / aspect;
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      mesh.material.map = t;
      mesh.material.needsUpdate = true;
      if (boardDef && boardDef.slotsDef && !mesh.userData.slotsBuilt) {
        mesh.userData.slotsBuilt = true;
        buildSlotsFor(boardDef, w, h);
      }
    });
  }

  function buildTable() {
    for (const b of LAYOUT) {
      const mesh = makeBoard(b);
      boardMeshes.push(mesh);
      if (b.slot !== undefined) { eventSlots[b.slot] = mesh; mesh.userData.slotW = b.w; }
    }
    buildColumnOverlays();
  }

  // ---- drawn-column overlays (togglable rung-check art) ----
  const columnGroup = new THREE.Group();
  scene.add(columnGroup);
  const colOverlayMesh = {};              // colNum → overlay mesh, so faces can be swapped per game
  function loadColFace(mesh, file, bh) {
    new THREE.TextureLoader().load(ASSET_BASE + file, (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const aspect = (t.image.width || 1) / (t.image.height || 1);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(bh * aspect, bh);  // match board height
      mesh.material.map = t;
      mesh.material.needsUpdate = true;
    });
  }
  function buildColumnOverlays() {
    const cb = LAYOUT.find((b) => b.file === 'ColumnBoard.png');
    if (!cb) return;
    const bw = cb.w, bh = cb.w / (1187 / 668);   // board world width/height
    for (const c of COLUMN_OVERLAYS) {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide, depthWrite: false })
      );
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(cb.x + (c.u - 0.5) * bw, 0.08, cb.z);
      mesh.userData.bh = bh;
      columnGroup.add(mesh);
      colOverlayMesh[c.colNum] = mesh;
      loadColFace(mesh, c.file, bh);
    }
  }
  // Show the chosen face (side 0/1 → Column{colNum}_{1|2}.png) on each pillar for this game.
  function refreshColumnFaces() {
    for (const cn of [1, 2, 3]) {
      const mesh = colOverlayMesh[cn]; if (!mesh) continue;
      const side = (GAME.godSide && GAME.godSide[cn]) || 0;
      loadColFace(mesh, 'Column' + cn + '_' + (side + 1) + '.png', mesh.userData.bh);
    }
  }

  // Swap the mini-game shown in an active-event slot (0..2). No boardDef -> the
  // swappable event boards never carry slots.
  function setEventSlot(i, file) {
    eventFiles[i] = file;                        // keep required-dice lookup in sync
    const mesh = eventSlots[i];
    if (mesh) applyBoardTexture(mesh, file, mesh.userData.slotW);
  }

  // Whether `piece` may occupy slot `s`: type must be accepted, and a color-coded
  // slot only takes a mini of its own color (unrestricted slots have no color).
  function slotAccepts(s, piece) {
    const type = piece.userData.type;
    if (!s.accepts.includes(type)) return false;
    if (type === 'mini' && s.color && s.color !== piece.userData.color) return false;
    // Cheer/Jeer are hand modifiers — they never occupy a mat's hero-card slots
    // (the mini-tied slots). They stay in hand until discarded or played.
    return true;
  }

  // Track slots (marker/round position pieces) stack: up to one per nation
  // sharing a rung, fanned out so they're all visible. Everything else is
  // single-occupancy (one mini per circle, one card per slot, ...).
  const STACK_MAX = 4;                 // markers/round: one per nation
  const DEEP_TYPES = ['coin', 'lightning', 'sun', 'die'];   // currency/cup: pile up freely
  const DEEP_MAX = 24;                 // practical "limitless" cap (~20)
  const STACK_TYPES = ['marker', 'round', ...DEEP_TYPES];
  function isStack(s) { return !!s.stack || s.accepts.some((t) => STACK_TYPES.includes(t)); }
  function stackCap(s) { return (s.stack || s.accepts.some((t) => DEEP_TYPES.includes(t))) ? DEEP_MAX : STACK_MAX; }

  // Lay a slot's occupants out: centered when alone, else fanned on a small
  // ring with a slight per-index height step so overlaps stay readable.
  function layoutStack(s) {
    const n = s.occupants.length;
    const per = 8;                    // occupants per concentric ring
    s.occupants.forEach((p, i) => {
      const baseY = (p.userData.baseY !== undefined) ? p.userData.baseY : p.position.y;
      if (isStack(s) && n > 1) {
        const ring = Math.floor(i / per);
        const inRing = i % per;
        const ringN = Math.min(n - ring * per, per);
        const a = -Math.PI / 2 + (inRing / ringN) * Math.PI * 2;
        const rr = s.r * 0.5 * (1 + ring * 0.7);   // outer rings for deeper piles
        p.position.x = s.x + Math.cos(a) * rr;
        p.position.z = s.z + Math.sin(a) * rr;
        p.position.y = baseY + i * 0.04;
      } else {
        p.position.x = s.x;
        p.position.z = s.z;
        p.position.y = baseY;
      }
    });
  }

  // Nearest compatible slot within its snap tolerance (or null): single slots
  // must be free (or hold this piece); stack slots must have room.
  function nearestSlot(piece, x, z) {
    let best = null, bestD = Infinity;
    for (const s of SLOTS) {
      if (!slotAccepts(s, piece)) continue;
      if (!s.occupants.includes(piece)) {
        if (isStack(s)) { if (s.occupants.length >= stackCap(s)) continue; }
        else if (s.occupants.length) continue;
      }
      const d = Math.hypot(s.x - x, s.z - z);
      if (d <= Math.max(s.r + 2, SNAP_MIN) && d < bestD) { bestD = d; best = s; }
    }
    return best;
  }

  let hlSlot = null;
  function highlightSlot(s) {
    if (hlSlot === s) return;
    if (hlSlot) { hlSlot.marker.material.opacity = hlSlot.marker.userData.baseOpacity; hlSlot.marker.scale.setScalar(1); }
    hlSlot = s;
    if (s) { s.marker.material.opacity = 1; s.marker.scale.setScalar(1.18); }
  }

  function freeSlot(piece) {
    const s = piece && piece.userData.slot;
    if (!s) return;
    const i = s.occupants.indexOf(piece);
    if (i >= 0) s.occupants.splice(i, 1);
    piece.userData.slot = null;
    layoutStack(s);   // re-center/re-fan whatever remains
  }

  // Programmatic placement (game setup): drop a piece straight onto a slot,
  // bypassing the drag/snap path.
  function placeOnSlot(piece, slot) {
    if (!piece || !slot) return piece;
    freeSlot(piece);
    slot.occupants.push(piece);
    piece.userData.slot = slot;
    layoutStack(slot);
    return piece;
  }
  // Find built SLOTS by tagged role (optionally scoped to one mat's owner color).
  function slotsByRole(role, owner = null) {
    return SLOTS.filter((s) => s.role === role && (owner === null || s.owner === owner));
  }

  // While dragging: show only the rings this piece can snap to (color-aware).
  function showDragSlots(piece) {
    if (slotsForced) return;                       // manual override already shows everything
    for (const s of SLOTS) s.marker.visible = slotAccepts(s, piece);
    slotMarkersGroup.visible = true;
  }
  function hideDragSlots() {
    if (slotsForced) return;
    slotMarkersGroup.visible = false;
    for (const s of SLOTS) s.marker.visible = true;   // restore for a later manual "Show slots"
  }

  // ------------------------------------------------------------------ pieces
  const pieces = [];
  const loader = new STLLoader();
  let activeColorName = 'Blue';

  let PIECE_ID = 0;
  function registerPiece(group, type) {
    group.userData.isPiece = true;
    group.userData.type = type;
    group.userData.id = ++PIECE_ID;             // stable id (used to target per-hero dice)
    pieces.push(group);
    scene.add(group);
    return group;
  }

  // Scatter new pieces around the current view center so they land on-screen.
  function spawnXZ() {
    return [
      controls.target.x + (Math.random() - 0.5) * 30,
      controls.target.z + (Math.random() - 0.5) * 20,
    ];
  }

  // Baked "poker-chip" texture bearing this faction's own market symbol for slot
  // `idx` (0-4) — cropped from the player boards into Symbol<Color><0-4>.png. Laid
  // flat atop the mini's base so you can read which hero card it ties to.
  function symbolFile(colorName, idx) { return 'Symbol' + colorName + idx + '.png'; }
  function makeSymbolTexture(colorName, idx) {
    const tex = new THREE.TextureLoader().load(ASSET_BASE + symbolFile(colorName, idx));
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  function addMini(file, colorName = NATION_COLORS[file] || activeColorName, targetSlot = null, sym = null) {
    loader.load(ASSET_BASE + file, (geometry) => {
      geometry.rotateX(-Math.PI / 2);        // stand upright (CAD is usually Z-up)
      geometry.center();
      geometry.computeVertexNormals();
      geometry.computeBoundingBox();
      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const scale = MINI_H / (size.y || 1);
      const mat = new THREE.MeshStandardMaterial({
        color: COLORS[colorName], metalness: 0.15, roughness: 0.6,
      });
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.scale.setScalar(scale);
      mesh.position.y = (-geometry.boundingBox.min.y) * scale;   // base on board
      const g = new THREE.Group();
      g.add(mesh);
      g.userData.color = colorName;
      g.userData.eventDice = [];               // dice played onto this hero during an event
      // identity chip: this faction's market symbol, sized to the mini's base and
      // raised to sit just atop the base so the figure's legs don't bury it.
      if (sym !== null && sym !== undefined) {
        g.userData.sym = sym;
        // Find the base (not the whole figure): scan the bottom slab for its footprint
        // CENTER (x/z) and TOP (y) so the chip sits centered on the base and just above
        // it — robust to off-center poses and taller bases (e.g. Phoenicia).
        const pos = geometry.attributes.position;
        const minY = geometry.boundingBox.min.y, maxY = geometry.boundingBox.max.y;
        const span = (maxY - minY) || 1, bins = 40, band = minY + span * 0.04;
        let bx = 0, bz = 0, bn = 0;
        for (let i = 0; i < pos.count; i++) {
          if (pos.getY(i) <= band) { bx += pos.getX(i); bz += pos.getZ(i); bn++; }
        }
        if (bn) { bx /= bn; bz /= bn; }
        const binMaxR2 = new Float32Array(bins);
        for (let i = 0; i < pos.count; i++) {
          let bi = Math.floor((pos.getY(i) - minY) / span * bins);
          bi = bi < 0 ? 0 : (bi >= bins ? bins - 1 : bi);
          const x = pos.getX(i) - bx, z = pos.getZ(i) - bz, r2 = x * x + z * z;
          if (r2 > binMaxR2[bi]) binMaxR2[bi] = r2;
        }
        // base plateau radius = widest of the bottom bins; base top = first bin above it
        // where the footprint narrows toward the legs (legs run ~70% of the base radius,
        // so use a 0.78 threshold — 0.55 either never triggered or latched onto a thin
        // spot high up). Clamp the lift so it always lands on the base, never mid-figure.
        const baseR = Math.sqrt(Math.max(binMaxR2[0], binMaxR2[1], binMaxR2[2])) || 1;
        let topFrac = 0.12;                                    // fallback ~base height
        for (let b = 1; b < bins; b++) {
          if (Math.sqrt(binMaxR2[b]) < baseR * 0.78) { topFrac = b / bins; break; }
        }
        topFrac = Math.max(0.08, Math.min(0.20, topFrac));
        const chipR = MINI_H * 0.24;                           // uniform size across factions
        const disc = new THREE.Mesh(
          new THREE.CircleGeometry(chipR, 48),
          new THREE.MeshBasicMaterial({ map: makeSymbolTexture(colorName, sym), transparent: true, depthWrite: false })
        );
        disc.rotation.x = -Math.PI / 2;
        disc.position.set(bx * scale, span * topFrac * scale + MINI_H * 0.01, bz * scale);
        disc.renderOrder = 2;
        g.add(disc);
      }
      registerPiece(g, 'mini');
      // STL load is async, so a setup snap has to happen here in the callback.
      if (targetSlot) { placeOnSlot(g, targetSlot); }
      else { const [x, z] = spawnXZ(); g.position.set(x, 0, z); }
    });
  }

  // Flat PNG token lying on the board. `worldSize` is the LONGEST edge; the
  // short edge follows the image's true aspect (portrait cards stay rectangular).
  function addToken(file, worldSize = 7, type = 'token') {
    const g = new THREE.Group();
    const [x, z] = spawnXZ();
    g.position.set(x, 0.06, z);
    // Always size from the actually-loaded image so aspect is never guessed.
    new THREE.TextureLoader().load(ASSET_BASE + file, (tex) => {
      // A card whose face was already applied (setCardFace) must not be clobbered
      // by this back-texture load resolving late — the two loads race on the plane.
      if (g.userData.faceApplied) { tex.dispose(); return; }
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const iw = tex.image.width, ih = tex.image.height;
      const aspect = (iw / ih) || 1;
      const w = aspect >= 1 ? worldSize : worldSize * aspect;   // wide image
      const h = aspect >= 1 ? worldSize / aspect : worldSize;   // tall image
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false })
      );
      plane.rotation.x = -Math.PI / 2;
      g.add(plane);
    });
    return registerPiece(g, type);
  }

  // Flat circle "marker" token in a player color — the position piece for the
  // column/lap/relic/chariot/inner-lane tracks. Thin dark rim for contrast.
  // transparent + high renderOrder so it draws over the (transparent) column
  // overlay art; baseY sits it above that art.
  const MARKER_Y = 0.12;
  function addMarker(colorName = activeColorName) {
    const g = new THREE.Group();
    const disc = new THREE.Mesh(
      new THREE.CircleGeometry(2, 32),
      new THREE.MeshBasicMaterial({ color: COLORS[colorName], side: THREE.DoubleSide, transparent: true })
    );
    disc.rotation.x = -Math.PI / 2; disc.renderOrder = 6;
    const rim = new THREE.Mesh(
      new THREE.RingGeometry(2, 2.4, 32),
      new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide, transparent: true })
    );
    rim.rotation.x = -Math.PI / 2; rim.position.y = 0.01; rim.renderOrder = 7;
    g.add(disc); g.add(rim);
    const [x, z] = spawnXZ();
    g.position.set(x, MARKER_Y, z);
    g.userData.color = colorName;
    g.userData.baseY = MARKER_Y;
    return registerPiece(g, 'marker');
  }

  // Small black round token for the bottom era/round track.
  function addRound() {
    const g = new THREE.Group();
    const disc = new THREE.Mesh(
      new THREE.CircleGeometry(1.75, 32),
      new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide, transparent: true })
    );
    disc.rotation.x = -Math.PI / 2; disc.renderOrder = 6;
    g.add(disc);
    const [x, z] = spawnXZ();
    g.position.set(x, MARKER_Y, z);
    g.userData.baseY = MARKER_Y;
    return registerPiece(g, 'round');
  }

  // ------------------------------------------------------------------ dice
  function makeDieMesh(value) {
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 7),
      new THREE.MeshBasicMaterial({ map: loadTexture('Dice_' + value + '.png'), transparent: true, side: THREE.DoubleSide, depthWrite: false })
    );
    plane.rotation.x = -Math.PI / 2;
    return plane;
  }

  function updateDiceTotal() {
    const dice = pieces.filter((p) => p.userData.type === 'die');
    const total = dice.reduce((s, d) => s + (d.userData.value || 0), 0);
    if (diceTotalEl) diceTotalEl.textContent = dice.length
      ? ('Dice: ' + dice.map((d) => d.userData.value).join(' + ') + ' = ' + total)
      : 'Dice: —';
  }

  // Create a single registered die group (random face unless given). Returned so
  // callers can position or snap it (rollDice scatters; setup drops it in a cup).
  function makeDie(value = 1 + Math.floor(Math.random() * 6)) {
    const g = new THREE.Group();
    g.add(makeDieMesh(value));
    g.position.y = 0.06;
    g.userData.value = value;
    g.userData.baseY = 0.06;
    registerPiece(g, 'die');
    return g;
  }

  function rollDice(n) {
    // remove existing dice
    for (const d of pieces.filter((p) => p.userData.type === 'die')) removePiece(d);
    const cx = controls.target.x, cz = controls.target.z;
    for (let i = 0; i < n; i++) {
      makeDie().position.set(cx + (i - (n - 1) / 2) * 9, 0.06, cz + 24);
    }
    updateDiceTotal();
  }

  function reroll() {
    for (const d of pieces.filter((p) => p.userData.type === 'die')) {
      const v = 1 + Math.floor(Math.random() * 6);
      d.userData.value = v;
      d.children[0].material.map = loadTexture('Dice_' + v + '.png');
      d.children[0].material.needsUpdate = true;
    }
    updateDiceTotal();
  }

  // ------------------------------------------------------------------ select + drag
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const dragOffset = new THREE.Vector3();
  const hitPoint = new THREE.Vector3();
  let selected = null, dragging = false;
  let selectionBox = null;
  let downX = 0, downY = 0, downPiece = false;   // click-vs-drag detection
  let dragMoved = false;                          // did the pointer actually move a piece this drag?
  let downPieceObj = null;                        // the piece pressed (for click-to-inspect)
  let miniClickCb = null;                         // UI hook: mini clicked -> show its tied hero card
  let miniPlaceCb = null;                          // UI hook: own mini clicked in Blind Placement -> placement menu
  let marketBuyCb = null;                          // UI hook: market card clicked in Market -> purchase overlay

  function setNDC(e) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  }

  function pieceFromHit(obj) {
    while (obj && !obj.userData.isPiece) obj = obj.parent;
    return obj;
  }

  function select(group) {
    selected = group;
    if (selectionBox) { scene.remove(selectionBox); selectionBox.geometry.dispose(); selectionBox = null; }
    if (group) {
      selectionBox = new THREE.BoxHelper(group, 0xffe14a);
      scene.add(selectionBox);
    }
  }

  function removePiece(group) {
    freeSlot(group);
    const i = pieces.indexOf(group);
    if (i >= 0) pieces.splice(i, 1);
    group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    scene.remove(group);
    if (selected === group) select(null);
  }

  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary) { if (dragging) { dragging = false; controls.enabled = true; } return; }
    setNDC(e);
    downX = e.clientX; downY = e.clientY;
    dragMoved = false;                        // reset per press; pointermove flips it true
    camTween = null;                          // any interaction cancels a camera flight
    raycaster.setFromCamera(ndc, camera);
    // Only pieces are selectable; boards are not in `pieces`, so they're inert.
    const hit = raycaster.intersectObjects(pieces, true)[0];
    downPiece = !!hit;
    downPieceObj = hit ? pieceFromHit(hit.object) : null;
    if (hit) {
      const p = pieceFromHit(hit.object);
      // Waiting/Colosseum minis are locked: no select/drag (but a click still inspects the card).
      if (p.userData.locked) return;
      // During Upkeep the hand is frozen — cards can't be moved (roll the cup to end your turn).
      if (curPhase() === 'Upkeep' && p.userData.type === 'card') return;
      // Market cards can't be dragged off the display — buy them (a click opens the purchase menu).
      if (p.userData.type === 'card' && p.userData.slot && p.userData.slot.role === 'market-hero') return;
      // Once a game is running, a mini is committed: only Blind Placement drags it (to place it).
      // In every other phase (Upkeep/events/Market) a click just inspects its tied card — never
      // pick it up for a drag, which would re-snap its slot and shuffle the event turn order.
      if (p.userData.type === 'mini' && GAME.started && curPhase() !== 'Blind Placement') return;
      if (e.pointerType === 'touch' && selected !== p) { select(p); return; }   // touch: tap selects, press again to drag
      select(p);
      dragging = true;
      controls.enabled = false;
      try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
      raycaster.ray.intersectPlane(groundPlane, hitPoint);
      dragOffset.set(p.position.x - hitPoint.x, 0, p.position.z - hitPoint.z);
      showDragSlots(p);   // reveal the slots this piece can snap to
    } else {
      select(null);
    }
  });

  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!dragging || !selected || !e.isPrimary) return;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > (e.pointerType === 'touch' ? 10 : 6)) dragMoved = true;
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
      selected.position.x = hitPoint.x + dragOffset.x;
      selected.position.z = hitPoint.z + dragOffset.z;
      // live preview: highlight the slot this piece would snap to on release
      highlightSlot(nearestSlot(selected, selected.position.x, selected.position.z));
    }
  });

  // On release: snap to the nearest compatible slot if close enough, otherwise
  // leave the piece exactly where it was dropped (free-placement fallback).
  const endDrag = () => {
    let committedThisDrag = false;               // Blind Placement: a fresh mini commit ends the turn
    // A pure click (no movement) must never re-snap or touch fees — the click handler below
    // opens the placement/inspect menu instead. Only a real drag runs the slot/fee logic, or
    // clicking a committed mini would refund+recharge its event fee and leak coins.
    if (dragging && selected && dragMoved) {
      const prevSlot = selected.userData.slot;   // where it sat before this drag (for barracks re-drop guard)
      // leaving an event slot it paid into? refund the fee it was charged.
      if (selected.userData.eventFee) {
        adjustRes(selected.userData.color, 'coin', selected.userData.eventFee);
        selected.userData.eventFee = 0;
      }
      freeSlot(selected);
      let s = nearestSlot(selected, selected.position.x, selected.position.z);
      if (s) {
        // events fill inner->out: redirect a mini to the innermost free circle of
        // its color's triad (the coin slot first), so the fee count stays correct.
        if (s.event && selected.userData.type === 'mini') {
          const opts = SLOTS.filter((o) => o.event && o.boardKey === s.boardKey &&
                                           o.color === selected.userData.color && !o.occupants.length);
          if (opts.length) { opts.sort((a, b) => Math.abs(a.x - a.bx) - Math.abs(b.x - b.bx)); s = opts[0]; }
        }
        // event entry fee = exposed coin icons on this strip before we cover one.
        if (s.event && selected.userData.type === 'mini') {
          const fee = SLOTS.filter((o) => o.boardKey === s.boardKey && o.coin && !o.occupants.length).length;
          if (fee) { adjustRes(selected.userData.color, 'coin', -fee); selected.userData.eventFee = fee; }
        }
        s.occupants.push(selected);
        selected.userData.slot = s;
        layoutStack(s);   // positions the piece (fanned if sharing the slot)
        // sending a fresh mini to the barracks earns its reward (VP + resource + track moves).
        if (s.role === 'barracks' && selected.userData.type === 'mini' && prevSlot !== s) {
          openBarracks(selected.userData.color);
        }
        // dropping a Cheer/Jeer onto the discard slot pays +2 coins and reveals it.
        if (s.role === 'discard' && selected.userData.type === 'card') {
          selected.userData.zone = 'discard';
          setCardFace(selected, selected.userData.face);   // face-up on the pile
        }
      }
      // Blind Placement: committing one mini to an event/barracks ends your turn.
      // Barracks defers the pass until its reward modal is dismissed (barracksDone).
      if (curPhase() === 'Blind Placement' && selected.userData.type === 'mini'
          && selected.userData.color === curPlayer()) {
        const ns = selected.userData.slot;
        const wasCommitted = prevSlot && (prevSlot.event || prevSlot.role === 'barracks');
        const nowCommitted = ns && (ns.event || ns.role === 'barracks');
        if (nowCommitted && !wasCommitted) {
          if (ns.role === 'barracks') GAME.pendingTurnEnd = true;
          else committedThisDrag = true;
        }
      }
    }
    highlightSlot(null);
    if (dragging) hideDragSlots();   // re-hide rings once the piece is dropped
    dragging = false;
    controls.enabled = true;
    if (committedThisDrag) nextPlayer();   // advance after cleanup (re-focuses the next board)
  };
  renderer.domElement.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('pointerleave', endDrag);
  renderer.domElement.addEventListener('pointercancel', endDrag);

  // The hero card a mini is tied to = the card in the same-color, same-symbol slot.
  function miniCardInfo(mini) {
    if (mini.isRome) return { color: 'Rome', sym: null, symImg: null, face: null, hasCard: false };
    const color = mini.userData.color || null, sym = mini.userData.sym ?? null;
    const slot = (sym !== null) && SLOTS.find((s) => s.role === 'card' && s.owner === color && s.sym === sym);
    const card = slot && slot.occupants[slot.occupants.length - 1];
    return {
      color, sym,
      symImg: (color !== null && sym !== null) ? symbolFile(color, sym) : null,
      face: card ? (card.userData.face || null) : null,
      hasCard: !!card,
    };
  }

  // Click (no drag): on a mini -> show its tied hero card; on a board -> zoom in;
  // on empty table -> frame the whole table.
  renderer.domElement.addEventListener('pointerup', (e) => {
    const click = Math.hypot(e.clientX - downX, e.clientY - downY) <= (e.pointerType === 'touch' ? 10 : 6);
    // Combat: two-step push — a click while choosing a destination places the pushed mini.
    if (click && GAME.colosseum && GAME.colPush && GAME.colPush.step === 'dest') { colPushDestClick(e); return; }
    if (downPiece) {                                                // piece drag handled in endDrag
      if (click && downPieceObj && downPieceObj.userData.type === 'mini') {
        // During combat, a mini click drives the fight (inspect stats / push-pick), not the card overlay.
        if (GAME.colosseum && colFighterClick(downPieceObj.userData.id)) return;
        const place = placementFor(downPieceObj);                   // your own mini in Blind Placement?
        if (place && miniPlaceCb) miniPlaceCb(place);               // -> choose an event/barracks
        else if (miniClickCb) miniClickCb(miniCardInfo(downPieceObj));   // -> inspect its tied card
      } else if (click && downPieceObj && downPieceObj.userData.type === 'card'
                 && curPhase() === 'Market' && downPieceObj.userData.slot
                 && downPieceObj.userData.slot.role === 'market-hero') {
        const info = marketBuyInfo(downPieceObj.userData.id);       // click a market card -> buy overlay
        if (info && marketBuyCb) marketBuyCb(info);
      }
      return;
    }
    if (!click) return;                                            // was an orbit/pan
    setNDC(e);
    raycaster.setFromCamera(ndc, camera);
    const bhit = raycaster.intersectObjects(boardMeshes, false)[0];
    if (bhit) focusBoard(bhit.object);
    else if (focusedBoard) frameTable(true);
  });

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
      e.preventDefault();
      removePiece(selected);
    }
  });

  // ------------------------------------------------------------------ camera helpers
  let focusedBoard = null;
  let camTween = null;    // { fromP, toP, fromT, toT, t0, dur } — active camera flight

  // Ease the camera to a new position/target over `dur` ms (see render loop).
  function flyTo(toTarget, toPos, dur = 600) {
    camTween = {
      fromP: camera.position.clone(), toP: toPos.clone(),
      fromT: controls.target.clone(), toT: toTarget.clone(),
      t0: performance.now(), dur,
    };
  }

  // Frame an arbitrary world-space rectangle from the angled overhead view.
  // `margin` <1 zooms tighter; always flies (used for sub-table framing too).
  // Distance that fits a bounding circle of `radius` in BOTH directions: the narrower half-FOV governs,
  // so a tall portrait view won't crop the sides. Wide (landscape) screens keep the original distance.
  function fitDist(radius) {
    const tv = Math.tan(camera.fov * Math.PI / 360), th = tv * camera.aspect;
    return radius / Math.sin(Math.atan(Math.min(tv, th)));
  }
  function frameBox(minX, maxX, minZ, maxZ, margin = 0.62) {
    const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    const radius = 0.5 * Math.hypot(maxX - minX, maxZ - minZ);
    const fov = camera.fov * Math.PI / 180;
    const dist = fitDist(radius) * margin;
    camera.near = 0.5;
    camera.far = dist * 6;
    camera.updateProjectionMatrix();
    focusedBoard = null;
    flyTo(new THREE.Vector3(cx, 0, cz), new THREE.Vector3(cx, dist * 0.92, cz + dist * 0.55));
  }

  // Frame the whole table from an angled overhead view. Clears any board focus.
  function frameTable(animate = false) {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const b of LAYOUT) {
      minX = Math.min(minX, b.x - b.w / 2); maxX = Math.max(maxX, b.x + b.w / 2);
      minZ = Math.min(minZ, b.z - b.w / 2); maxZ = Math.max(maxZ, b.z + b.w / 2);
    }
    const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    const radius = 0.5 * Math.hypot(maxX - minX, maxZ - minZ);
    const fov = camera.fov * Math.PI / 180;
    const dist = fitDist(radius) * 0.62;    // margin
    // Tight near/far around the table keeps depth precision high (less flicker).
    camera.near = 0.5;
    camera.far = dist * 4;
    camera.updateProjectionMatrix();
    focusedBoard = null;
    const target = new THREE.Vector3(cx, 0, cz);
    const pos = new THREE.Vector3(cx, dist * 0.92, cz + dist * 0.55);
    if (animate) { flyTo(target, pos); }
    else { camTween = null; controls.target.copy(target); camera.position.copy(pos); controls.update(); }
  }

  // Zoom in to frame a single board (same angled overhead framing, closer in).
  function focusBoard(mesh) {
    const p = mesh.geometry.parameters || {};
    const w = p.width || mesh.userData.slotW || 100;
    const h = p.height || w;
    // Boards with content beyond the plane (faction-mat trays) declare a padV
    // v-range; frame that whole span, not just the board rectangle.
    const pv = mesh.userData.padV || { top: 0, bottom: 1 };
    const topExt = (0.5 - pv.top) * h;      // world extent above board center
    const botExt = (pv.bottom - 0.5) * h;   // world extent below board center
    const effH = topExt + botExt;
    const cx = mesh.position.x;
    const cz = mesh.position.z + (botExt - topExt) / 2;   // recenter on the content
    // Fit both dimensions instead of a loose bounding circle. The table is viewed
    // at a tilt, so the board's depth (effH) is foreshortened on screen (~0.85) and
    // needs less vertical room; width maps straight to the (wider) horizontal FOV.
    const fov = camera.fov * Math.PI / 180;
    const aspect = camera.aspect || 1.6;
    const hfov = 2 * Math.atan(Math.tan(fov / 2) * aspect);
    const distV = (effH * 0.85 / 2) / Math.tan(fov / 2);
    const distH = (w / 2) / Math.tan(hfov / 2);
    // Faction mats (they declare padV) want to fill the frame — the abilities are
    // small; go tight, even clipping a hair. Event/market boards read fine with air
    // around them, so back off for those.
    const isMat = !!mesh.userData.padV;
    const margin = isMat ? 0.92 : 1.32;
    const dist = Math.max(distV, distH) * margin;
    camera.near = 0.5;
    camera.far = dist * 8;
    camera.updateProjectionMatrix();
    focusedBoard = mesh;
    flyTo(new THREE.Vector3(cx, 0, cz),
          new THREE.Vector3(cx, dist * 0.92, cz + dist * 0.55));
  }

  function resetView() { frameTable(); }

  function clearPieces() {
    for (const p of [...pieces]) removePiece(p);
    updateDiceTotal();
  }

  // ------------------------------------------------------------------ game setup
  const NATIONS = [
    { color: 'Blue',   stl: 'AchaeanMini.stl' },
    { color: 'Green',  stl: 'AegyptusMini.stl' },
    { color: 'Yellow', stl: 'AnatoliaMini.stl' },
    { color: 'Purple', stl: 'PhoenicanMini.stl' },
  ];
  const ALL_COLORS = NATIONS.map((n) => n.color);

  // §11 factions — one per color. The old per-faction Relic / Favor / Blessing abilities
  // have been RETIRED and replaced by the Favor Card system (see FAVOR_CARDS below): each
  // player holds a fixed favor hand (their 2 faction cards + the 3 active column-god cards
  // + the 3 commons), played one zone at a time. Only the faction name/nation remains here.
  const FACTIONS = {
    Blue:   { name: 'Archaea' },
    Green:  { name: 'Aegyptus' },
    Yellow: { name: 'Anatolia' },
    Purple: { name: 'Phoenicia' },
  };
  const factionOf = (color) => FACTIONS[color] || null;

  // Seat order = CLOCKWISE from the first player around the physical table: Blue (far
  // left) → Yellow (far right) → Purple (bottom-right) → Green (bottom-left). Drives
  // both the round-1 seat coin bonus and round-1 turn order.
  const SEAT_ORDER = ['Blue', 'Yellow', 'Purple', 'Green'];

  // Tunable rules numbers (rules still WIP — keep as constants, not hard-coded logic).
  // Income Track (§11): 5 rungs (levels 0-4). Each per-round collection pays the resources at the
  // player's CURRENT rung, AND the rung sets the base number of free cup dice that round. Winning an
  // event (1st) / some column rungs move the marker up one rung.
  // Per-rung values confirmed by the owner (not strictly rising — rung 3 trades coin for a ☀).
  const INCOME_LEVELS = [
    { coin: 2, zap: 1, sun: 0, dice: 2 },   // rung 1 (start)
    { coin: 3, zap: 1, sun: 0, dice: 2 },   // rung 2
    { coin: 2, zap: 1, sun: 1, dice: 2 },   // rung 3
    { coin: 3, zap: 1, sun: 1, dice: 3 },   // rung 4
    { coin: 4, zap: 2, sun: 2, dice: 3 },   // rung 5 (max)
  ];
  const INCOME_MAX = INCOME_LEVELS.length - 1;        // top rung index
  const START_INCOME  = INCOME_LEVELS[0];             // round-1 base income (matches setup tokens)
  const DIE_ZAP_COST  = 1;                             // ⚡ per added cup die (Lightning buys dice)
  const PER_PLAYER_PHASES = ['Upkeep', 'Blind Placement', 'Market'];
  // Round-1 clockwise order starts at a RANDOM seat (§13); GAME.round1Seat holds that rotation.
  const seatBonusOf = (c) => { const o = GAME.round1Seat || SEAT_ORDER; return [3, 2, 1, 0][o.indexOf(c)] || 0; };

  // -------------------------------------------------------------- game flow (state)
  // Guided-sandbox backbone: the app tracks round / phase / turn order and drives them
  // via buttons; players still move pieces freely. Numbers here are tunable (rules WIP).
  // Per-round order. Market is the END-of-round shop (after all events execute), NOT
  // part of setup. Colosseum is a between-rounds interlude (after rounds 3/5/6 → between
  // 3&4, 5&6, and after 6); being last in PHASES it lands after Market on those rounds.
  const PHASES = ['Upkeep', 'Blind Placement', 'Resolution & Podiums', 'Market', 'Colosseum'];
  const TOTAL_ROUNDS = 6;                       // Act I = R1–3, Act II = R4–5, Act III = R6
  const COLOSSEUM_ROUNDS = [2, 4, 6];           // Colosseum interlude only after these rounds (first arena one round sooner)
  const GAME = { started: false, over: false, round: 1, phaseIndex: 0, order: SEAT_ORDER.slice(), turnIndex: 0, res: {}, barracks: null, race: {}, cup: {}, cupRolled: {},
                 eventIndex: 0, evtTurnIndex: 0, eventRound: 0, resolved: [], lastResolution: null, colWait: null, modWait: null,
                 summaryOpen: false, eventKeys: [], pendingTurnEnd: false, marketPool: [],
                 marketVisited: {}, exchanged: {},
                 gladDeck: [], gladDiscard: [], romeLostRound: false, colosseum: null, colAct: null,
                 colPush: null, colSelId: null, colAnimating: false,
                 columns: {}, favorUnlocked: {}, relicUnlocked: {}, income: {}, log: [], prompts: [],
                 favorSpent: {}, favorAfterlife: {}, eventFavorFlags: {}, seatKind: {}, placeDone: {},
                 pendingVP: {}, elysium: [], tartarus: [], result: null };
  let flowCb = null;                            // JS_UI render listener (set via PT.onFlow)
  let newRoundCb = null;                         // JS_UI hook: deal a fresh random event trio each round
  let vpFlashCb = null;                          // JS_UI VP-banner flash (set via PT.onVPFlash)
  // Flash the VP banner on screen with the earned value (called wherever VPs are rewarded).
  function flashVP(color, amount) { if (amount > 0 && vpFlashCb) vpFlashCb({ color, amount }); }
  // Rolling game log (column rungs, Favor unlocks, owner-resolved prompts). Last ~8 shown in panel.
  function logNote(msg) { GAME.log.push(msg); if (GAME.log.length > 60) GAME.log.shift(); }

  // ---- per-player resources (coin / ⚡ / ☀), tracked as numbers ----
  function initRes() { for (const c of ALL_COLORS) { GAME.res[c] = { coin: seatBonusOf(c), zap: 0, sun: 0 }; GAME.income[c] = 0; } }
  function adjustRes(color, kind, n) {
    const r = GAME.res[color];
    if (!r || !(kind in r)) return;
    r[kind] += n;
    notifyFlow();
  }
  // Collect one round's income at the player's CURRENT income-track rung.
  const grantIncome = (color) => {
    const r = GAME.res[color]; if (!r) return;
    const lvl = Math.min(GAME.income[color] || 0, INCOME_MAX);
    const inc = INCOME_LEVELS[lvl];
    r.coin += inc.coin; r.zap += inc.zap; r.sun += inc.sun;
  };
  // Base free cup dice for a color this round = the dice count at its current income rung.
  const cupBaseFor = (color) =>
    INCOME_LEVELS[Math.min(GAME.income[color] || 0, INCOME_MAX)].dice;
  // A faction's income token: the 'income' piece resting on one of that mat's income slots.
  const incomeTokenOf = (color) =>
    pieces.find((p) => p.userData.type === 'income' && p.userData.slot && p.userData.slot.owner === color);
  // Move a nation UP one rung on its income track (marker + level). Future grantIncome() calls
  // then pay the higher rung. Capped at the top rung.
  function upgradeIncome(color) {
    if (GAME.income[color] == null) GAME.income[color] = 0;
    if (GAME.income[color] >= INCOME_MAX) {
      logNote('△ ' + color + ' income track already at the top rung.');
      notifyFlow();
      return;
    }
    const lvl = ++GAME.income[color];
    const tok = incomeTokenOf(color);
    const slot = slotsByRole('income', color)[lvl];   // income slots are built left→right = rung 0..4
    if (tok && slot) placeOnSlot(tok, slot);
    const inc = INCOME_LEVELS[lvl];
    logNote('△ ' + color + ' income upgraded to rung ' + (lvl + 1) + ' ('
      + inc.coin + '🪙 / ' + inc.zap + '⚡' + (inc.sun ? ' / ' + inc.sun + '☀' : '')
      + ' + ' + inc.dice + ' dice per round).');
    notifyFlow();
  }
  const curPhase = () => phasesFor(GAME.round)[GAME.phaseIndex];
  const isPerPlayer = () => PER_PLAYER_PHASES.includes(curPhase());
  const isEventPhase = () => ['Resolution & Podiums', 'Colosseum'].includes(curPhase());
  const curPlayer = () => (isPerPlayer() ? GAME.order[GAME.turnIndex] : null);
  const isCpu = (c) => GAME.seatKind[c] === 'cpu';   // CPU-controlled seat (default when unset = human)

  // ---- race position (the real "score"): on-foot marker around the inner lane ----
  // A VP earned = one step forward along the lane; crossing the start/finish line
  // banks a lap on the 0-6 bar. Standings = laps, then distance into the lap.
  const LAP_MAX = 6;                  // the center 0-6 lap bar holds 7 rungs (0..6)
  let RACE_LANE = [];                 // inner-lane slots ordered in racing direction (start/finish first)
  let OUTER_LANE = [];                // outer-lane slots (Rome's black chariot) in racing direction
  function initRace() {
    // lane 'inner' = on foot (24 spaces/lap); 'outer' = a player chariot (16
    // spaces/lap, faster) once the chariot track is completed (§7).
    for (const c of ALL_COLORS) GAME.race[c] = { pos: 0, laps: 0, lane: 'inner' };
    GAME.chariotUnlocked = {};
    GAME.relicUnlocked = {};
    for (const c of ALL_COLORS) { GAME.chariotUnlocked[c] = false; GAME.relicUnlocked[c] = false; }
    GAME.rome = { chariotPos: 0, laps: 0 };   // §14.E black-chariot pressure clock (penance deferred)
  }
  // Order the inner-lane slots into a racing sequence: clockwise from the bottom-
  // center start/finish line, moving right first (per the board's arrow). Rotate so
  // index 0 is the first slot just past the line, so pos wrapping = a completed lap.
  function buildRaceLane() {
    const lane = SLOTS.filter((s) => s.lane === 'inner');
    if (!lane.length) { RACE_LANE = []; return; }
    const cx = lane.reduce((a, s) => a + s.x, 0) / lane.length;
    const cz = lane.reduce((a, s) => a + s.z, 0) / lane.length;
    lane.sort((a, b) => Math.atan2(b.z - cz, b.x - cx) - Math.atan2(a.z - cz, a.x - cx));
    let k = 0, bestDx = Infinity;     // bottom slot (z>cz) just right of center (min +dx)
    lane.forEach((s, i) => { if (s.z > cz && s.x > cx && (s.x - cx) < bestDx) { bestDx = s.x - cx; k = i; } });
    RACE_LANE = lane.slice(k).concat(lane.slice(0, k));
  }
  const markerOnTrack = (color, track) =>
    pieces.find((p) => p.userData.type === 'marker' && p.userData.color === color &&
                       p.userData.slot && p.userData.slot.track === track);
  // A nation's racer marker, whether on foot (inner lane) or in a chariot (outer
  // lane after the chariot track is completed). Rome's black chariot has no color.
  const raceMarkerOf = (color) =>
    pieces.find((p) => p.userData.type === 'marker' && p.userData.color === color &&
                       p.userData.slot && (p.userData.slot.lane === 'inner' || p.userData.slot.lane === 'outer'));
  function placeOnTrackOrd(color, track, ord) {
    const m = markerOnTrack(color, track);
    const slot = SLOTS.find((o) => o.track === track && o.ord === ord);
    if (m && slot) placeOnSlot(m, slot);
  }
  // Bottom era/round track has 9 printed cells (I II III [flag] IV V [flag] VI [flag]);
  // map each play round (1-6) to its cell, skipping the era-boundary flag cells, and hop
  // the black round token there. Call this whenever GAME.round changes.
  const ERA_ROUND_ORD = { 1: 0, 2: 1, 3: 2, 4: 4, 5: 5, 6: 7 };
  function moveRoundMarker() {
    const tok = pieces.find((p) => p.userData.type === 'round');
    if (!tok) return;
    const ord = ERA_ROUND_ORD[GAME.round];
    if (ord == null) return;
    const slot = SLOTS.find((s) => s.track === 'era' && s.ord === ord);
    if (slot) placeOnSlot(tok, slot);
  }
  // Move a nation's on-foot marker n steps along the lane (n may be negative for a
  // manual correction); bank/unbank laps on the 0-6 bar as it crosses the line.
  // One space holds one runner: after a forward move, if the resting space already
  // has another player's marker, hop forward to the next empty space (banking laps).
  function advanceRace(color, n = 1, opts) {
    const st = GAME.race[color]; if (!st) return;
    // Race on the lane this nation currently occupies: the inner foot lane, or the
    // shorter outer chariot lane once its chariot track is completed (§7).
    const LANE = (st.lane === 'outer' && OUTER_LANE.length) ? OUTER_LANE : RACE_LANE;
    if (!LANE.length) return;
    const m = raceMarkerOf(color); if (!m) return;
    const L = LANE.length;
    const lapsBefore = st.laps;
    // pos 0 = behind the start/finish line (pre-race); pos 1..L = spaces 1..L.
    // A lap banks only when crossing the line (pos wraps L -> 1), so the very
    // first VP just steps onto space 1 with NO lap credit. pos 0 renders on the
    // last space (RACE_LANE[L-1]), immediately behind the line.
    const slotForPos = (p) => LANE[(p <= 0 ? L : p) - 1];
    const stepFwd = () => { st.pos++; if (st.pos > L) { st.pos = 1; if (st.laps < LAP_MAX) st.laps++; } };
    const occupiedByOther = (p) => slotForPos(p).occupants.some(
      (q) => q !== m && q.userData.type === 'marker' && q.userData.color !== color);
    for (let s = n; s > 0; s--) stepFwd();
    for (let s = n; s < 0; s++) { st.pos--; if (st.pos < 1) { st.pos = L; if (st.laps > 0) st.laps--; } }
    // hop off a shared space onto the next free one (forward moves only)
    if (n > 0) { let guard = 0; while (occupiedByOther(st.pos) && guard++ < L) stepFwd(); }
    placeOnTrackOrd(color, 'lap', st.laps);
    placeOnSlot(m, slotForPos(st.pos));
    if (n > 0 && !(opts && opts.silent)) flashVP(color, n);   // celebrate a VP gain
    // Each completed lap advances one active column (§7). Skip when called from a column rung
    // (noColumn) or the end-game silent tally (silent), and only during live play.
    const lapsGained = st.laps - lapsBefore;
    if (lapsGained > 0 && GAME.started && !GAME.over && !(opts && (opts.noColumn || opts.silent))) {
      grantLapColumns(color, lapsGained);
    }
    notifyFlow();
  }

  // ---- Rome's black chariot on the OUTER lane (§14.E pressure clock) ----
  // Same clockwise-from-bottom-right ordering as the inner lane, but over the
  // 'outer' slots. Advances +2 each event Rome wins; laps bank on wrap. Penance
  // (laps -> -3 VP) is deferred.
  function buildOuterLane() {
    const lane = SLOTS.filter((s) => s.lane === 'outer');
    if (!lane.length) { OUTER_LANE = []; return; }
    const cx = lane.reduce((a, s) => a + s.x, 0) / lane.length;
    const cz = lane.reduce((a, s) => a + s.z, 0) / lane.length;
    lane.sort((a, b) => Math.atan2(b.z - cz, b.x - cx) - Math.atan2(a.z - cz, a.x - cx));
    let k = 0, bestDx = Infinity;
    lane.forEach((s, i) => { if (s.z > cz && s.x > cx && (s.x - cx) < bestDx) { bestDx = s.x - cx; k = i; } });
    OUTER_LANE = lane.slice(k).concat(lane.slice(0, k));
  }
  // Black disc with a red rim — the Roman chariot marker.

    const slotForPos = (p) => OUTER_LANE[(p <= 0 ? L : p) - 1];

  const TRACK_RUNG_COST = 1;
  function moveUpTrack(color, track) {
    const marker = markerOnTrack(color, track);
    if (!marker) return false;
    const next = SLOTS.find((o) => o.track === track && o.ord === marker.userData.slot.ord + 1);
    if (!next) return false;          // already at the top rung
    placeOnSlot(marker, next);

    if (track === 'relic') checkRelicUnlock(color);

  // PINNED for now — this just flips the "unlocked & available to equip" flag.
  const relicTopOrd = () => {
    const ords = SLOTS.filter((o) => o.track === 'relic').map((o) => o.ord);
    return ords.length ? Math.max(...ords) : 0;

  function checkRelicUnlock(color) {
    if (!GAME.relicUnlocked || GAME.relicUnlocked[color]) return;

    if (disc) { placeOnSlot(c, disc); setCardFace(c, c.userData.face); }
    const m = /^(\d)_(\d)_Hero/.exec(c.userData.face || '');
    logNote('🎟 ' + p.color + ' drafted a free ' + (m ? m[1] + '/' + m[2] : '') + ' hero.');
    restockMarket();                              // keep the display at 3 for the next pick
    if (--p.remaining <= 0) GAME.prompts.shift(); // done → next queued prompt
    notifyFlow();
  }
  // Bacchus rung 2: the HERO cards in a color's hand, offered up to send straight to Elysium.
  function elysHandCards(color) {
    return slotsByRole('hand', color).flatMap((s) =>
      s.occupants.filter((o) => o.userData.type === 'card' && o.userData.cardKind === 'hero').map((c) => {
        const m = /^(\d)_(\d)_Hero/.exec(c.userData.face || '');
        return { cardId: c.userData.id, face: c.userData.face, str: m ? +m[1] : 1, speed: m ? +m[2] : 1 };
      }));
  }
  // Send the chosen hand hero straight to Elysium (banks its end-game VP + fires its blessing),
  // exactly like a Colosseum survivor's card. One pick resolves the prompt.
  function resolveElysCard(cardId) {
    const p = GAME.prompts[0]; if (!p || p.type !== 'elyscard') return;
    const c = findCard(cardId); if (!c) return;
    const s = c.userData.slot; if (!s || s.role !== 'hand' || s.owner !== p.color) return;
    const m = /^(\d)_(\d)_Hero/.exec(c.userData.face || '');
    const str = m ? +m[1] : 1, speed = m ? +m[2] : 1;
    const elySlots = SLOTS.filter((sl) => sl.boardKey === 'UnderworldBoard.png' && (sl.accepts || []).includes('card')).slice(0, 4);
    const slot = elySlots[SEAT_ORDER.indexOf(p.color) % 4] || elySlots[0];
    freeSlot(c);
    if (slot) { placeOnSlot(c, slot); setCardFace(c, c.userData.face); }
    c.userData.zone = 'elysium'; c.userData.owner = p.color;
    GAME.elysium.push({ color: p.color, sym: c.userData.sym ?? null, id: c.userData.id, str, speed });
    logNote('🍇 ' + p.color + ' (Bacchus rung 2): sent a ' + str + '/' + speed + ' hand hero → Elysium.');
    fireBlessing(p.color);              // §11 Blessing on Elysium entry (auto part applied; choices PINNED)
    GAME.prompts.shift();
    notifyFlow();
  }
  function resolveColPick(colNum) {
    const p = GAME.prompts[0]; if (!p || p.type !== 'colpick') return;
    if (![1, 2, 3].includes(colNum)) return;
    if ((GAME.columns[p.color]?.[colNum] || 0) >= 6) return;    // can't pick a topped column
    GAME.prompts.shift();
    moveUpColumn(p.color, colNum, 1);                            // may enqueue a Bacchus trade prompt
    notifyFlow();
  }
  const canAffordGive = (color, give, times) =>
    Object.keys(give).every((k) => (GAME.res[color]?.[k] || 0) >= give[k] * times);
  function resolveTrade(times) {
    const p = GAME.prompts[0]; if (!p || p.type !== 'trade') return;
    const n = Math.max(0, Math.min(times | 0, p.max));
    if (n > 0 && canAffordGive(p.color, p.give, n)) {
      for (const k of Object.keys(p.give)) adjustRes(p.color, k, -p.give[k] * n);
      for (let i = 0; i < n; i++) {
        if (p.get.sun)    adjustRes(p.color, 'sun', p.get.sun);
        if (p.get.zap)    adjustRes(p.color, 'zap', p.get.zap);
        if (p.get.coin)   adjustRes(p.color, 'coin', p.get.coin);
        if (p.get.race)   advanceRace(p.color, p.get.race, { noColumn: true });
        if (p.get.income) upgradeIncome(p.color);   // Bacchus rung 4 = income-track upgrade
      }
      logNote('🍇 ' + p.color + ' (' + godName(p.colNum) + ' rung ' + p.ord + '): ' + p.label + ' ×' + n + '.');
    }
    GAME.prompts.shift();
    notifyFlow();
  }
  function dismissPrompt() {   // decline a trade / defer (colpick can't be declined — re-queue)
    const p = GAME.prompts[0]; if (!p) return;
    GAME.prompts.shift();
    if (p.type === 'colpick') GAME.prompts.push(p);   // must be resolved — send to back, don't drop
    notifyFlow();
  }
  // Enriched head-of-queue prompt for the UI (null when empty).
  // A column pick is only legal while some column is below its top rung. Drop stale ones (two laps
  // in one advance can queue two picks; the second may have no legal column left).
  const colPickLegal = (color) => [1, 2, 3].some((cn) => ((GAME.columns[color] || {})[cn] || 0) < 6);
  function pruneIllegalPrompts() {
    while (GAME.prompts.length && GAME.prompts[0].type === 'colpick' && !colPickLegal(GAME.prompts[0].color)) GAME.prompts.shift();
  }
  function promptFlow() {
    pruneIllegalPrompts();
    const p = GAME.prompts[0]; if (!p) return null;
    if (p.type === 'colpick') {
      const st = GAME.columns[p.color] || {};
      const cols = [1, 2, 3].map((cn) => {
        const rung = st[cn] || 0;
        return { colNum: cn, name: godName(cn), rung, topped: rung >= 6, nextLabel: describeRung(cn, rung + 1) };
      });
      return { type: 'colpick', color: p.color, pending: GAME.prompts.length, cols };
    }
    if (p.type === 'draft') {
      return { type: 'draft', color: p.color, remaining: p.remaining, pending: GAME.prompts.length,
               god: p.colNum ? godName(p.colNum) : (p.src || 'Sponsor'), ord: p.ord, heroes: draftHeroesAvail() };
    }
    if (p.type === 'elyscard') {
      return { type: 'elyscard', color: p.color, pending: GAME.prompts.length,
               god: godName(p.colNum), ord: p.ord, cards: elysHandCards(p.color) };
    }
    // trade: how many times (0..max) can this player currently afford?
    let affordN = 0;
    while (affordN < p.max && canAffordGive(p.color, p.give, affordN + 1)) affordN++;
    return { type: 'trade', color: p.color, colNum: p.colNum, ord: p.ord, god: godName(p.colNum),
             label: p.label, give: p.give, get: p.get, max: p.max, affordN, pending: GAME.prompts.length };
  }
  // End-game top-rung conversions (§8), keyed to the ACTIVE god's `top` on each column (not the
  // physical position, since gods are randomized): strElysium = Str-in-Elysium ×2 ·
  // spdElysium = Spd-in-Elysium ×2 · countElysium = +3 VP per Elysium hero · pin = 0 (Favor only).
  function columnTopVP(color) {
    const st = GAME.columns[color] || {};
    const ely = GAME.elysium.filter((e) => e.color === color);
    const sumStr = ely.reduce((a, e) => a + (e.str || 0), 0);
    const sumSpd = ely.reduce((a, e) => a + (e.speed || 0), 0);
    let vp = 0;
    for (const cn of [1, 2, 3]) {
      if ((st[cn] || 0) < 6) continue;                 // only topped columns convert
      const top = colGod(cn).top;
      if (top === 'strElysium')             vp += 2 * sumStr;
      else if (top === 'spdElysium')        vp += 2 * sumSpd;
      else if (top === 'tartarusCount2')    vp += 2 * tartarusCountOf(color);
      else if (top === 'relicComplete15')   vp += (GAME.relicUnlocked   && GAME.relicUnlocked[color])   ? 15 : 0;
      else if (top === 'chariotComplete15') vp += (GAME.chariotUnlocked && GAME.chariotUnlocked[color]) ? 15 : 0;
    }
    return vp;
  }

  // ---- dice cup (private, panel-only) + per-hero event dice (public) ----
  // GAME.cup[color]       = array of this round's cup dice; each entry is a value (1-6)
  //                         once rolled, or `null` while still blank/unrolled. Shown only
  //                         in the owner's left panel — never on the 3D table (private).
  // GAME.cupRolled[color] = has this color rolled its cup THIS round yet? (roll once, and
  //                         you MUST roll before the round can advance — hard gate.)
  // Played dice live on the MINI they were played for (`mini.userData.eventDice = [values]`)
  // and render publicly beside that mini on the table. Each competing mini needs a
  // fixed-per-event number of dice before the event can continue.
  // Base cup dice now come from the income track (INCOME_LEVELS[rung].dice via cupBaseFor);
  // CUP_START is just the rung-1 reference value.
  const CUP_START       = INCOME_LEVELS[0].dice;
  const COIN_PER_EXCHANGE = 2; // ⚡ or ☀ → this many 🪙 (Upkeep exchange)
  const DICE_PER_EVENT_DEFAULT = 2;   // required dice per competing hero (tunable, rules WIP)
  const COLOSSEUM_DICE = 2;           // required dice per Colosseum fighter (tunable)
