<script type="module">
  // Toolbar / panel wiring. Runs after JS_App (both are modules → DOM order),
  // so window.PT is defined by the time this executes.
  const PT = window.PT;
  const CARD_SIZE = 22;   // shared size for all card pieces (hero/plebe/cheer/jeer/back)

  // ---- active-event slots (3 boards dealt from the shuffled event deck each round) ----
  // Any of the 6 mini-games can land in any of the 3 slots; slots are swappable.
  const EVENTS = [
    ['ArcheryEvent.png',   'Archery'],
    ['DiscusEvent.png',    'Discus'],
    ['HighJumpEvent.png',  'High Jump'],
    ['LongJumpEvent.png',  'Long Jump'],
    ['SprintEvent.png',    'Sprint'],
    ['WrestlingEvent.png', 'Wrestling'],
  ];
  const SLOT_DEFAULTS = ['DiscusEvent.png', 'LongJumpEvent.png', 'SprintEvent.png'];
  for (let i = 0; i < 3; i++) {
    const sel = document.getElementById('eventSlot' + i);
    for (const [file, label] of EVENTS) {
      const o = document.createElement('option');
      o.value = file; o.textContent = label;
      if (file === SLOT_DEFAULTS[i]) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => PT.setEventSlot(i, sel.value));
  }

  // ---- mini models (STL list; extend as more arrive) ----
  const MODELS = [
    ['AchaeanMini.stl',   'Achaean'],
    ['AegyptusMini.stl',  'Aegyptus'],
    ['AnatoliaMini.stl',  'Anatolia'],
    ['PhoenicanMini.stl', 'Phoenician'],
  ];
  const modelSel = document.getElementById('modelSelect');
  for (const [file, label] of MODELS) {
    const o = document.createElement('option');
    o.value = file; o.textContent = label; modelSel.appendChild(o);
  }
  document.getElementById('addMini').addEventListener('click', () => PT.addMini(modelSel.value));

  // ---- hero cards ----
  const HEROES = [
    ['1_2_Hero.png', 'Str1 Spd2'],
    ['2_1_Hero.png', 'Str2 Spd1'],
    ['2_2_Hero.png', 'Str2 Spd2'],
    ['2_3_Hero.png', 'Str2 Spd3'],
    ['3_2_Hero.png', 'Str3 Spd2'],
    ['3_3_Hero.png', 'Str3 Spd3'],
  ];
  const heroSel = document.getElementById('heroSelect');
  for (const [file, label] of HEROES) {
    const o = document.createElement('option');
    o.value = file; o.textContent = label; heroSel.appendChild(o);
  }
  document.getElementById('addHero').addEventListener('click', () => PT.addToken(heroSel.value, CARD_SIZE, 'card'));
  document.getElementById('addCardBack').addEventListener('click', () => PT.addToken('BackofCards.png', CARD_SIZE, 'card'));
  document.getElementById('dealHand').addEventListener('click', () => PT.dealHand(PT.getActiveColor()));

  // ---- active color swatches ----
  document.querySelectorAll('#toolbar .sw').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('#toolbar .sw').forEach((s) => s.classList.remove('active'));
    b.classList.add('active');
    PT.setActiveColor(b.dataset.color);
  }));

  // ---- color-dependent tokens ----
  document.getElementById('addChariot').addEventListener('click', () => PT.addToken('ChariotIcon' + PT.getActiveColor() + '.png', 8, 'chariot'));
  document.getElementById('addPlebe').addEventListener('click',   () => PT.addToken(PT.getActiveColor() + 'Pliebe.png', CARD_SIZE, 'card'));
  document.getElementById('addMarker').addEventListener('click',  () => PT.addMarker(PT.getActiveColor()));
  document.getElementById('addRound').addEventListener('click',   () => PT.addRound());

  // ---- fixed tokens ----
  const addModifier = (file) => { PT.addToken(file, CARD_SIZE, 'card').userData.cardKind = 'modifier'; };
  document.getElementById('addCheer').addEventListener('click', () => addModifier('Cheer.png'));
  document.getElementById('addJeer').addEventListener('click',  () => addModifier('Jeer.png'));

  // ---- currency ----
  document.getElementById('addCoin').addEventListener('click',      () => PT.addToken('CoinToken.png', 6, 'coin'));
  document.getElementById('addLightning').addEventListener('click', () => PT.addToken('LightningToken.png', 6, 'lightning'));
  document.getElementById('addSun').addEventListener('click',       () => PT.addToken('SunToken.png', 6, 'sun'));
  document.getElementById('addIncome').addEventListener('click',    () => PT.addToken('IncomeToken.png', 6, 'income'));

  // ---- dice ----
  document.getElementById('rollDice').addEventListener('click', () => PT.rollDice(parseInt(document.getElementById('diceCount').value, 10) || 1));
  document.getElementById('reroll').addEventListener('click', () => PT.reroll());

  // ---- view / game ----
  // Deal 3 mini-games into the active-event slots (and sync the dropdowns). For now a fixed
  // trio so all six events are easy to exercise across two New games; swap for a shuffle of
  // EVENTS.map(e => e[0]).slice(0, 3) once random deals are wanted.
  const NEW_GAME_EVENTS = ['ArcheryEvent.png', 'HighJumpEvent.png', 'WrestlingEvent.png'];
  function dealEvents(files) {
    files.forEach((file, i) => {
      const sel = document.getElementById('eventSlot' + i);
      if (sel) sel.value = file;
      PT.setEventSlot(i, file);
    });
  }
  document.getElementById('initGame').addEventListener('click', () => {
    PT.initGame(HEROES.map((h) => h[0]));
    dealEvents(NEW_GAME_EVENTS);
  });
  document.getElementById('resetView').addEventListener('click', () => PT.frameTable());
  document.getElementById('clearBtn').addEventListener('click', () => PT.clearPieces());
  const showSlots = document.getElementById('showSlots');
  showSlots.addEventListener('change', () => PT.setSlotsVisible(showSlots.checked));
  const showColumns = document.getElementById('showColumns');
  showColumns.addEventListener('change', () => PT.setColumnsVisible(showColumns.checked));

  // ---- game flow HUD (round / phase / turn order) ----
  const FLOW_COLORS = { Blue: '#2f6fdb', Green: '#2ea84f', Purple: '#7b3fb0', Yellow: '#f5b800' };
  const flowLine = document.getElementById('flowLine');
  const flowOrder = document.getElementById('flowOrder');
  const flowRes = document.getElementById('flowRes');
  const turnbar = document.getElementById('turnbar');
  const turnLine = document.getElementById('turnLine');
  const nextPlayerBtn = document.getElementById('nextPlayer');
  const resolveEventBtn = document.getElementById('resolveEvent');
  const podiumBox = document.getElementById('podiumBox');
  const eventRankBox = document.getElementById('eventRankBox');
  const prevBtn = document.getElementById('prevPhase');
  const nextBtn = document.getElementById('nextPhase');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const barracks = document.getElementById('barracks');
  const barracksLine = document.getElementById('barracksLine');
  const barRelic = document.getElementById('barRelic');
  const barChariot = document.getElementById('barChariot');
  const colWait = document.getElementById('colWait');
  const cwLine = document.getElementById('cwLine');
  const cwBtns = document.getElementById('cwBtns');
  const modWait = document.getElementById('modWait');
  const mwLine = document.getElementById('mwLine');
  const mwTargets = document.getElementById('mwTargets');
  const mwPass = document.getElementById('mwPass');
  const standings = document.getElementById('standings');

  // ---- left player panel (current player's cup / economy / competition) ----
  const EVENT_PHASES = ['Resolution & Podiums', 'Colosseum'];   // dice-drawing phases
  const DICE_GLYPH = (v) => String.fromCodePoint(0x2680 + (Math.max(1, Math.min(6, v)) - 1));  // ⚀..⚅
  let curFlow = null;                       // last flow snapshot (owner read at click time)
  const ownerOf = (f) => (f && f.current) || PT.getActiveColor();

  const ppDot = document.getElementById('ppDot');
  const ppName = document.getElementById('ppName');
  const ppRes = document.getElementById('ppRes');
  const cupGrid = document.getElementById('cupGrid');
  const ppCupHint = document.getElementById('ppCupHint');
  const econ = document.getElementById('econ');
  const compete = document.getElementById('compete');
  const heroList = document.getElementById('heroList');
  const competeHint = document.getElementById('competeHint');
  const exZapBtn = document.getElementById('exZap');
  const exSunBtn = document.getElementById('exSun');
  const addDieBtn = document.getElementById('addDie');
  const rollCupBtn = document.getElementById('rollCup');

  function renderPlayerPanel(f) {
    const owner = ownerOf(f);
    const col = FLOW_COLORS[owner] || '#ccc';
    ppDot.style.background = col;
    ppName.textContent = owner || '—';
    ppName.style.color = col;
    const r = (f.res && f.res[owner]) || { coin: 0, zap: 0, sun: 0 };
    ppRes.textContent = '🪙 ' + r.coin + '    ⚡ ' + r.zap + '    ☀ ' + r.sun;

    const isUpkeep = f.started && !f.over && f.phase === 'Upkeep';
    const isEvent = f.started && !f.over && EVENT_PHASES.includes(f.phase);
    const rolled = !!(f.cupRolled && f.cupRolled[owner]);

    // cup readout — dice are blank (null) until the once-per-round roll; clickable to
    // draw into the selected hero only during event phases.
    const cup = (f.cup && f.cup[owner]) || [];
    const heroSelected = f.selectedHeroId !== null && f.selectedHeroId !== undefined;
    cupGrid.innerHTML = cup.length
      ? cup.map((v, i) => {
          const blank = v === null || v === undefined;
          const clickable = isEvent && !blank && heroSelected;
          return '<button class="die' + (blank ? ' blank' : '') + (clickable ? ' draw' : '') + '" data-idx="' + i + '"'
            + (clickable ? '' : ' disabled') + ' style="color:' + col + '">' + (blank ? '' : DICE_GLYPH(v)) + '</button>';
        }).join('')
      : '<span class="ppmini">empty</span>';
    ppCupHint.textContent = isUpkeep
      ? (rolled ? cup.length + ' dice rolled — locked for this round.' : 'Buy dice & exchange first — rolling the cup ENDS your turn.')
      : (cup.length + ' die' + (cup.length === 1 ? '' : 's') + ' in cup'
         + (isEvent ? (heroSelected ? ' — click one to draw into the selected hero' : ' — select a hero first') : ''));

    // economy (Upkeep only): roll the cup ONCE, buy dice only before that roll.
    econ.hidden = !isUpkeep;
    if (isUpkeep) {
      exZapBtn.disabled = r.zap < 1;
      exSunBtn.disabled = r.sun < 1;
      addDieBtn.disabled = r.zap < 1 || rolled;
      rollCupBtn.disabled = rolled;
    }

    // per-hero event dice (event phases only)
    compete.hidden = !isEvent;
    if (isEvent) {
      const heroes = f.heroes || [];
      const meta = f.eventMeta;
      heroList.innerHTML = heroes.length
        ? heroes.map((h) => {
            const sel = h.id === f.selectedHeroId;
            const have = h.dice.length, need = h.required;
            const label = h.face ? labelForFace(h.face) : 'Inactive';
            const chip = h.symImg ? '<img class="hsym" src="' + window.ASSET_BASE + h.symImg + '" alt="">' : '';
            // eliminated multi-round heroes are OUT — no controls, show how far they got.
            if (h.eliminated) {
              return '<div class="hero out" data-id="' + h.id + '">'
                + '<div class="hero-top">' + chip + '<span class="hero-lbl">' + label + '</span>'
                + '<span class="hero-cnt out">OUT · ' + h.roundsSurvived + 'R</span></div></div>';
            }
            const canReroll = h.rerollsLeft > 0;
            // one die cell (±1 bump, glyph, free-reroll) at absolute index `i` in the hero's dice
            const dieCell = (v, i) =>
              '<span class="hdie">'
              + '<button class="diebump" data-id="' + h.id + '" data-idx="' + i + '" data-dir="-1" title="−1 (−1☀)"' + (r.sun < 1 || v <= 1 ? ' disabled' : '') + '>–</button>'
              + '<span class="die" style="color:' + col + '">' + DICE_GLYPH(v) + '</span>'
              + '<button class="diebump" data-id="' + h.id + '" data-idx="' + i + '" data-dir="1" title="+1 (−1☀)"' + (r.sun < 1 || v >= 6 ? ' disabled' : '') + '>+</button>'
              + (canReroll ? '<button class="diereroll" data-id="' + h.id + '" data-idx="' + i + '" title="Free reroll (' + h.rerollsLeft + ' left)">↻</button>' : '')
              + '</span>';
            const blanks = (n) => Array.from({ length: Math.max(0, n) }, () => '<span class="die blank"></span>').join('');
            const full = have >= need;                          // all dice in → final score tag
            const atCap = have >= (h.cap != null ? h.cap : need); // can't add more dice right now
            const scoreTag = full
              ? (h.scoreText === 'FOUL'
                  ? '<span class="hfoul">FOUL</span>'
                  : '<span class="hscore">' + (meta && meta.multiRound ? 'Roll ' : 'Score ') + h.scoreText + '</span>')
              : (canReroll ? '<span class="hreroll">↻ ' + h.rerollsLeft + ' reroll' + (h.rerollsLeft > 1 ? 's' : '') + '</span>' : '');
            const acts = '<div class="hero-acts">'
              + '<button class="hero-roll" data-id="' + h.id + '"' + (atCap ? ' disabled' : '') + '>Roll die</button>'
              + '<button class="hero-clear" data-id="' + h.id + '"' + (have ? '' : ' disabled') + '>Clear</button>';
            const topRow = '<div class="hero-top">' + chip + '<span class="hero-lbl">' + label + '</span>'
              + '<span class="hero-cnt' + (full ? ' ok' : '') + '">' + have + '/' + need + '</span></div>';

            // ---- Long Jump: approach (2 +opt) vs jump (2) split; player commits the jump ----
            if (h.lj) {
              const { appN, stage, fouled, canJump } = h.lj;
              const appHave = Math.min(appN, have);
              const appDice = h.dice.slice(0, appN).map((v, i) => dieCell(v, i)).join('') + blanks(appN - appHave);
              const ljToggle = '<button class="hero-lj' + (h.ljExtra ? ' on' : '') + '" data-id="' + h.id + '"'
                + (have ? ' disabled' : '') + ' title="Optional +1 approach die (before dicing)">'
                + (h.ljExtra ? '✓ +1 approach' : '+1 approach') + '</button>';
              const jmpArr = h.dice.slice(appN);
              const jumpBody = fouled
                ? '<span class="hfoul">FOUL — over-run</span>'
                : (stage === 'jump')
                  ? '<div class="hero-dice">' + jmpArr.map((v, i) => dieCell(v, appN + i)).join('') + blanks(2 - jmpArr.length) + '</div>'
                  : (canJump
                      ? '<button class="hero-jump" data-id="' + h.id + '" title="Commit the approach and take your jump">Jump ▶</button>'
                      : '<span class="lj-hint">roll the approach first</span>');
              return '<div class="hero' + (sel ? ' sel' : '') + '" data-id="' + h.id + '">' + topRow
                + '<div class="lj-grp"><span class="lj-lbl">Approach · +Speed, ≤13</span>'
                +   '<div class="hero-dice">' + appDice + '</div>' + ljToggle + '</div>'
                + '<div class="lj-grp' + (stage === 'jump' || fouled ? '' : ' locked') + '">'
                +   '<span class="lj-lbl">Jump · +Str</span>' + jumpBody + '</div>'
                + (!fouled && scoreTag ? '<div class="hero-score">' + scoreTag + '</div>' : '')
                + acts + '</div></div>';
            }

            const dice = h.dice.map((v, i) => dieCell(v, i)).join('') + blanks(need - have);
            return '<div class="hero' + (sel ? ' sel' : '') + '" data-id="' + h.id + '">' + topRow
              + '<div class="hero-dice">' + dice + '</div>'
              + (scoreTag ? '<div class="hero-score">' + scoreTag + '</div>' : '')
              + acts + '</div></div>';
          }).join('')
        : '<span class="ppmini">' + owner + ' has no heroes at this event.</span>';
      const w = f.eventWalk;
      const obj = (meta && meta.name) ? (meta.objective ? meta.name + ' — ' + meta.objective : meta.name) : '';
      const roundStr = (meta && meta.multiRound)
        ? ' · Round ' + (meta.round + 1) + '/' + meta.roundCount + (meta.roundLabel ? ' (' + meta.roundLabel + ')' : '') : '';
      const action = !w || !w.active
        ? 'All events resolved — advance when ready.'
        : w.everyoneFull
          ? (meta && meta.multiRound ? 'resolve the round ▶' : 'resolve the event ▶')
          : f.eventGateOk
            ? owner + ' done — next player ▶'
            : 'dice every one of ' + owner + '’s heroes here';
      competeHint.textContent = (obj ? obj + roundStr + ' · ' : '') + action;
    }
  }

  // sync the toolbar active-color swatch to a color
  function reflectSwatch(color) {
    document.querySelectorAll('#toolbar .sw').forEach((s) =>
      s.classList.toggle('active', s.dataset.color === color));
  }

  // Format an event-result value for the standings/podium: FOUL and "nR" (rounds survived) pass
  // through as-is; a plain score gets a Σ prefix.
  function fmtTotal(t) {
    const s = String(t);
    if (s === 'FOUL' || /R$/.test(s)) return s;
    return 'Σ' + s;
  }

  function renderFlow(f) {
    curFlow = f;
    if (!f.started) {
      flowLine.textContent = 'Round — · Setup';
      flowOrder.textContent = 'Click “New game” to begin.';
    } else if (f.over) {
      flowLine.textContent = 'Round ' + f.totalRounds + '/' + f.totalRounds + ' · Game over';
      flowOrder.innerHTML = '';
    } else {
      flowLine.textContent = 'Round ' + f.round + '/' + f.totalRounds + ' · ' + f.era + ' · ' + f.phase;
      flowOrder.innerHTML = f.order.map((c, i) =>
        '<span class="seat' + (i === 0 ? ' lead' : '') + '" style="color:' + (FLOW_COLORS[c] || '#ccc') + '">'
        + (i + 1) + '. ' + c + '</span>').join('');
    }

    // per-player resource readout (coin / ⚡ / ☀), current player emphasized
    if (f.started && f.res) {
      flowRes.innerHTML = f.order.map((c) => {
        const r = f.res[c] || { coin: 0, zap: 0, sun: 0 };
        const cls = 'resrow' + (c === f.current ? ' cur' : '');
        const coin = '<span' + (r.coin < 0 ? ' class="neg"' : '') + '>🪙' + r.coin + '</span>';
        return '<div class="' + cls + '" style="color:' + (FLOW_COLORS[c] || '#ccc') + '">'
          + c + ' ' + coin + ' ⚡' + r.zap + ' ☀' + r.sun + '</div>';
      }).join('');
    } else {
      flowRes.innerHTML = '';
    }

    // turn bar: per-player phases (Upkeep/Blind Placement/Market) OR the guided event walk.
    const w = f.eventWalk;
    if (f.started && !f.over && f.isEvent && w && w.active && f.current) {
      // guided event execution: walk players (turn order) with heroes at the current event.
      turnbar.hidden = false;
      const meta = f.eventMeta;
      const isMulti = !!(meta && meta.multiRound);
      const roundStr = isMulti
        ? ' · Round ' + (meta.round + 1) + '/' + meta.roundCount + (meta.roundLabel ? ' (' + meta.roundLabel + ')' : '') : '';
      const evLabel = w.label + ' (' + (w.index + 1) + '/' + w.count + ')' + roundStr;
      const resolveWord = isMulti ? 'Resolve the round ▶' : 'Resolve the event ▶';
      turnLine.textContent = w.everyoneFull
        ? evLabel + ' — everyone’s diced. ' + resolveWord
        : evLabel + ' — ' + f.current + '’s turn: dice your hero(es) here';
      // Next player ▶: only when this player has finished AND isn't the last participant.
      nextPlayerBtn.hidden = false;
      nextPlayerBtn.disabled = !w.currentFull || w.isLastParticipant;
      nextPlayerBtn.title = w.isLastParticipant ? 'Last player — resolve' : 'Pass to the next player at this event';
      // Resolve ▶: only when every participant is fully diced. On a non-final multi-round it
      // resolves just this round; on the last round (or a single-shot event) it resolves the event.
      resolveEventBtn.hidden = false;
      resolveEventBtn.disabled = !w.everyoneFull;
      resolveEventBtn.textContent = (isMulti && meta.round < meta.roundCount - 1) ? 'Resolve round ▶' : 'Resolve event ▶';
      reflectSwatch(f.current);
    } else if (f.started && !f.over && f.perPlayer && f.current) {
      turnbar.hidden = false;
      resolveEventBtn.hidden = true;
      // Upkeep: rolling the cup ENDS the turn, so hide the Next player button entirely there.
      const isUpkeep = f.phase === 'Upkeep';
      nextPlayerBtn.hidden = isUpkeep;
      nextPlayerBtn.disabled = false;
      nextPlayerBtn.title = 'Pass to the next player (loops)';
      const msg = f.phase === 'Upkeep'
        ? 'buy dice & exchange, then roll the cup to END your turn'
        : f.phase === 'Market'
          ? 'click a market hero to buy it — buy any you can afford, then Next player'
          : 'play a card + a mini onto an event (drag a Cheer/Jeer to your discard for +2🪙)';
      turnLine.textContent = f.current + '’s turn — ' + msg;
      reflectSwatch(f.current);
    } else {
      turnbar.hidden = true;
    }

    // podium readout: the most recently resolved event's placements + rewards.
    if (f.started && !f.over && f.isEvent && f.lastResolution) {
      const lr = f.lastResolution;
      podiumBox.hidden = false;
      podiumBox.innerHTML = '<div class="pod-h">🏆 ' + lr.label + ' — podium</div>'
        + lr.rows.map((row) => {
            const col = FLOW_COLORS[row.color] || '#ccc';
            const sym = row.symImg ? '<img class="psym" src="' + window.ASSET_BASE + row.symImg + '" alt="">' : '';
            return '<div class="podrow" style="color:' + col + '">'
              + '<span class="ppl">' + row.place + '.</span>' + sym
              + '<span class="pwho">' + row.color + '</span>'
              + '<span class="ptot">' + fmtTotal(row.total) + '</span>'
              + '<span class="prew">' + (row.reward && row.reward !== '—' ? row.reward : '—') + '</span>'
              + '</div>';
          }).join('');
    } else {
      podiumBox.hidden = true;
      podiumBox.innerHTML = '';
    }

    // live event standings: every hero at the CURRENT event, ranked by running total (dice +
    // Cheer/Jeer). Visible all through an event so players can watch the podium — even with the
    // Cheer/Jeer modal open.
    const ranks = (f.started && !f.over && f.isEvent) ? (f.eventRanks || []) : [];
    if (ranks.length) {
      eventRankBox.hidden = false;
      let place = 0, prevTot = null;
      eventRankBox.innerHTML = '<div class="pod-h">📊 Current ranking</div>'
        + ranks.map((row, i) => {
            if (prevTot === null || row.total !== prevTot) { place = i + 1; prevTot = row.total; }
            const col = FLOW_COLORS[row.color] || '#ccc';
            const sym = row.symImg ? '<img class="psym" src="' + window.ASSET_BASE + row.symImg + '" alt="">' : '';
            const tot = row.eliminated ? 'OUT' : fmtTotal(row.total) + (row.diced ? '' : '…');
            return '<div class="podrow' + (row.eliminated ? ' out' : '') + '" style="color:' + col + '">'
              + '<span class="ppl">' + place + '.</span>' + sym
              + '<span class="pwho">' + row.color + '</span>'
              + '<span class="ptot">' + tot + '</span>'
              + '</div>';
          }).join('');
    } else {
      eventRankBox.hidden = true;
      eventRankBox.innerHTML = '';
    }

    // barracks reward panel (open while a mini is being seated to the barracks)
    if (f.barracks) {
      const b = f.barracks;
      const r = (f.res && f.res[b.color]) || { coin: 0, zap: 0, sun: 0 };
      barracks.hidden = false;
      barracksLine.textContent = b.color + ' → Barracks: +1 step · take a resource'
        + (b.picked ? ' ✓' : '');
      barracks.querySelectorAll('.bpick').forEach((btn) => { btn.disabled = b.picked; });
      barRelic.disabled = b.relic || r.zap < 2;
      barChariot.disabled = b.chariot || r.sun < 2;
      barracksLine.style.color = FLOW_COLORS[b.color] || '#ffd479';
    } else {
      barracks.hidden = true;
    }

    // Colosseum-ticket / "waiting for Colosseum" decision walk (center modal, reuses backdrop).
    const cw = f.colWait && f.colWait.step ? f.colWait : null;
    if (cw) {
      const s = cw.step, col = FLOW_COLORS[s.color] || '#ffd479';
      colWait.hidden = false;
      cwLine.style.color = col;
      const sym = (im) => im ? '<img class="psym" src="' + window.ASSET_BASE + im + '" alt="">' : '';
      if (s.kind === 'pay') {
        cwLine.innerHTML = s.color + ' — ' + cw.label + ': ' + sym(s.symImg)
          + ' hero lost. Pay ' + s.fee + '🪙 to send it to the Colosseum?';
        cwBtns.innerHTML =
          '<button class="cwbtn" data-action="pay" data-id="' + s.miniId + '"'
            + (s.canAfford ? '' : ' disabled') + '>Pay ' + s.fee + '🪙 → Colosseum</button>'
          + '<button class="cwbtn" data-action="skip" data-id="' + s.miniId + '">Send home (discard card)</button>';
      } else { // release
        cwLine.innerHTML = s.color + ' at ' + s.options.length + '-mini Colosseum cap — '
          + 'release one waiting hero to make room:';
        cwBtns.innerHTML = s.options.map((o) =>
          '<button class="cwbtn" data-action="release" data-id="' + o.miniId + '">'
            + sym(o.symImg) + 'Release</button>').join('');
      }
    } else {
      colWait.hidden = true;
    }

    // Cheer/Jeer window (center modal): optionally nudge a hero total before the event is scored.
    const mw = f.modWait && f.modWait.step ? f.modWait : null;
    if (mw) {
      const s = mw.step, col = FLOW_COLORS[s.color] || '#ffd479';
      modWait.hidden = false;
      mwLine.style.color = col;
      const label = s.kind === 'cheer' ? 'Cheer' : 'Jeer';
      const scope = s.kind === 'cheer' ? 'your own heroes' : 'any hero at the event';
      mwLine.innerHTML = s.color + ' — ' + s.label + ': play ' + label
        + ' (±' + s.mag + ' to ' + scope + ')?';
      const sym = (im) => im ? '<img class="psym" src="' + window.ASSET_BASE + im + '" alt="">' : '';
      mwTargets.innerHTML = s.targets.map((t) =>
        '<div class="mwrow" style="color:' + (FLOW_COLORS[t.color] || '#ccc') + '">'
          + '<span class="mwhero">' + sym(t.symImg) + '<b>' + t.total + '</b></span>'
          + '<button class="mwbtn" data-card="' + s.cardId + '" data-id="' + t.miniId + '" data-dir="1">+' + s.mag + '</button>'
          + '<button class="mwbtn" data-card="' + s.cardId + '" data-id="' + t.miniId + '" data-dir="-1">−' + s.mag + '</button>'
          + '</div>').join('');
      mwPass.dataset.card = s.cardId;
    } else {
      modWait.hidden = true;
    }

    modalBackdrop.hidden = !(f.barracks || cw || mw);

    // standings: laps first, then furthest into the current lap (the real score)
    if (f.started && f.race) {
      const len = f.laneLen || 24;
      const rows = f.order.slice().sort((a, b) => {
        const ra = f.race[a] || { laps: 0, pos: 0 }, rb = f.race[b] || { laps: 0, pos: 0 };
        return rb.laps - ra.laps || rb.pos - ra.pos;
      });
      standings.innerHTML = rows.map((c, i) => {
        const r = f.race[c] || { laps: 0, pos: 0 };
        return '<div class="stand" style="color:' + (FLOW_COLORS[c] || '#ccc') + '">'
          + '<span class="rank">' + (i + 1) + '</span>'
          + '<span class="who">' + c + '</span>'
          + '<span class="prog">Lap ' + r.laps + ' · ' + r.pos + '/' + len + '</span>'
          + '<button class="radv" data-color="' + c + '" data-dir="-1" title="Step back">–</button>'
          + '<button class="radv" data-color="' + c + '" data-dir="1" title="Step forward (earn a VP)">+</button>'
          + '</div>';
      }).join('');
    } else {
      standings.innerHTML = '<p class="hint">Start a game — leaders (most laps, then furthest along) show here.</p>';
    }

    prevBtn.disabled = !f.started || (f.round === 1 && f.phaseIndex === 0);
    // hard gates: can't leave Upkeep until the current player rolls their cup; can't leave
    // an event phase until every event has been walked through and resolved.
    const rollBlocked = f.started && !f.over && f.phase === 'Upkeep' && !f.rollGateOk;
    const eventBlocked = f.started && !f.over && f.isEvent && !(f.eventWalk && f.eventWalk.complete);
    nextBtn.disabled = !f.started || f.over || rollBlocked || eventBlocked;
    nextBtn.title = rollBlocked ? 'Every player must roll their cup first'
      : eventBlocked ? 'Resolve every event before advancing'
      : 'Advance to the next phase / round';

    renderPlayerPanel(f);
  }

  // ---- click a mini -> show the hero card in its matching α-ε slot (left overlay) ----
  const miniCard = document.getElementById('miniCard');
  const miniCardHead = document.getElementById('miniCardHead');
  const miniCardImg = document.getElementById('miniCardImg');
  const miniCardCap = document.getElementById('miniCardCap');
  document.getElementById('miniCardClose').addEventListener('click', () => { miniCard.hidden = true; });

  const FACE_LABELS = Object.fromEntries(HEROES);   // '2_3_Hero.png' -> 'Str2 Spd3'
  function labelForFace(face) {
    if (!face) return '';
    if (FACE_LABELS[face]) return FACE_LABELS[face];
    if (/Pliebe/i.test(face)) return 'Plebe';
    if (/Cheer/i.test(face)) return 'Cheer';
    if (/Jeer/i.test(face)) return 'Jeer';
    return face.replace(/\.png$/i, '');
  }
  PT.onMiniClick((info) => {
    miniCard.hidden = false;
    const col = FLOW_COLORS[info.color] || '#ccc';
    const chip = info.symImg
      ? '<img class="mcsym" src="' + window.ASSET_BASE + info.symImg + '" alt="symbol">'
      : '';
    miniCardHead.innerHTML = '<span class="mcdot" style="background:' + col + '"></span>'
      + (info.color || '?') + chip;
    if (info.face) {
      miniCardImg.src = window.ASSET_BASE + info.face;
      miniCardImg.style.display = '';
      miniCardCap.textContent = labelForFace(info.face);
    } else {
      miniCardImg.removeAttribute('src');
      miniCardImg.style.display = 'none';
      miniCardCap.textContent = 'No hero card linked — this mini is inactive.';
    }
  });

  // ---- Blind Placement: click-a-mini placement menu ----
  const miniPlace = document.getElementById('miniPlace');
  const mpHead = document.getElementById('mpHead');
  const mpBtns = document.getElementById('mpBtns');
  let mpId = null;
  document.getElementById('miniPlaceClose').addEventListener('click', () => { miniPlace.hidden = true; });
  PT.onMiniPlace((info) => {
    miniCard.hidden = true;                 // never show both overlays at once
    miniPlace.hidden = false;
    mpId = info.id;
    const col = FLOW_COLORS[info.color] || '#ccc';
    const chip = info.symImg
      ? '<img class="mcsym" src="' + window.ASSET_BASE + info.symImg + '" alt="symbol">'
      : '';
    mpHead.innerHTML = '<span class="mcdot" style="background:' + col + '"></span>Send '
      + (info.color || '?') + ' hero' + chip;
    mpBtns.innerHTML = info.options.map((o) => {
      const fee = (o.kind === 'event' && o.fee) ? ' <span class="mpfee">' + o.fee + '🪙</span>' : '';
      return '<button class="mpbtn" data-kind="' + o.kind + '" data-key="' + o.key + '"'
        + (o.disabled ? ' disabled' : '') + '>' + o.label + fee + '</button>';
    }).join('');
  });
  mpBtns.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    const key = btn.dataset.kind === 'event' ? Number(btn.dataset.key) : btn.dataset.key;
    PT.sendMiniTo(mpId, btn.dataset.kind, key);
    miniPlace.hidden = true;
  });

  // ---- Market: click-a-card purchase menu ----
  const marketBuy = document.getElementById('marketBuy');
  const mbHead = document.getElementById('mbHead');
  const mbBtns = document.getElementById('mbBtns');
  let mbId = null;
  document.getElementById('marketBuyClose').addEventListener('click', () => { marketBuy.hidden = true; });
  PT.onMarketBuy((info) => {
    miniCard.hidden = true; miniPlace.hidden = true;   // one overlay at a time
    marketBuy.hidden = false;
    mbId = info.cardId;
    const col = FLOW_COLORS[info.color] || '#ccc';
    mbHead.innerHTML = '<span class="mcdot" style="background:' + col + '"></span>Buy '
      + labelForFace(info.face) + ' — ' + (info.color || '?');
    mbBtns.innerHTML = info.options.length
      ? info.options.map((o, i) =>
          '<button class="mpbtn" data-idx="' + i + '"' + (o.affordable ? '' : ' disabled')
          + '>' + o.label + '</button>').join('')
      : '<span class="mpfee">Not for sale</span>';
  });
  mbBtns.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    PT.buyMarketCard(mbId, Number(btn.dataset.idx));
    marketBuy.hidden = true;
  });

  PT.onFlow(renderFlow);
  renderFlow(PT.getFlow());
  nextBtn.addEventListener('click', () => PT.nextPhase());
  prevBtn.addEventListener('click', () => PT.prevPhase());
  nextPlayerBtn.addEventListener('click', () =>
    (curFlow && curFlow.isEvent) ? PT.nextEventParticipant() : PT.nextPlayer());
  resolveEventBtn.addEventListener('click', () => PT.resolveEvent());

  // left player panel — owner read at click time so buttons always act on the right player
  rollCupBtn.addEventListener('click', () => PT.rollCup(ownerOf(curFlow)));
  exZapBtn.addEventListener('click', () => PT.exchangeForCoin(ownerOf(curFlow), 'zap'));
  exSunBtn.addEventListener('click', () => PT.exchangeForCoin(ownerOf(curFlow), 'sun'));
  addDieBtn.addEventListener('click', () => PT.addCupDie(ownerOf(curFlow)));
  cupGrid.addEventListener('click', (e) => {
    const b = e.target.closest('.die');
    if (!b || b.disabled || b.dataset.idx === undefined) return;
    PT.drawFromCup(ownerOf(curFlow), +b.dataset.idx);   // draws into the selected hero
  });
  // per-hero event dice: select a hero, roll/clear its dice, or ±1 bump a die (owner read live)
  heroList.addEventListener('click', (e) => {
    const owner = ownerOf(curFlow);
    const bump = e.target.closest('.diebump');
    if (bump) { PT.bumpHeroDie(+bump.dataset.id, +bump.dataset.idx, +bump.dataset.dir); return; }
    const rr = e.target.closest('.diereroll');
    if (rr) { PT.rerollHeroDie(+rr.dataset.id, +rr.dataset.idx); return; }
    const lj = e.target.closest('.hero-lj');
    if (lj) { PT.toggleLongJumpExtra(+lj.dataset.id); return; }
    const jump = e.target.closest('.hero-jump');
    if (jump) { PT.commitLongJump(+jump.dataset.id); return; }
    const roll = e.target.closest('.hero-roll');
    if (roll) { PT.selectHero(+roll.dataset.id); PT.rollRandomDie(owner); return; }
    const clr = e.target.closest('.hero-clear');
    if (clr) { PT.clearHeroDice(+clr.dataset.id); return; }
    const row = e.target.closest('.hero');
    if (row) PT.selectHero(+row.dataset.id);
  });

  // standings +/- (event-delegated: rows are re-rendered each flow update)
  standings.addEventListener('click', (e) => {
    const btn = e.target.closest('.radv');
    if (btn) PT.advanceRace(btn.dataset.color, +btn.dataset.dir);
  });
  barracks.querySelectorAll('.bpick').forEach((btn) =>
    btn.addEventListener('click', () => PT.barracksPick(btn.dataset.kind)));
  barRelic.addEventListener('click', () => PT.barracksMove('relic'));
  barChariot.addEventListener('click', () => PT.barracksMove('chariot'));
  document.getElementById('barDone').addEventListener('click', () => PT.barracksDone());

  // colWait modal: buttons are rebuilt per step, so delegate by data-action/data-id.
  cwBtns.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]'); if (!btn || btn.disabled) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.action === 'pay') PT.colWaitPay(id);
    else if (btn.dataset.action === 'skip') PT.colWaitSkip(id);
    else if (btn.dataset.action === 'release') PT.colWaitRelease(id);
  });

  // modWait modal: +/- buttons apply the card to a hero; Pass keeps it in hand. Rebuilt per step.
  mwTargets.addEventListener('click', (e) => {
    const btn = e.target.closest('button.mwbtn'); if (!btn) return;
    PT.modWaitUse(Number(btn.dataset.card), Number(btn.dataset.id), Number(btn.dataset.dir));
  });
  mwPass.addEventListener('click', () => PT.modWaitPass(Number(mwPass.dataset.card)));
</script>
