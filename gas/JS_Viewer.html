<script type="module">
  import * as THREE from 'three';
  import { STLLoader }      from 'three/addons/loaders/STLLoader.js';
  import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
  import { DecalGeometry }  from 'three/addons/geometries/DecalGeometry.js';

  const ASSET_BASE = window.ASSET_BASE;
  const statusEl   = document.getElementById('status');
  const container  = document.getElementById('viewer');

  // ---- Scene / camera / renderer -----------------------------------------
  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(1, 1.5, 2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.4);
  rim.position.set(-1, 0.5, -1.5);
  scene.add(rim);

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Black symbol as a decal texture (drawn on a canvas) ---------------
  // A flat graphic projected onto the surface — swap this for any transparent
  // PNG by using new THREE.TextureLoader().load(assetUrl('YourSymbol.png')).
  function makeSymbolTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);
    ctx.fillStyle = '#000';
    // simple 5-point star
    const cx = 128, cy = 128, spikes = 5, outer = 105, inner = 46;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (Math.PI / spikes) * i - Math.PI / 2;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }
  const symbolTexture = makeSymbolTexture();

  // ---- Model state -------------------------------------------------------
  const loader = new STLLoader();
  let mesh = null, decalMesh = null, currentColor = 0x2f6fdb;

  function clearModel() {
    for (const m of [mesh, decalMesh]) {
      if (!m) continue;
      scene.remove(m);
      m.geometry.dispose();
      m.material.dispose();
    }
    mesh = decalMesh = null;
  }

  function loadModel(file) {
    statusEl.textContent = 'Loading ' + file + '…';
    loader.load(ASSET_BASE + file, (geometry) => {
      clearModel();

      // STLs from CAD are often Z-up; stand it up and center at the origin.
      geometry.rotateX(-Math.PI / 2);
      geometry.center();
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        color: currentColor, metalness: 0.15, roughness: 0.65,
      });
      mesh = new THREE.Mesh(geometry, material);
      mesh.updateMatrixWorld();
      scene.add(mesh);

      // Frame the camera to the model.
      geometry.computeBoundingSphere();
      const r = geometry.boundingSphere.radius;
      camera.position.set(0, r * 0.4, r * 3.2);
      controls.target.set(0, 0, 0);
      controls.update();
      camera.near = r / 100; camera.far = r * 100;
      camera.updateProjectionMatrix();

      addDecal(r);
      statusEl.textContent = file + ' — drag to orbit, scroll to zoom.';
    },
    undefined,
    (err) => {
      console.error(err);
      statusEl.textContent = 'Failed to load ' + file + ' (check the STL URL / CORS).';
    });
  }

  // Project the black symbol onto the front (+Z) surface of the model.
  function addDecal(r) {
    if (decalMesh) { scene.remove(decalMesh); decalMesh.geometry.dispose(); decalMesh.material.dispose(); decalMesh = null; }

    const ray = new THREE.Raycaster();
    ray.set(new THREE.Vector3(0, 0, r * 4), new THREE.Vector3(0, 0, -1));
    const hit = ray.intersectObject(mesh)[0];

    let position, orientation;
    if (hit) {
      position = hit.point.clone();
      const helper = new THREE.Object3D();
      const n = hit.face.normal.clone().transformDirection(mesh.matrixWorld).multiplyScalar(r);
      helper.position.copy(position);
      helper.lookAt(position.clone().add(n));
      orientation = helper.rotation.clone();
    } else {
      // Fallback: stamp on the front plane if the ray missed.
      position = new THREE.Vector3(0, 0, r);
      orientation = new THREE.Euler();
    }

    const size = new THREE.Vector3(r * 1.1, r * 1.1, r * 1.5);
    const decalGeom = new DecalGeometry(mesh, position, orientation, size);
    const decalMat = new THREE.MeshStandardMaterial({
      map: symbolTexture,
      transparent: true,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -4,
    });
    decalMesh = new THREE.Mesh(decalGeom, decalMat);
    scene.add(decalMesh);
  }

  // ---- UI ----------------------------------------------------------------
  document.getElementById('modelSelect').addEventListener('change', (e) => loadModel(e.target.value));
  document.querySelectorAll('.sw').forEach((b) => b.addEventListener('click', () => {
    currentColor = parseInt(b.dataset.color, 16);
    if (mesh) mesh.material.color.setHex(currentColor);
  }));

  // ---- Render loop -------------------------------------------------------
  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();

  loadModel('ArchaeaA.stl');
</script>
