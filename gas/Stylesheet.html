<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1b1b1b;
    color: #f2f2f2;
  }
  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    letter-spacing: 1px;
    margin: 10px 16px 8px;
    font-size: 1.4rem;
  }

  /* ------------------------------------------------------------- toolbar */
  #toolbar {
    display: flex;
    gap: 10px;
    align-items: stretch;
    flex-wrap: wrap;
    padding: 0 16px 10px;
  }
  #toolbar fieldset {
    border: 1px solid #3a3d42;
    border-radius: 6px;
    padding: 6px 10px 8px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #toolbar legend {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9aa0a6;
    padding: 0 4px;
  }
  #toolbar select,
  #toolbar input,
  #toolbar button {
    font: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
  }
  #toolbar button:hover { background: #3a3d42; }
  #toolbar input[type="number"] { cursor: text; }
  .dtot { font-size: 0.85rem; color: #ffd479; white-space: nowrap; }
  .chk { display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
  .chk input { width: auto; padding: 0; margin: 0; cursor: pointer; }

  /* swatches */
  .swatches { display: inline-flex; align-items: center; gap: 6px; }
  .sw {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid #444;
    cursor: pointer;
    padding: 0;
  }
  .sw:hover { border-color: #fff; }
  .sw.active { border-color: #fff; box-shadow: 0 0 0 2px #ffd479; }

  /* ------------------------------------------------------------- stage */
  #stage {
    display: flex;
    gap: 12px;
    align-items: stretch;
    padding: 0 16px 16px;
    height: 78vh;
  }
  #viewer {
    position: relative;
    flex: 1 1 auto;
    background: radial-gradient(circle at 50% 35%, #33383f, #16181b);
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  /* mini → tied hero card (left overlay) */
  #miniCard {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    width: 180px;
    background: rgba(23, 24, 27, 0.94);
    border: 1px solid #3a3d42; border-radius: 8px;
    padding: 10px 10px 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
  }
  #miniCardHead { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  #miniCard .mcdot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  #miniCard .mcsym { width: 22px; height: 22px; margin-left: auto; display: block; flex: 0 0 auto; }
  #miniCardImg { width: 100%; border-radius: 6px; display: block; background: #0d0e10; }
  #miniCardCap { font-size: 0.8rem; color: #cfd3d8; margin-top: 8px; text-align: center; }
  #miniCardClose {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.8rem; line-height: 1;
  }
  #miniCardClose:hover { background: #3a3d42; }
  #viewer canvas { display: block; cursor: grab; }
  #viewer canvas:active { cursor: grabbing; }

  /* ------------------------------------------------------------- player panel (left) */
  #playerPanel {
    flex: 0 0 230px;
    background: #202226;
    border: 1px solid #3a3d42;
    border-radius: 8px;
    padding: 12px 14px;
    overflow: auto;
  }
  #ppHead { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; }
  #ppHead .ppdot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: 0 0 auto; background: #666; }
  #ppRes {
    margin: 6px 0 12px;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    color: #e6e8ea;
    letter-spacing: 0.5px;
  }
  .ppsec { margin-bottom: 14px; padding-top: 10px; border-top: 1px solid #3a3d42; }
  .ppsec-h { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: #9aa0a6; margin-bottom: 8px; }
  .ppmini { font-size: 0.74rem; color: #8a8f96; margin-top: 6px; line-height: 1.35; }
  .ppbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .ppbtns button, .ppwide {
    flex: 1 1 auto;
    padding: 7px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .ppwide { width: 100%; margin-top: 6px; }
  .ppbtns button:hover:not(:disabled), .ppwide:hover:not(:disabled) { background: #3a3d42; }
  .ppbtns button:disabled, .ppwide:disabled { opacity: 0.4; cursor: default; }

  /* dice grids (cup + drawn scratchpad) — unicode dice faces */
  .digrid {
    display: flex; flex-wrap: wrap; gap: 6px;
    min-height: 40px;
    padding: 8px;
    background: #17181b;
    border: 1px solid #3a3d42;
    border-radius: 6px;
    align-content: flex-start;
  }
  .die {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    border-radius: 6px;
    border: 1px solid #4a4d52;
    background: #24262b;
    font-size: 1.5rem; line-height: 1;
    color: #f2f2f2;
  }
  button.die { cursor: default; padding: 0; }
  button.die.draw { cursor: pointer; border-color: #ffd479; }
  button.die.draw:hover { background: #34373d; }
  button.die:disabled { cursor: default; }
  /* blank (unrolled cup / unfilled hero slot) die — dashed empty square */
  .die.blank { color: transparent; border-style: dashed; background: #1c1d21; }
  .drawnDie { display: inline-flex; align-items: center; gap: 3px; }
  .diebump {
    width: 20px; height: 34px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 1rem; line-height: 1; padding: 0;
  }
  .diebump:hover:not(:disabled) { background: #3a3d42; }
  .diebump:disabled { opacity: 0.35; cursor: default; }

  /* per-hero event dice list (left panel, Resolution / Colosseum) */
  #heroList { display: flex; flex-direction: column; gap: 8px; }
  .hero {
    border: 1px solid #3a3d42; border-radius: 6px;
    background: #17181b; padding: 8px; cursor: pointer;
  }
  .hero:hover { border-color: #55585e; }
  .hero.sel { border-color: #ffd479; box-shadow: 0 0 0 1px #ffd479 inset; }
  .hero-top { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
  .hero-top .hsym { width: 16px; height: 16px; flex: 0 0 auto; }
  .hero-lbl { flex: 1 1 auto; color: #e6e8ea; }
  .hero-cnt { font-variant-numeric: tabular-nums; color: #c98b2e; font-weight: 700; }
  .hero-cnt.ok { color: #2ea84f; }
  .hero-dice { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0; min-height: 34px; align-content: flex-start; }
  .hdie { display: inline-flex; align-items: center; gap: 2px; }
  .hero-acts { display: flex; gap: 6px; }
  .hero-acts button {
    flex: 1 1 auto; padding: 5px 6px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.78rem;
  }
  .hero-acts button:hover:not(:disabled) { background: #3a3d42; }
  .hero-acts button:disabled { opacity: 0.4; cursor: default; }

  /* ------------------------------------------------------------- center modal */
  #modalBackdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }
  /* the `hidden` attribute must beat the display:flex above (equal specificity, so
     this rule wins by coming later); without it the modal is always shown. */
  #modalBackdrop[hidden] { display: none; }
  #modalBox {
    width: 300px;
    background: #202226;
    border: 1px solid #4a4d52;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
  }
  #modalBox #barracks { margin: 0; padding: 0; border: 0; }
  #modalBox #barracksLine { font-size: 0.95rem; }
  /* colWait modal reuses the barracks look; buttons inherit .barbtns button styling. */
  #modalBox #colWait { margin: 0; padding: 0; border: 0; }
  #modalBox #colWait[hidden] { display: none; }
  #cwLine { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
  #cwBtns { flex-wrap: wrap; }
  .cwbtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .cwbtn .psym { width: 15px; height: 15px; flex: 0 0 auto; }

  /* ------------------------------------------------------------- VP panel */
  #vpPanel {
    flex: 0 0 220px;
    background: #202226;
    border: 1px solid #3a3d42;
    border-radius: 8px;
    padding: 12px 14px;
    overflow: auto;
  }
  #vpPanel h3 { margin: 2px 0 10px; font-size: 1rem; }
  .vp {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .vp .dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: inline-block;
    flex: 0 0 auto;
  }
  .vp .val {
    min-width: 2.2em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 1.1rem;
  }
  .vp button {
    width: 28px; height: 28px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .vp button:hover { background: #3a3d42; }
  .hint { color: #8a8f96; font-size: 0.78rem; margin-top: 14px; line-height: 1.4; }

  /* game flow HUD */
  #flow {
    background: #17181b;
    border: 1px solid #3a3d42;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  #flowLine { font-size: 0.9rem; font-weight: 600; line-height: 1.35; }
  #flowOrder {
    margin-top: 6px;
    font-size: 0.8rem;
    color: #8a8f96;
    display: flex; flex-wrap: wrap;
    gap: 4px 10px;
  }
  #flowOrder .seat { white-space: nowrap; }
  #flowOrder .seat.lead { font-weight: 700; text-decoration: underline; }
  .flowbtns { display: flex; gap: 8px; margin-top: 10px; }
  .flowbtns button {
    flex: 1;
    padding: 6px 0;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .flowbtns button:hover:not(:disabled) { background: #3a3d42; }
  .flowbtns button:disabled { opacity: 0.4; cursor: default; }

  /* per-player resources */
  #flowRes { margin-top: 8px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  #flowRes .resrow { display: flex; gap: 6px; padding: 1px 4px; border-radius: 3px; }
  #flowRes .resrow.cur { background: #2a2c30; font-weight: 700; }
  #flowRes .resrow .neg { color: #ff6b6b; }

  /* per-player turn bar */
  #turnbar {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #3a3d42;
  }
  #turnLine { font-size: 0.82rem; color: #ffd479; margin-bottom: 6px; }
  .turnbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .turnbtns button {
    flex: 1 1 auto;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .turnbtns button:hover:not(:disabled) { background: #3a3d42; }
  .turnbtns button:disabled { opacity: 0.4; cursor: default; }
  #nextPlayer { flex-basis: 100%; }
  #resolveEvent { flex-basis: 100%; border-color: #6a5a2a; background: #3a331f; color: #ffd479; }
  #resolveEvent:hover:not(:disabled) { background: #4a4026; }

  /* podium readout (after an event resolves) */
  #podiumBox {
    margin-top: 8px;
    padding: 8px;
    border: 1px solid #3a3d42;
    border-radius: 5px;
    background: #17181c;
  }
  #podiumBox .pod-h { font-size: 0.78rem; color: #ffd479; margin-bottom: 5px; }
  .podrow { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 2px 0; }
  .podrow .psym { width: 14px; height: 14px; flex: 0 0 auto; }
  .podrow .ppl { width: 16px; text-align: right; opacity: 0.85; }
  .podrow .pwho { flex: 1 1 auto; }
  .podrow .ptot { opacity: 0.85; }
  .podrow .prew { min-width: 42px; text-align: right; font-weight: 600; }

  /* barracks reward panel */
  #barracks {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #3a3d42;
  }
  #barracksLine { font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  .barbtns { display: flex; gap: 6px; margin-bottom: 6px; }
  .barbtns button, #barDone {
    flex: 1 1 auto;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.8rem;
  }
  #barDone { width: 100%; margin-top: 2px; }
  .barbtns button:hover:not(:disabled), #barDone:hover { background: #3a3d42; }
  .barbtns button:disabled { opacity: 0.4; cursor: default; }

  /* standings (race leaderboard) */
  #standings { margin-bottom: 12px; }
  .stand {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .stand .rank {
    flex: 0 0 auto;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #2a2c30;
    text-align: center;
    line-height: 18px;
    font-size: 0.72rem;
    color: #cfd3d8;
  }
  .stand .who { flex: 0 0 auto; font-weight: 600; }
  .stand .prog { flex: 1 1 auto; color: #9aa0a6; font-size: 0.78rem; }
  .stand .radv {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .stand .radv:hover { background: #3a3d42; }
</style>
