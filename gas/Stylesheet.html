<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1b1b1b;
    color: #f2f2f2;
  }
  .title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    letter-spacing: 1px;
    margin: 10px 16px 8px;
    font-size: 1.4rem;
  }
  /* ⚙ toggle for the setup/sim tools — collapses once a game is running. */
  .tbtoggle {
    font: inherit; font-style: normal; font-size: 0.72rem;
    vertical-align: middle; margin-left: 12px;
    padding: 3px 9px; border-radius: 5px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #cfd3d8; cursor: pointer;
  }
  .tbtoggle:hover { background: #3a3d42; }
  body.toolsopen .tbtoggle { box-shadow: 0 0 0 2px #ffd47955; }
  body.toolshidden #toolbar { display: none; }

  /* ------------------------------------------------------------- toolbar */
  #toolbar {
    display: flex;
    gap: 10px;
    align-items: stretch;
    flex-wrap: wrap;
    padding: 0 16px 10px;
  }
  #toolbar fieldset {
    border: 1px solid #3a3d42;
    border-radius: 6px;
    padding: 6px 10px 8px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #toolbar legend {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #9aa0a6;
    padding: 0 4px;
  }
  #toolbar select,
  #toolbar input,
  #toolbar button {
    font: inherit;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
  }
  #toolbar button:hover { background: #3a3d42; }
  #toolbar input[type="number"] { cursor: text; }
  .dtot { font-size: 0.85rem; color: #ffd479; white-space: nowrap; }
  .chk { display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
  .chk input { width: auto; padding: 0; margin: 0; cursor: pointer; }

  /* swatches */
  .swatches { display: inline-flex; align-items: center; gap: 6px; }
  .sw {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid #444;
    cursor: pointer;
    padding: 0;
  }
  .sw:hover { border-color: #fff; }
  .sw.active { border-color: #fff; box-shadow: 0 0 0 2px #ffd479; }

  /* ------------------------------------------------------- top game status */
  /* Resources + the column-rung matrix sit above the board as side-by-side cards.
     Empty (and collapsed) until a game starts. */
  #topStatus {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-start;
    padding: 0 16px 8px;
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
  }
  #topStatus:empty { display: none; }
  #topStatus .tsSec {
    background: #1c1e22;
    border: 1px solid #2a2c30;
    border-radius: 6px;
    padding: 6px 10px;
    min-width: 150px;
  }
  #topStatus .tsh {
    color: #8a8d93; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 4px;
  }
  #topStatus .resrow { display: flex; gap: 6px; padding: 1px 3px; border-radius: 3px; }
  #topStatus .resrow.cur { background: #2a2c30; font-weight: 700; }
  #topStatus .resrow .neg { color: #ff6b6b; }

  /* column-rung matrix: god rows × player columns of 6-segment meters */
  .colsum {
    display: grid;
    grid-template-columns: auto repeat(4, auto);
    gap: 4px 10px;
    align-items: center;
  }
  .colsum .cg { color: #cfd3d8; font-size: 0.76rem; }
  .colsum .pdot {
    width: 10px; height: 10px; border-radius: 50%;
    justify-self: center; box-shadow: 0 0 0 1px #00000060;
  }
  .rmeter { display: inline-flex; gap: 2px; }
  .rseg {
    width: 6px; height: 13px; border-radius: 2px;
    background: #2a2c30; box-shadow: inset 0 0 0 1px #00000040;
  }
  .colbadges { margin-top: 6px; border-top: 1px solid #2a2c30; padding-top: 5px; font-size: 0.74rem; }
  .colbadges > div { display: flex; gap: 6px; padding: 1px 0; }
  .colbadges .cbk { color: #8a8d93; min-width: 74px; }

  /* running game log — its own scrollable box on the lower right */
  #gameLog {
    margin-top: 8px;
    background: #16181b;
    border: 1px solid #2a2c30;
    border-radius: 6px;
    padding: 6px 8px;
    max-height: 150px;
    overflow: auto;
    font-size: 0.74rem;
    color: #b7bcc4;
    font-variant-numeric: tabular-nums;
  }
  #gameLog .glh {
    color: #8a8d93; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 3px;
  }
  #gameLog div { padding: 1px 0; }

  /* ------------------------------------------------------------- stage */
  #stage {
    display: flex;
    gap: 12px;
    align-items: stretch;
    padding: 0 16px 16px;
    height: 78vh;
  }
  #viewer {
    position: relative;
    flex: 1 1 auto;
    background: radial-gradient(circle at 50% 35%, #33383f, #16181b);
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  /* mini → tied hero card (left overlay) */
  #miniCard {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    width: 180px;
    background: rgba(23, 24, 27, 0.94);
    border: 1px solid #3a3d42; border-radius: 8px;
    padding: 10px 10px 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
  }
  #miniCardHead { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  #miniCard .mcdot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  #miniCard .mcsym { width: 22px; height: 22px; margin-left: auto; display: block; flex: 0 0 auto; }
  #miniCardImg { width: 100%; border-radius: 6px; display: block; background: #0d0e10; }
  #miniCardCap { font-size: 0.8rem; color: #cfd3d8; margin-top: 8px; text-align: center; }
  #miniCardClose {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.8rem; line-height: 1;
  }
  #miniCardClose:hover { background: #3a3d42; }

  /* mini → send-to-event/barracks menu (Blind Placement, left overlay) */
  #miniPlace {
    position: absolute; top: 12px; left: 12px; z-index: 6;
    width: 190px;
    background: rgba(23, 24, 27, 0.96);
    border: 1px solid #3a3d42; border-radius: 8px;
    padding: 10px 10px 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
  }
  #mpHead { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  #miniPlace .mcdot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  #miniPlace .mcsym { width: 22px; height: 22px; margin-left: auto; display: block; flex: 0 0 auto; }
  #mpBtns { display: flex; flex-direction: column; gap: 6px; }
  #mpBtns .mpbtn {
    width: 100%; text-align: left; padding: 7px 9px; border-radius: 6px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center;
  }
  #mpBtns .mpbtn:hover:not(:disabled) { background: #3a3d42; }
  #mpBtns .mpbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mpBtns .mpfee { color: #f5b800; font-weight: 600; }
  #miniPlaceClose {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.8rem; line-height: 1;
  }
  #miniPlaceClose:hover { background: #3a3d42; }
  /* Market purchase overlay — mirrors #miniPlace, anchored top-right of the viewer. */
  #marketBuy {
    position: absolute; top: 12px; right: 12px; z-index: 6;
    width: 200px;
    background: rgba(23, 24, 27, 0.96);
    border: 1px solid #3a3d42; border-radius: 8px;
    padding: 10px 10px 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
  }
  #mbHead { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  #marketBuy .mcdot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  #mbBtns { display: flex; flex-direction: column; gap: 6px; }
  #mbBtns .mpbtn {
    width: 100%; text-align: center; padding: 7px 9px; border-radius: 6px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.82rem;
  }
  #mbBtns .mpbtn:hover:not(:disabled) { background: #3a3d42; }
  #mbBtns .mpbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #mbBtns .mpfee { color: #f5b800; font-weight: 600; font-size: 0.8rem; }
  #marketBuyClose {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.8rem; line-height: 1;
  }
  #marketBuyClose:hover { background: #3a3d42; }
  #viewer canvas { display: block; cursor: grab; }
  #viewer canvas:active { cursor: grabbing; }

  /* ------------------------------------------------------------- player panel (left) */
  #playerPanel {
    flex: 0 0 230px;
    background: #202226;
    border: 1px solid #3a3d42;
    border-radius: 8px;
    padding: 12px 14px;
    overflow: auto;
  }
  #ppHead { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; }
  #ppHead .ppdot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: 0 0 auto; background: #666; }
  #ppRes {
    margin: 6px 0 12px;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    color: #e6e8ea;
    letter-spacing: 0.5px;
  }
  .ppsec { margin-bottom: 14px; padding-top: 10px; border-top: 1px solid #3a3d42; }
  .ppsec-h { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: #9aa0a6; margin-bottom: 8px; }
  .ppmini { font-size: 0.74rem; color: #8a8f96; margin-top: 6px; line-height: 1.35; }
  .ppbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .ppbtns button, .ppwide {
    flex: 1 1 auto;
    padding: 7px 8px;
    border-radius: 4px;
    border: 1px solid #4a4d52;
    background: #2a2c30;
    color: #f2f2f2;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .ppwide { width: 100%; margin-top: 6px; }
  .ppbtns button:hover:not(:disabled), .ppwide:hover:not(:disabled) { background: #3a3d42; }
  .ppbtns button:disabled, .ppwide:disabled { opacity: 0.4; cursor: default; }

  /* dice grids (cup + drawn scratchpad) — unicode dice faces */
  .digrid {
    display: flex; flex-wrap: wrap; gap: 6px;
    min-height: 40px;
    padding: 8px;
    background: #17181b;
    border: 1px solid #3a3d42;
    border-radius: 6px;
    align-content: flex-start;
  }
  .die {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    border-radius: 6px;
    border: 1px solid #4a4d52;
    background: #24262b;
    font-size: 2rem; line-height: 1;   /* die glyph fills most of the 34px slot */
    color: #f2f2f2;
  }
  button.die { cursor: default; padding: 0; }
  button.die.draw { cursor: pointer; border-color: #ffd479; }
  button.die.draw:hover { background: #34373d; }
  button.die:disabled { cursor: default; }
  /* blank (unrolled cup / unfilled hero slot) die — dashed empty square */
  .die.blank { color: transparent; border-style: dashed; background: #1c1d21; }
  .drawnDie { display: inline-flex; align-items: center; gap: 3px; }
  /* per-hero event dice list (left panel, Resolution / Colosseum) */
  #heroList { display: flex; flex-direction: column; gap: 8px; }
  .hero {
    border: 1px solid #3a3d42; border-radius: 6px;
    background: #17181b; padding: 8px; cursor: pointer;
  }
  .hero:hover { border-color: #55585e; }
  .hero.sel { border-color: #ffd479; box-shadow: 0 0 0 1px #ffd479 inset; }
  .hero-top { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
  .hero-top .hsym { width: 16px; height: 16px; flex: 0 0 auto; }
  .hero-lbl { flex: 1 1 auto; color: #e6e8ea; }
  .hero-cnt { font-variant-numeric: tabular-nums; color: #c98b2e; font-weight: 700; }
  .hero-cnt.ok { color: #2ea84f; }
  .hero-dice { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0; min-height: 34px; align-content: flex-start; }
  .hdie { display: inline-flex; align-items: center; gap: 2px; }
  .hero-acts { display: flex; gap: 6px; }
  .hero-acts button {
    flex: 1 1 auto; padding: 5px 6px; border-radius: 4px;
    border: 1px solid #4a4d52; background: #2a2c30; color: #f2f2f2;
    cursor: pointer; font-size: 0.78rem;
  }
  .hero-acts button:hover:not(:disabled) { background: #3a3d42; }
  .hero-acts button:disabled { opacity: 0.4; cursor: default; }
  /* free-reroll die control (per-event §5 allowance) */
  .diereroll {
    width: 18px; height: 18px; line-height: 1; padding: 0; border-radius: 4px;
    border: 1px solid #4a6da0; background: #223247; color: #9fd2ff; cursor: pointer; font-size: 0.72rem;
  }
  .diereroll:hover { background: #2c4160; }
  /* per-event computed score / foul / reroll hint under a hero's dice */
  .hero-score { font-size: 0.74rem; margin: -2px 0 6px; }
  .hero-score .hscore { color: #9fd2ff; font-weight: 600; }
  .hero-score .hfoul  { color: #ff8f8f; font-weight: 700; letter-spacing: 0.03em; }
  .hero-score .hreroll { color: #7fb0e0; }
  /* Long Jump optional-approach toggle */
  .hero-lj {
    flex: 1 1 auto; padding: 5px 6px; border-radius: 4px;
    border: 1px solid #4a6da0; background: #223247; color: #9fd2ff; cursor: pointer; font-size: 0.76rem;
  }
  .hero-lj.on { background: #2c4160; border-color: #6f9fd6; color: #cfe6ff; }
  .hero-lj:disabled { opacity: 0.4; cursor: default; }
  /* Long Jump: approach vs jump groups (clearly marked, jump locked until committed) */
  .lj-grp {
    margin: 6px 0; padding: 5px 7px 7px; border-radius: 5px;
    border: 1px solid #3a3d42; background: #24262b;
  }
  .lj-grp .hero-dice { margin: 5px 0 0; min-height: 0; }
  .lj-lbl {
    display: block; font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: #9aa0a8; font-weight: 600;
  }
  .lj-grp.locked { opacity: 0.72; border-style: dashed; }
  .lj-grp.locked .lj-lbl { color: #6f757d; }
  .lj-hint { display: inline-block; margin-top: 4px; font-size: 0.72rem; color: #7d838b; font-style: italic; }
  .hero-jump {
    margin-top: 5px; padding: 5px 10px; border-radius: 4px; font-size: 0.78rem; font-weight: 600;
    border: 1px solid #6f9fd6; background: #2c4160; color: #cfe6ff; cursor: pointer;
  }
  .hero-jump:hover { background: #35507a; }
  /* eliminated (OUT) multi-round hero row */
  .hero.out { opacity: 0.55; border-style: dashed; }
  .hero-cnt.out { color: #ff8f8f; font-weight: 700; }

  /* ------------------------------------------------------------- center modal */
  #modalBackdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }
  /* the `hidden` attribute must beat the display:flex above (equal specificity, so
     this rule wins by coming later); without it the modal is always shown. */
  #modalBackdrop[hidden] { display: none; }
  #modalBox {
    width: 300px;
    background: #202226;
    border: 1px solid #4a4d52;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
  }
  #modalBox #barracks { margin: 0; padding: 0; border: 0; }
  #modalBox #barracksLine { font-size: 0.95rem; }
  /* colWait modal reuses the barracks look; buttons inherit .barbtns button styling. */
  #modalBox #colWait { margin: 0; padding: 0; border: 0; }
  #modalBox #colWait[hidden] { display: none; }
  #cwLine { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
  #cwBtns { flex-wrap: wrap; }
  .cwbtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .cwbtn .psym { width: 15px; height: 15px; flex: 0 0 auto; }
  .cwbtn .cwstat { font-size: 0.78rem; opacity: 0.85; font-weight: 600; }
  /* release picker: hero card thumbnail + prominent Str/Speed so the choice is legible */
  .cwrel { flex-direction: column; gap: 4px; padding: 8px 10px; }
  .cwrel .cwface { width: 46px; height: auto; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.5); display: block; }
  .cwrel .cwmeta { display: inline-flex; align-items: center; gap: 5px; }
  .cwrel .cwstat { font-size: 0.9rem; opacity: 1; }
  .cwrel .cwrelx { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em; }
  /* modWait (Cheer/Jeer) modal reuses the barracks look; one row per hero target. */
  #modalBox #modWait { margin: 0; padding: 0; border: 0; }
  #modalBox #modWait[hidden] { display: none; }
  #mwLine { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
  #mwTargets { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .mwrow { display: flex; align-items: center; gap: 8px; }
  .mwrow .mwhero { display: inline-flex; align-items: center; gap: 5px; min-width: 52px; }
  .mwrow .psym { width: 16px; height: 16px; flex: 0 0 auto; }
  .mwbtn { min-width: 40px; padding: 4px 8px; border-radius: 6px; border: 1px solid #3a3d42;
           background: #2b2e33; color: #eee; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .mwbtn b { color: #ffd479; }
  .mwbtn:hover { background: #3a3d42; }

  /* decision prompt (lap→column pick / Bacchus trade) */
  #modalBox #promptBox { margin: 0; padding: 0; border: 0; }
  #modalBox #promptBox[hidden] { display: none; }
  #pbLine { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; line-height: 1.35; }
  #pbLine .pbq { font-size: 0.78rem; opacity: 0.7; font-weight: 500; }
  #pbBody { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .pbcol { flex: 1 1 0; min-width: 78px; display: flex; flex-direction: column; align-items: center;
           gap: 3px; padding: 8px 6px; border-radius: 8px; border: 1px solid #3a3d42; background: #2b2e33;
           color: #eee; cursor: pointer; text-align: center; }
  .pbcol:hover:not(:disabled) { background: #3a3d42; border-color: #6a6d72; }
  .pbcol:disabled { opacity: 0.4; cursor: default; }
  .pbcol b { font-size: 0.9rem; }
  .pbcol .pbrung { font-size: 0.72rem; opacity: 0.75; }
  .pbcol .pbnext { font-size: 0.78rem; color: #ffd479; }
  .pbtrade { font-size: 0.86rem; color: #d6dbe2; }
  .pbwarn { font-size: 0.8rem; color: #e08a8a; margin-top: 4px; }
  #pbBtns { flex-wrap: wrap; }

  /* event summary (post-resolution recap) */
  #modalBox #eventSummary { margin: 0; padding: 0; border: 0; }
  #modalBox #eventSummary[hidden] { display: none; }
  #esHead { font-size: 0.98rem; font-weight: 700; color: #ffd479; margin-bottom: 6px; }
  .es-obj { font-size: 0.82rem; color: #b6bcc4; margin-bottom: 10px; line-height: 1.35; }
  .es-obj[hidden] { display: none; }
  #esRows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .esrow { display: flex; flex-direction: column; gap: 2px; font-size: 0.85rem; padding: 4px 0;
           border-bottom: 1px solid #2a2d31; }
  .esrow:last-child { border-bottom: 0; }
  .esmain { display: flex; align-items: center; gap: 6px; }
  .espon { font-size: 0.76rem; color: #ffcf6b; padding-left: 22px; }
  .esrow .psym { width: 15px; height: 15px; flex: 0 0 auto; }
  .esrow .ppl { width: 16px; text-align: right; opacity: 0.85; }
  .esrow .pwho { flex: 1 1 auto; }
  .esrow .ptot { opacity: 0.85; }
  .esrow .prew { min-width: 46px; text-align: right; font-weight: 700; color: #ffd479; }
  .esrow .prew.none { color: #6f757d; font-weight: 400; }
  #esNext { width: 100%; padding: 8px; border-radius: 7px; border: 1px solid #3a3d42;
            background: #2b2e33; color: #eee; cursor: pointer; font-weight: 600; }
  #esNext:hover { background: #3a3d42; }

  /* Colosseum combat — now lives in the left player panel (board stays visible) */
  #modalBox #colFight { margin: 0; padding: 0; border: 0; }
  #colFight[hidden] { display: none; }
  #playerPanel #colFight { margin-top: 4px; }
  /* widen the panel while a fight is on so the combat readout is legible */
  body.incombat #playerPanel { flex-basis: 268px; }
  .colf { cursor: pointer; }
  .colf:hover { background: #30333a; }
  .colf.sel { outline: 2px solid #ffe14a; background: #35322266; }
